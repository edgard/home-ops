---
defaultPodOptions:
  securityContext:
    fsGroup: 0
    fsGroupChangePolicy: OnRootMismatch
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0

controllers:
  main:
    annotations:
      reloader.stakater.com/auto: "true"
    type: deployment
    replicas: 1
    strategy: Recreate
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/qbittorrent
          tag: 5.2.3
        env:
          PUID: "1000"
          PGID: "1000"
          UMASK: "022"
          WEBUI_PORT: "8080"
        probes:
          startup:
            enabled: true
          liveness:
            enabled: true
          readiness:
            enabled: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - SETUID
              - SETGID
      gluetun:
        image:
          repository: qmcgaw/gluetun
          tag: v3.41.3
        env:
          VPN_SERVICE_PROVIDER: protonvpn
          VPN_TYPE: wireguard
          DNS_UPSTREAM_RESOLVER_TYPE: doh
          DNS_UPSTREAM_RESOLVERS: cloudflare
          FIREWALL_INPUT_PORTS: "8080,9999"
          HEALTH_SERVER_ADDRESS: "0.0.0.0:9999"
          PORT_FORWARD_ONLY: "on"
          PUBLICIP_API: cloudflare
          STORAGE_FILEPATH: /tmp/servers.json
          VERSION_INFORMATION: "off"
          VPN_PORT_FORWARDING: "on"
          VPN_PORT_FORWARDING_DOWN_COMMAND: >-
            /bin/sh -c 'wget -qO /dev/null --retry-connrefused
            --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}"
            http://127.0.0.1:8080/api/v2/app/setPreferences'
          VPN_PORT_FORWARDING_UP_COMMAND: >-
            /bin/sh -c 'wget -qO /dev/null --retry-connrefused
            --post-data "json={\"listen_port\":{{ "{{PORT}}" }},\"current_network_interface\":\"{{ "{{VPN_INTERFACE}}" }}\",\"random_port\":false,\"upnp\":false,\"bypass_local_auth\":true,\"bypass_auth_subnet_whitelist_enabled\":false,\"bypass_auth_subnet_whitelist\":\"\",\"web_ui_upnp\":false}"
            http://127.0.0.1:8080/api/v2/app/setPreferences'
        envFrom:
          - secretRef:
              name: qbittorrent-gluetun-credentials
        probes:
          startup:
            enabled: true
            port: 9999
          liveness:
            enabled: true
            port: 9999
          readiness:
            enabled: true
            port: 9999
        securityContext:
          capabilities:
            add:
              - NET_ADMIN

service:
  main:
    controller: main
    type: ClusterIP
    ports:
      http:
        enabled: true
        primary: true
        port: 8080
        protocol: TCP
        targetPort: 8080

route:
  main:
    parentRefs:
      - name: gateway
        namespace: platform-system
        sectionName: https
    hostnames:
      - qbittorrent.edgard.org
    rules:
      - backendRefs:
          - identifier: main
            port: 8080

persistence:
  data:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    advancedMounts:
      main:
        app:
          - path: /config
  media:
    type: persistentVolumeClaim
    existingClaim: media
    advancedMounts:
      main:
        app:
          - path: /media
  dev-net-tun:
    type: hostPath
    hostPath: /dev/net/tun
    hostPathType: CharDevice
    advancedMounts:
      main:
        gluetun:
          - path: /dev/net/tun
