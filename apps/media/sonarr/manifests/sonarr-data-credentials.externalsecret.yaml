---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr-data-credentials
  namespace: media
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: external-secrets-store
    kind: ClusterSecretStore
  target:
    name: sonarr-data-credentials
    creationPolicy: Owner
  data:
    - secretKey: sonarr_db_password
      remoteRef:
        key: sonarr_db_password
