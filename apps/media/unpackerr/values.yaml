---
defaultPodOptions:
  securityContext:
    fsGroup: 0
    fsGroupChangePolicy: OnRootMismatch
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000

controllers:
  main:
    annotations:
      reloader.stakater.com/auto: "true"
    type: deployment
    replicas: 1
    strategy: Recreate
    initContainers:
      verify-media:
        image:
          repository: busybox
          tag: 1.38.0
        command:
          - /bin/sh
          - -ec
          - |
            test "$(cat /storage-check/verified-boot)" = "$(cat /proc/sys/kernel/random/boot_id)"
            awk '$4 == "/" && $5 == "/media" {for (i=7;i<NF;i++) if ($i=="-" && $(i+1)=="zfs" && $(i+2)=="dpool/media") ok=1} END {exit !ok}' /proc/self/mountinfo
    containers:
      app:
        image:
          repository: golift/unpackerr
          tag: v1.0.1
        env:
          UN_WEBSERVER_LISTEN_ADDR: ""
          UN_RADARR_0_URL: http://radarr.media.svc.cluster.local:7878
          UN_SONARR_0_URL: http://sonarr.media.svc.cluster.local:8989
        envFrom:
          - secretRef:
              name: unpackerr-credentials
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
service:
  main:
    controller: main
    enabled: false
persistence:
  boot-check:
    type: hostPath
    hostPath: /run/home-ops-storage
    hostPathType: DirectoryOrCreate
    advancedMounts:
      main:
        verify-media:
          - path: /storage-check
            readOnly: true
  media:
    type: persistentVolumeClaim
    existingClaim: media
    advancedMounts:
      main:
        verify-media:
          - path: /media
            readOnly: true
        app:
          - path: /media
