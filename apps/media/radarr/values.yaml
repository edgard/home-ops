---
defaultPodOptions:
  securityContext:
    fsGroup: 0
    fsGroupChangePolicy: OnRootMismatch
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0

controllers:
  main:
    type: deployment
    replicas: 1
    strategy: Recreate
    initContainers:
      verify-media:
        image:
          repository: busybox
          tag: 1.37.0
        command:
          - /bin/sh
          - -ec
          - |
            test "$(cat /storage-check/verified-boot)" = "$(cat /proc/sys/kernel/random/boot_id)"
            awk '$4 == "/" && $5 == "/media" {for (i=7;i<NF;i++) if ($i=="-" && $(i+1)=="zfs" && $(i+2)=="dpool/media") ok=1} END {exit !ok}' /proc/self/mountinfo
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/radarr
          tag: 7.0.3
        env:
          PUID: "1000"
          PGID: "1000"
          TMPDIR: /tmp
          UMASK: "022"
          RADARR__AUTH__METHOD: External
        probes:
          startup:
            enabled: true
          liveness:
            enabled: true
          readiness:
            enabled: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - SETUID
              - SETGID

service:
  main:
    controller: main
    type: ClusterIP
    ports:
      http:
        enabled: true
        port: 7878
        targetPort: 7878

route:
  main:
    parentRefs:
      - name: gateway
        namespace: platform-system
        sectionName: https
    hostnames:
      - radarr.edgard.org
    rules:
      - backendRefs:
          - identifier: main
            port: 7878

persistence:
  boot-check:
    type: hostPath
    hostPath: /run/home-ops-storage
    hostPathType: DirectoryOrCreate
    advancedMounts:
      main:
        verify-media:
          - path: /storage-check
            readOnly: true
  data:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    globalMounts:
      - path: /config
  media:
    type: persistentVolumeClaim
    existingClaim: media
    advancedMounts:
      main:
        verify-media:
          - path: /media
            readOnly: true
        app:
          - path: /media
