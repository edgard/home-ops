---
defaultPodOptions:
  securityContext:
    fsGroup: 0
    fsGroupChangePolicy: OnRootMismatch
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000

controllers:
  main:
    type: deployment
    replicas: 1
    strategy: Recreate
    pod:
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [
            {
              "name": "multus-lan-bridge",
              "namespace": "kube-system",
              "ips": ["192.168.1.245/24"],
              "gateway": ["192.168.1.1"],
              "mac": "02:42:c0:a8:01:f5"
            }
          ]
    containers:
      app:
        image:
          repository: jellyfin/jellyfin
          tag: 12.1
        env:
          JELLYFIN_PublishedServerUrl: http://192.168.1.245:8096
          TZ: Europe/Warsaw
        ports:
          - name: http
            containerPort: 8096
          - name: discovery
            containerPort: 7359
            protocol: UDP
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: http
              periodSeconds: 10
              failureThreshold: 60
              timeoutSeconds: 5
          liveness:
            enabled: true
            custom: true
            spec:
              # A library scan can delay /health while the HTTP listener stays live.
              tcpSocket:
                port: http
              periodSeconds: 30
              failureThreshold: 5
              timeoutSeconds: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: http
              periodSeconds: 10
              failureThreshold: 6
              timeoutSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 500m
            memory: 1Gi

service:
  main:
    controller: main
    type: ClusterIP
    ports:
      http:
        enabled: true
        port: 8096
        targetPort: http

route:
  main:
    parentRefs:
      - name: gateway
        namespace: platform-system
        sectionName: https
    hostnames:
      - jellyfin.edgard.org
    rules:
      - backendRefs:
          - identifier: main
            port: 8096

persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 20Gi
    globalMounts:
      - path: /config
  cache:
    type: emptyDir
    sizeLimit: 10Gi
    globalMounts:
      - path: /cache
  media:
    type: persistentVolumeClaim
    existingClaim: media
    globalMounts:
      - path: /media
        readOnly: true
