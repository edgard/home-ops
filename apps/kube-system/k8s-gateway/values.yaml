---
fullnameOverride: k8s-gateway

domain: edgard.org

watchedResources:
  - HTTPRoute

ttl: 60

fallthrough:
  enabled: true

extraZonePlugins:
  - name: errors
  - name: health
    configBlock: |-
      lameduck 5s
  - name: ready
  # Forward unknowns to Unifi for non-HTTPRoute edgard.org subdomains
  - name: forward
    parameters: . 192.168.1.1
  - name: loop
  - name: reload

# Use a static ClusterIP so CoreDNS can reference it (forward plugin requires IP, not hostname)
service:
  type: ClusterIP
  port: 53
  clusterIP: 10.96.53.53
  useTcp: true

resources: {}
