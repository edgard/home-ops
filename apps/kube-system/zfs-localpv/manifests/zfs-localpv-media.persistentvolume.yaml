---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  capacity:
    storage: 10Ti
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: media
    name: media
  local:
    path: /var/mnt/dpool/media
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - homelab
