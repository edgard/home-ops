---
defaultPodOptions:
  automountServiceAccountToken: true
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

controllers:
  main:
    replicas: 1
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    serviceAccount:
      identifier: main
    containers:
      app:
        image:
          repository: victoriametrics/victoria-metrics
          tag: v1.157.0@sha256:322a7a92fdcc269280e9c38af94c83bc76827a31b792acbc60e44394e7f29c20
        args:
          - -storageDataPath=/storage
          - -retentionPeriod=1y
          - -promscrape.config=/config/scrape.yaml
          - -deleteAuthKey=file:///run/vm-admin/key
          - -snapshotAuthKey=file:///run/vm-snapshot/key
          - -snapshotsMaxAge=1d
          - -memory.allowedBytes=192MiB
          - -storage.minFreeDiskSpaceBytes=1GiB
        env:
          KUBELET_ADDRESS:
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        probes:
          readiness:
            enabled: true
            type: HTTP
            path: /health
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

serviceAccount:
  main:
    enabled: true

rbac:
  roles:
    main:
      type: ClusterRole
      rules:
        - apiGroups:
            - ""
          resources:
            - nodes/metrics
          resourceNames:
            - homelab
          verbs:
            - get
  bindings:
    main:
      type: ClusterRoleBinding
      roleRef:
        identifier: main
      subjects:
        - identifier: main
          kind: ServiceAccount

service:
  main:
    controller: main
    ports:
      http:
        port: 8428

persistence:
  storage:
    type: persistentVolumeClaim
    forceRename: victoria-metrics-appdata
    accessMode: ReadWriteOnce
    storageClass: zfs-appdata
    size: 64Gi
    globalMounts:
      - path: /storage
        subPath: data
  config:
    type: configMap
    name: victoria-metrics-scrape
    globalMounts:
      - path: /config
        readOnly: true
  exporter-client:
    type: secret
    name: node-exporter-client-tls
    globalMounts:
      - path: /tls/node-exporter
        readOnly: true
  delete-key:
    type: projected
    sources:
      - serviceAccountToken:
          audience: victoria-metrics-delete
          expirationSeconds: 3600
          path: key
    globalMounts:
      - path: /run/vm-admin
        readOnly: true

  snapshot-key:
    type: secret
    name: restic-credentials
    items:
      - key: VM_SNAPSHOT_KEY
        path: key
    advancedMounts:
      main:
        app:
          - path: /run/vm-snapshot
            readOnly: true
