---
apiVersion: v1
kind: ConfigMap
metadata:
  name: victoria-metrics-scrape
  namespace: platform-system
data:
  scrape.yaml: |-
    global:
      scrape_interval: 60s
      scrape_timeout: 15s
    scrape_configs:
      - job_name: victoria-metrics
        static_configs:
          - targets: ["localhost:8428"]
      - job_name: node-exporter
        scheme: https
        tls_config:
          ca_file: /tls/node-exporter/ca.crt
          cert_file: /tls/node-exporter/tls.crt
          key_file: /tls/node-exporter/tls.key
          server_name: node-exporter.platform-system.svc
        static_configs:
          - targets: ["node-exporter.platform-system.svc:9100"]
            labels: {instance: homelab}
      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.platform-system.svc:8080"]
      - job_name: kubelet
        scheme: https
        metrics_path: /metrics/resource
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          server_name: homelab
        static_configs:
          - targets: ["%{KUBELET_ADDRESS}:10250"]
            labels: {instance: homelab}
      - job_name: uptime
        metrics_path: /probe
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - target_label: __address__
            replacement: blackbox-exporter.platform-system.svc:9115
        static_configs:
          - targets: ["http://storage-maintenance.kube-system.svc.cluster.local:8080/"]
            labels: {instance: storage, group: infrastructure, __param_module: storage_200}
          - targets: ["8.8.8.8:53"]
            labels: {instance: dns-google, group: dns, __param_module: dns_a}
          - targets: ["1.1.1.1:53"]
            labels: {instance: dns-cloudflare, group: dns, __param_module: dns_a}
          - targets: ["9.9.9.9:53"]
            labels: {instance: dns-quad9, group: dns, __param_module: dns_a}
          - targets: ["www.amazon.com"]
            labels: {instance: internet-amazon, group: internet, __param_module: icmp_v4}
          - targets: ["www.google.com"]
            labels: {instance: internet-google, group: internet, __param_module: icmp_v4}
          - targets: ["www.microsoft.com"]
            labels: {instance: internet-microsoft, group: internet, __param_module: icmp_v4}
          - targets: ["www.cloudflare.com"]
            labels: {instance: internet-cloudflare, group: internet, __param_module: icmp_v4}
          - targets: ["www.akamai.com"]
            labels: {instance: internet-akamai, group: internet, __param_module: icmp_v4}
          - targets: ["www.fastly.com"]
            labels: {instance: internet-fastly, group: internet, __param_module: icmp_v4}
      - job_name: uptime-apps
        metrics_path: /probe
        params:
          module: [http_2xx]
        kubernetes_sd_configs:
          - role: service
            namespaces:
              names: [argocd, home-automation, media, selfhosted]
            selectors:
              - role: service
                label: monitoring.edgard.org/uptime=true
        relabel_configs:
          # Service discovery emits one target per port. Probe each routed URL once.
          - action: keep
            source_labels: [__meta_kubernetes_service_port_name]
            regex: http
          - action: keep
            source_labels: [__meta_kubernetes_service_annotation_monitoring_edgard_org_probe_url]
            regex: https://[a-z0-9-]+\.edgard\.org(/[a-zA-Z0-9._~/-]*)?
          - action: keep
            source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_instance]
            regex: "[a-z0-9][a-z0-9-]*"
          - source_labels: [__meta_kubernetes_service_annotation_monitoring_edgard_org_probe_url]
            target_label: __param_target
          - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_instance]
            target_label: instance
          - target_label: group
            replacement: apps
          - target_label: job
            replacement: uptime
          - target_label: __address__
            replacement: blackbox-exporter.platform-system.svc:9115
