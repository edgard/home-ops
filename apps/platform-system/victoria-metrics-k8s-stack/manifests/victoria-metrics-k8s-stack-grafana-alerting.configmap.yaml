          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            conditions: []
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            reducer: last
            refId: B
            type: reduce
        - refId: C
          queryType: ''
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
