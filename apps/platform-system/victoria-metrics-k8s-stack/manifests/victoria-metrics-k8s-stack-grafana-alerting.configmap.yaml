              type: prometheus
              uid: prometheus
            editorMode: code
            expr: (increase(kube_pod_container_status_restarts_total{container!="POD"}[15m]) > 3) * 0 + 1
            instant: true
            intervalMs: 1000
            legendFormat: __auto
            maxDataPoints: 43200
            range: false
