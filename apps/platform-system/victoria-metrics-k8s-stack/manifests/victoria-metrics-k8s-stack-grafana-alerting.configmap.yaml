---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-provisioning
  namespace: platform-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  rules.yaml: |
    apiVersion: 1
    groups:
    - orgId: 1
      name: home-ops-actionable
      folder: Home Ops Alerts
      interval: 1m
      rules:
      - uid: alt-9f7900c1e4c053b2b46b7ea3
        title: BlackboxProbeFailed
        condition: C
        data:
        - refId: A
          queryType: ''
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            datasource:
              type: prometheus
              uid: prometheus
            editorMode: code
            expr: (probe_success == 0) * 0 + 1
            instant: true
            intervalMs: 1000
            legendFormat: __auto
            maxDataPoints: 43200
            range: false
            refId: A
        - refId: B
          queryType: ''
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            conditions: []
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            reducer: last
            refId: B
            type: reduce
        - refId: C
          queryType: ''
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
              operator:
                type: and
              query:
                params:
                - C
              reducer:
                params: []
                type: last
              type: query
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
            type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        keepFiringFor: 0s
        annotations:
          description: Blackbox probe {{ $labels.job }} for {{ $labels.instance }} has failed for 5 minutes.
          summary: '{{ $labels.instance }} is failing blackbox checks'
        labels:
          severity: critical
        isPaused: false
      - uid: alt-116d50f200ea630c8ea3b2aa
        title: NodeFilesystemAlmostFull
        condition: C
        data:
        - refId: A
          queryType: ''
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            datasource:
              type: prometheus
              uid: prometheus
            editorMode: code
            expr: |-
              ((
                node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.*|overlay|squashfs",mountpoint!~"/run.*|/var/lib/kubelet/pods.*"}
                /
                node_filesystem_size_bytes{fstype!~"tmpfs|fuse.*|overlay|squashfs",mountpoint!~"/run.*|/var/lib/kubelet/pods.*"}
              ) < 0.10
              and on(instance, device, mountpoint)
              node_filesystem_readonly{fstype!~"tmpfs|fuse.*|overlay|squashfs",mountpoint!~"/run.*|/var/lib/kubelet/pods.*"} == 0
              ) * 0 + 1
            instant: true
            intervalMs: 1000
            legendFormat: __auto
            maxDataPoints: 43200
            range: false
            refId: A
        - refId: B
          queryType: ''
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            conditions: []
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            reducer: last
            refId: B
            type: reduce
        - refId: C
          queryType: ''
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
              operator:
                type: and
              query:
                params:
                - C
              reducer:
                params: []
                type: last
              type: query
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
            type: threshold
        noDataState: OK
        execErrState: Error
        for: 15m
        keepFiringFor: 0s
        annotations:
          description: '{{ $labels.mountpoint }} on {{ $labels.instance }} has less than 10% space available.'
          summary: '{{ $labels.instance }} filesystem is almost full'
        labels:
          severity: warning
        isPaused: false
      - uid: alt-27ab4e7fa60b571aace6ec3b
        title: NodeMemoryAvailableLow
        condition: C
        data:
        - refId: A
          queryType: ''
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            datasource:
              type: prometheus
              uid: prometheus
            editorMode: code
            expr: (node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"} < 0.10) * 0 + 1
            instant: true
            intervalMs: 1000
            legendFormat: __auto
            maxDataPoints: 43200
            range: false
            refId: A
        - refId: B
          queryType: ''
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            conditions: []
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            reducer: last
            refId: B
            type: reduce
        - refId: C
          queryType: ''
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
              operator:
                type: and
              query:
                params:
                - C
              reducer:
                params: []
                type: last
              type: query
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
            type: threshold
        noDataState: OK
        execErrState: Error
        for: 15m
        keepFiringFor: 0s
        annotations:
          summary: Node available memory is low
          description: The node has had less than 10% available memory for 15 minutes.
        labels:
          severity: warning
        isPaused: false
      - uid: alt-d84c285429731daeb016e862
        title: KubePersistentVolumeFillingUp
        condition: C
        data:
        - refId: A
          queryType: ''
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            datasource:
              type: prometheus
              uid: prometheus
            editorMode: code
            expr: |-
              ((
                kubelet_volume_stats_available_bytes{job="kubelet", namespace=~".*", metrics_path="/metrics"}
                  /
                kubelet_volume_stats_capacity_bytes{job="kubelet", namespace=~".*", metrics_path="/metrics"}
              ) < 0.03
              and
              kubelet_volume_stats_used_bytes{job="kubelet", namespace=~".*", metrics_path="/metrics"} > 0
              unless on (cluster, namespace, persistentvolumeclaim)
              kube_persistentvolumeclaim_access_mode{ access_mode="ReadOnlyMany"} == 1
              unless on (cluster, namespace, persistentvolumeclaim)
              kube_persistentvolumeclaim_labels{label_excluded_from_alerts="true"} == 1) * 0 + 1
            instant: true
            intervalMs: 1000
            legendFormat: __auto
            maxDataPoints: 43200
            range: false
            refId: A
        - refId: B
          queryType: ''
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            conditions: []
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            reducer: last
            refId: B
            type: reduce
        - refId: C
          queryType: ''
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
              operator:
                type: and
              query:
                params:
                - C
              reducer:
                params: []
                type: last
              type: query
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
            type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        keepFiringFor: 0s
        annotations:
          description: The PersistentVolume claimed by {{ $labels.persistentvolumeclaim }} in Namespace {{ $labels.namespace }} {{ with $labels.cluster -}} on Cluster {{ . }} {{- end }} is only {{ $value | humanizePercentage }} free.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubepersistentvolumefillingup
          summary: PersistentVolume is filling up.
        labels:
          severity: warning
        isPaused: false
      - uid: alt-39cd4a839049aeac2c99e713
        title: KubePersistentVolumeErrors
        condition: C
        data:
        - refId: A
          queryType: ''
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            datasource:
              type: prometheus
              uid: prometheus
            editorMode: code
            expr: (kube_persistentvolume_status_phase{phase=~"Failed|Pending",job="kube-state-metrics"} > 0) * 0 + 1
