  contactpoints.yaml: |
    apiVersion: 1
    contactPoints:
    - orgId: 1
      name: telegram
      receivers:
      - uid: home-ops-telegram
        type: telegram
        disableResolveMessage: false
        settings:
          bottoken: $TELEGRAM_BOT_TOKEN
          chatid: $TELEGRAM_CHAT_ID
          parse_mode: HTML
          message: '{{ template "home-ops.telegram.message" . }}'
  policies.yaml: |
    apiVersion: 1
    policies:
    - orgId: 1
      receiver: telegram
      group_by:
      - alertname
      - namespace
      - job
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 6h
      routes:
      - receiver: telegram
        object_matchers:
        - - alertname
          - =~
          - DatasourceNoData|DatasourceError
        group_by:
        - alertname
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 6h
  templates.yaml: |-
    apiVersion: 1
    templates:
    - orgId: 1
      name: home-ops.telegram
      template: "{{ define \"home-ops.telegram.alert\" -}}\n{{- with .Annotations.summary }}<b>{{ . | html }}</b>{{ end }}\n{{- with .Annotations.description }}\n<blockquote>{{ . | html }}</blockquote>{{ end }}\n{{- with .Labels.severity }}\n<b>Severity:</b> {{ . | title | html }}{{ end }}\n{{- with .Labels.namespace }}\n<b>Namespace:</b> <code>{{ . | html }}</code>{{ end }}\n{{- if .Labels.name }}\n<b>Target:</b> <code>{{ .Labels.name | html }}</code>\n{{- else if .Labels.pod }}\n<b>Target:</b> <code>{{ .Labels.pod | html }}</code>\n{{- else if .Labels.instance }}\n<b>Target:</b> <code>{{ .Labels.instance | html }}</code>{{ end }}\n{{- with .Annotations.runbook_url }}\n\U0001F4D6 <a href=\"{{ . | html }}\">Runbook</a>{{ end }}\n{{- end }}\n\n{{ define \"home-ops.telegram.alert-list\" -}}\n{{- /* Alerts | first 10: slice caps Telegram output before Grafana's 4096-byte limit. */ -}}\n{{- if gt (len .) 10 }}\n  {{- range $index, $alert := slice . 0 10 }}\n    {{- if $index }}\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500{{ end }}\n{{ template \"home-ops.telegram.alert\" $alert }}\n  {{- end }}\n\n<i>{{ len (slice . 10) }} additional alert(s) omitted.</i>\n{{- else }}\n  {{- range $index, $alert := . }}\n    {{- if $index }}\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500{{ end }}\n{{ template \"home-ops.telegram.alert\" $alert }}\n  {{- end }}\n{{- end }}\n{{- end }}\n\n{{ define \"home-ops.telegram.message\" -}}\n<b>\U0001F3E0 Home Ops \xB7 Monitoring</b>\n{{- if gt (len .Alerts.Firing) 0 }}\n\n{{ if eq .CommonLabels.severity \"critical\" }}\U0001F534{{ else }}\u26A0\uFE0F{{ end }} <b>FIRING \xB7 {{ .CommonLabels.alertname | html }} ({{ len .Alerts.Firing }})</b>\n{{ template \"home-ops.telegram.alert-list\" .Alerts.Firing }}\n{{- end }}\n{{- if gt (len .Alerts.Resolved) 0 }}\n\n\u2705 <b>RESOLVED \xB7 {{ .CommonLabels.alertname | html }} ({{ len .Alerts.Resolved }})</b>\n{{ template \"home-ops.telegram.alert-list\" .Alerts.Resolved }}\n{{- end }}\n{{- end }}"
