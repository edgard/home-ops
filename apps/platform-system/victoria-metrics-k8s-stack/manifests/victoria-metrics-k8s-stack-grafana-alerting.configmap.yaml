          queryType: ''
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            datasource:
              type: prometheus
              uid: prometheus
            editorMode: code
            expr: (sum by (namespace, pod, container) (increase(container_oom_events_total{container!="", pod!=""}[10m])) > 0) * 0 + 1
