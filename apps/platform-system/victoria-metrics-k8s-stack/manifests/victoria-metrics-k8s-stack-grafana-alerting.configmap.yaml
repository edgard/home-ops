          datasourceUid: prometheus
          model:
            datasource:
              type: prometheus
              uid: prometheus
            editorMode: code
            expr: |-
              ((certmanager_certificate_expiration_timestamp_seconds - time()) < 604800
              and
              (certmanager_certificate_expiration_timestamp_seconds - time()) > 0
              ) * 0 + 1
            instant: true
            intervalMs: 1000
            legendFormat: __auto
            maxDataPoints: 43200
            range: false
