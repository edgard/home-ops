---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-credentials
  namespace: platform-system
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: external-secrets-store
    kind: ClusterSecretStore
  target:
    name: restic-credentials
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      data:
        VM_SNAPSHOT_KEY: "{{ printf \"victoria-metrics/snapshot/v1:%s\" .RESTIC_PASSWORD | sha256sum }}"
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: restic_server_password
    - secretKey: RESTIC_REPOSITORY_ID
      remoteRef:
        key: restic_repository_id
