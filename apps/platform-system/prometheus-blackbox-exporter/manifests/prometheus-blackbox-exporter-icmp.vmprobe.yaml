---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: prometheus-blackbox-exporter-icmp
  namespace: platform-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  jobName: prometheus-blackbox-exporter-icmp
  interval: 1m
  scrapeTimeout: 10s
  module: icmp
  vmProberSpec:
    url: prometheus-blackbox-exporter.platform-system.svc.cluster.local:9115
  targets:
    staticConfig:
      labels:
        group: connectivity
      targets:
        - www.amazon.com
        - www.google.com
        - www.microsoft.com
        - www.cloudflare.com
        - www.akamai.com
        - www.fastly.com
