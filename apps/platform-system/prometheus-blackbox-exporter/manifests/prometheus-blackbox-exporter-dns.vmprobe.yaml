---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: prometheus-blackbox-exporter-dns
  namespace: platform-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  jobName: prometheus-blackbox-exporter-dns
  interval: 1m
  scrapeTimeout: 10s
  module: dns_edgard_org
  vmProberSpec:
    url: prometheus-blackbox-exporter.platform-system.svc.cluster.local:9115
  targets:
    staticConfig:
      labels:
        group: dns
      targets:
        - 8.8.8.8:53
        - 1.1.1.1:53
        - 9.9.9.9:53
