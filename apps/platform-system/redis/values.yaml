---
global:
  createDefaultServiceAccount: false
defaultPodOptions:
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 120
  securityContext:
    runAsUser: 999
    runAsGroup: 999
    runAsNonRoot: true
controllers:
  main:
    type: deployment
    replicas: 1
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    initContainers:
      permissions:
        image:
          repository: docker.io/library/redis
          tag: 8.10.3
          digest: sha256:de1068af6f552240dfab67bcc9bfef99bfc60f776bb4580ef077ea4c8c97e848
        command:
          - /bin/sh
          - -ec
          - set -eu; if [ "$(stat -c '%u:%g' /data)" != '999:999' ]; then chown 999:999 /data; fi; test "$(stat -c '%u:%g' /data)" = '999:999'
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
            add:
              - CHOWN
              - FOWNER
              - DAC_OVERRIDE
      users:
        image:
          repository: docker.io/library/redis
          tag: 8.10.3
          digest: sha256:de1068af6f552240dfab67bcc9bfef99bfc60f776bb4580ef077ea4c8c97e848
        command:
          - /bin/sh
          - -ec
          - |
            set -eu
            if [ ! -e /data/users.acl ]; then
              test -n "$REDIS_ADMIN_PASSWORD"
              umask 077
              password_hash=$(printf '%s' "$REDIS_ADMIN_PASSWORD" | sha256sum | cut -d ' ' -f 1)
              printf 'user default off\nuser admin on #%s ~* &* +@all\n' "$password_hash" > /data/users.acl.bootstrap
              chmod 0600 /data/users.acl.bootstrap
              mv /data/users.acl.bootstrap /data/users.acl
            fi
            test -s /data/users.acl || { echo >&2 'Existing Redis ACL file is empty; refusing replacement'; exit 1; }
            test "$(stat -c '%u:%g' /data/users.acl)" = '999:999' || { echo >&2 'Redis ACL ownership must be uid/gid 999'; exit 1; }
        env:
          REDIS_ADMIN_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: redis-credentials
                key: redis_admin_password
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
    containers:
      app:
        image:
          repository: docker.io/library/redis
          tag: 8.10.3
          digest: sha256:de1068af6f552240dfab67bcc9bfef99bfc60f776bb4580ef077ea4c8c97e848
        command:
          - /bin/sh
          - -ec
          - umask 077; exec redis-server /etc/redis/redis.conf
        env:
          REDISCLI_AUTH:
            valueFrom:
              secretKeyRef:
                name: redis-credentials
                key: redis_admin_password
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 1Gi
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - test "$(redis-cli -e --no-auth-warning --user admin -h 127.0.0.1 ping)" = PONG
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 30
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - test "$(redis-cli -e --no-auth-warning --user admin -h 127.0.0.1 ping)" = PONG
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - test "$(redis-cli -e --no-auth-warning --user admin -h 127.0.0.1 ping)" = PONG
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
service:
  main:
    forceRename: redis
    controller: main
    ports:
      redis:
        port: 6379
        targetPort: 6379
        protocol: TCP
persistence:
  data:
    type: persistentVolumeClaim
    existingClaim: redis
    globalMounts:
      - path: /data
  config:
    type: configMap
    identifier: config
    advancedMounts:
      main:
        app:
          - path: /etc/redis
            readOnly: true
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
configMaps:
  config:
    forceRename: redis-config
    data:
      redis.conf: |-
        bind 0.0.0.0
        protected-mode yes
        port 6379
        dir /data
        aclfile /data/users.acl
        maxmemory 256mb
        maxmemory-policy noeviction
        appendonly yes
        appendfsync everysec
        save ""
