---
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-share-uptime
  namespace: platform-system
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 300
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: share
          image: python:3.14-alpine@sha256:5862d971d1f0ae26b258cefa4e893556b1d3aba81bd2ff30888704ad378bab67
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef: {name: grafana-credentials, key: GF_SECURITY_ADMIN_USER}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: grafana-credentials, key: GF_SECURITY_ADMIN_PASSWORD}
          command:
            - python
            - -c
            - |-
              import base64
              import json
              import os
              from urllib.error import HTTPError
              from urllib.request import Request, urlopen

              url = "https://grafana.edgard.org/api/dashboards/uid/uptime/public-dashboards"
              # This is the stable address published by the login-free status hostname.
              token = "2f8238a85f9b4edaa3a77ca397cf9973"
              settings = {"isEnabled": True, "share": "public",
                          "annotationsEnabled": False, "timeSelectionEnabled": False}
              auth = base64.b64encode(f"{os.environ['ADMIN_USER']}:{os.environ['ADMIN_PASSWORD']}".encode()).decode()
              def request(method, endpoint, body=None):
                  req = Request(endpoint, method=method, data=json.dumps(body).encode() if body else None,
                                headers={"Authorization": "Basic " + auth, "Content-Type": "application/json"})
                  with urlopen(req, timeout=15) as response:
                      return json.load(response)

              try:
                  share = request("GET", url)
              except HTTPError as error:
                  if error.code != 404:
                      raise
                  share = request("POST", url, dict(settings, accessToken=token))
              if share.get("dashboardUid") != "uptime" or share.get("accessToken") != token:
                  raise RuntimeError("The uptime dashboard has an unexpected sharing identity")
              if any(share.get(key) != value for key, value in settings.items()):
                  updated = request("PATCH", url + "/" + share["uid"], settings)
                  if any(updated.get(key) != value for key, value in settings.items()):
                      raise RuntimeError("Uptime dashboard sharing settings did not converge")
