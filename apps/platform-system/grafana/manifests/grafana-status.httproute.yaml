---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-status
  namespace: platform-system
spec:
  parentRefs:
    - name: gateway
      namespace: platform-system
      sectionName: https
  hostnames:
    - status.edgard.org
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: grafana.edgard.org
            path:
              type: ReplaceFullPath
              replaceFullPath: /d/uptime/service-uptime
            statusCode: 302
