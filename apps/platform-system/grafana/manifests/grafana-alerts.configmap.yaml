---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerts
  namespace: platform-system
data:
  notifications.yaml: |
    apiVersion: 1
    templates:
      - orgId: 1
        name: homeops.telegram
        template: |-
          {{ define "homeops.telegram.alert" -}}
          {{- $rule := .Labels.alertname -}}
          {{- $target := or .Labels.instance .Labels.rulename "Monitoring" | printf "%.80s" | html -}}
          {{- $firing := eq .Status "firing" -}}
          {{- if and (not $firing) .Annotations.grafana_state_reason -}}
          ⚪ <b>{{ $target }} · Alert closed</b>
          Grafana closed the alert ({{ .Annotations.grafana_state_reason | printf "%.60s" | html }}). Target health is unconfirmed.
          {{- else if eq $rule "Uptime probe failed" -}}
          {{ if $firing }}🔴{{ else }}🟢{{ end }} <b>{{ if eq .Labels.instance "storage" }}Storage readiness{{ else }}{{ $target }}{{ end }} · {{ if $firing }}Check failed{{ else }}Recovered{{ end }}</b>
          {{ if $firing }}Five consecutive probes failed.{{ with .Annotations.description }} {{ . | printf "%.120s" | html }}{{ end }}{{ else }}Two consecutive probes passed.{{ end }}
          {{- else if eq $rule "Monitoring scrape missing" -}}
          {{ if $firing }}🟡{{ else }}🟢{{ end }} <b>{{ $target }} · {{ if $firing }}Monitoring data missing{{ else }}Samples resumed{{ end }}</b>
          {{ if $firing }}Check the VictoriaMetrics scrape for {{ else }}Fresh samples received from {{ end }}{{ .Labels.job | printf "%.60s" | html }}.
          {{- else if or (eq $rule "DatasourceNoData") (eq $rule "DatasourceError") -}}
          {{ if $firing }}🟡{{ else }}⚪{{ end }} <b>{{ $target }} · {{ if not $firing }}Evaluation alert closed{{ else if eq $rule "DatasourceNoData" }}No evaluation data{{ else }}Evaluation error{{ end }}</b>
          Check the rule evaluation in Grafana.
          {{- else -}}
          {{ if $firing }}🔔{{ else }}⚪{{ end }} <b>{{ or $rule "Grafana alert" | printf "%.80s" | html }} · {{ if $firing }}Firing{{ else }}Closed{{ end }}</b>
          {{ with .Annotations.summary }}{{ . | printf "%.120s" | html }}{{ end }}
          {{- end -}}
          {{- end }}

          {{ define "homeops.telegram" -}}
          {{ if gt (len .Alerts) 1 }}{{ len .Alerts.Firing }} firing · {{ len .Alerts.Resolved }} resolved{{ "\n\n" }}{{ end -}}
          {{ range $i, $alert := .Alerts }}{{ if lt $i 2 }}{{ if $i }}{{ "\n\n" }}{{ end }}{{ template "homeops.telegram.alert" $alert }}{{ end }}{{ end }}
          {{ if gt (len .Alerts) 2 }}Showing 2 of {{ len .Alerts }} alerts.
          {{ end -}}
          {{ if eq .CommonLabels.job "uptime" -}}
          <a href="https://grafana.edgard.org/d/uptime/service-uptime{{ with .CommonLabels.instance }}{{ if le (len .) 128 }}?var-target={{ . | urlquery }}{{ end }}{{ end }}">View uptime</a>
          {{- else -}}
          <a href="https://grafana.edgard.org/alerting/list">View alerts</a>
          {{- end -}}
          {{ if eq (len .Alerts) 1 }}{{ with index .Alerts 0 }}{{ if and (eq .Status "firing") .SilenceURL (le (len .SilenceURL) 320) }} · <a href="{{ .SilenceURL | html }}">Silence</a>{{ end }}{{ end }}{{ end }}
          {{- end }}
    contactPoints:
      - orgId: 1
        name: Telegram
        receivers:
          - uid: home-ops-telegram
            type: telegram
            disableResolveMessage: false
            settings:
              bottoken: $TELEGRAM_BOT_TOKEN
              chatid: "$TELEGRAM_CHAT_ID"
              message: '{{ template "homeops.telegram" . }}'
              parse_mode: HTML
              disable_web_page_preview: true
    policies:
      - orgId: 1
        receiver: Telegram
        group_by: [grafana_folder, alertname, instance]
        group_wait: 0s
        group_interval: 30s
        repeat_interval: 120h
  rules.yaml: |-
    apiVersion: 1
    groups:
      - orgId: 1
        name: Local monitoring
        folder: Home Ops
        interval: 20s
        rules:
          - uid: uptime-probe
            title: Uptime probe failed
            condition: B
            for: 0s
            noDataState: KeepLast
            execErrState: Error
            annotations:
              __dashboardUid__: uptime
              __panelId__: "1"
              summary: "Five consecutive probes failed for {{ $labels.instance }}"
              description: >-
                {{ if eq $labels.instance "storage" }}Check the storage-maintenance health pod and its Service endpoints.
                {{- else if eq $labels.group "dns" }}Check DNS resolution from the cluster.
                {{- else if eq $labels.group "internet" }}Compare the other internet probes.
                {{- else }}Check the application and its Gateway route.{{ end }}
            data:
              - refId: A
                datasourceUid: metrics
                relativeTimeRange: {from: 600, to: 0}
                model:
                  refId: A
                  instant: true
                  range: false
                  # 2 confirms an incident, 1 preserves state, 0 confirms recovery.
                  expr: |
                    WITH (
                      result = probe_success{job="uptime"},
                      targets = last_over_time(up{job="uptime"}[1h]),
                      healthy = (count_over_time(result[2m]) >= 2) and (min_over_time(result[2m]) == 1),
                      failed = (count_over_time(result[5m]) >= 5) and (max_over_time(result[5m]) == 0)
                    )
                    (failed * 0 + 2) or (healthy * 0) or (targets * 0 + 1)
              - refId: B
                datasourceUid: __expr__
                relativeTimeRange: {from: 0, to: 0}
                model:
                  refId: B
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: {type: gt, params: [1]}
                      unloadEvaluator: {type: lt, params: [1]}
          - uid: monitoring-scrape
            title: Monitoring scrape missing
            condition: B
            for: 2m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "Missing monitoring samples for {{ $labels.job }} / {{ $labels.instance }}"
            data:
              - refId: A
                datasourceUid: metrics
                relativeTimeRange: {from: 600, to: 0}
                model:
                  refId: A
                  instant: true
                  range: false
                  # The historical labels preserve identity when a scrape disappears.
                  # A successful probe scrape must also contain a fresh result.
                  expr: |
                    WITH (
                      alive = last_over_time(up[90s]) == 1,
                      available = (alive unless on(job) up{job="uptime"})
                        or (alive and present_over_time(probe_success{job="uptime"}[90s])),
                      expected = last_over_time(up[1h])
                    )
                    (available * 0) or (expected * 0 + 1)
              - refId: B
                datasourceUid: __expr__
                relativeTimeRange: {from: 0, to: 0}
                model:
                  refId: B
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: {type: gt, params: [0]}
