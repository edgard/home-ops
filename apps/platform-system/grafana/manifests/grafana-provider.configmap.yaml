---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provider
  namespace: platform-system
data:
  dashboards.yaml: |-
    apiVersion: 1
    providers:
      - name: Home Ops
        orgId: 1
        type: file
        allowUiUpdates: false
        options:
          path: /etc/grafana/dashboards
