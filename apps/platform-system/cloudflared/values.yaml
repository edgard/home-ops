---
defaultPodOptions:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532

controllers:
  main:
    annotations:
      reloader.stakater.com/auto: "true"
    replicas: 1
    strategy: Recreate
    containers:
      app:
        image:
          repository: docker.io/cloudflare/cloudflared
          tag: 2026.11.1@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d
        args:
          - tunnel
          - --no-autoupdate
          - --metrics
          - 0.0.0.0:2000
          - run
          - --token-file
          - /var/run/cloudflared/token
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ready
                port: 2000
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

persistence:
  credentials:
    type: secret
    name: cloudflared-credentials
    defaultMode: 288 # 0440
    globalMounts:
      - path: /var/run/cloudflared
        readOnly: true
