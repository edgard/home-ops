---
global:
  createDefaultServiceAccount: false
defaultPodOptions:
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 120
  securityContext:
    runAsUser: 999
    runAsGroup: 999
    runAsNonRoot: true
controllers:
  main:
    type: deployment
    replicas: 1
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    initContainers:
      permissions:
        image:
          repository: docker.io/library/postgres
          tag: 18.3-trixie
          digest: sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
        command:
          - /bin/sh
          - -ec
          - |
            set -eu
            # Only create/chown fresh directories; never recursively rewrite a live cluster.
            if [ -L /var/lib/postgresql/18 ] || [ -L /var/lib/postgresql/18/docker ]; then
              echo >&2 'PGDATA must use real directories; refusing unsafe startup'
              exit 1
            fi
            if [ ! -d /var/lib/postgresql/18/docker ]; then
              install -d -m 0700 -o 999 -g 999 /var/lib/postgresql/18/docker
            fi
            # NAS parents can pass setgid to a newly created empty directory.
            # Normalize only an empty, correctly owned bootstrap directory.
            if [ "$(stat -c '%u:%g' /var/lib/postgresql/18/docker)" = '999:999' ]; then
              entries=$(find /var/lib/postgresql/18/docker -mindepth 1 -maxdepth 1 -printf x -quit)
              if [ -z "$entries" ]; then
                chmod 00700 /var/lib/postgresql/18/docker
              fi
            fi
            test "$(stat -c '%u:%g:%a' /var/lib/postgresql/18/docker)" = '999:999:700' || {
              echo >&2 'PGDATA must be NAS-owned by uid/gid 999 with mode 0700; refusing unsafe startup'
              exit 1
            }
            install -d -m 3775 -o 999 -g 999 /var/run/postgresql
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
            add:
              - CHOWN
              - FOWNER
              - DAC_OVERRIDE
    containers:
      app:
        image:
          repository: docker.io/library/postgres
          tag: 18.3-trixie
          digest: sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
        args:
          - postgres
          - -c
          - listen_addresses=*
          - -c
          - max_connections=200
          - -c
          - shared_buffers=256MB
          - -c
          - work_mem=4MB
          - -c
          - password_encryption=scram-sha-256
        env:
          PGDATA: /var/lib/postgresql/18/docker
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
          POSTGRES_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: postgresql-credentials
                key: postgresql_admin_password
          PGPASSWORD:
            valueFrom:
              secretKeyRef:
                name: postgresql-credentials
                key: postgresql_admin_password
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            memory: 4Gi
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - psql
                  - --host=127.0.0.1
                  - --username=postgres
                  - --dbname=postgres
                  - --no-password
                  - --tuples-only
                  - --command=SELECT 1
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 60
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - psql
                  - --host=127.0.0.1
                  - --username=postgres
                  - --dbname=postgres
                  - --no-password
                  - --tuples-only
                  - --command=SELECT 1
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - psql
                  - --host=127.0.0.1
                  - --username=postgres
                  - --dbname=postgres
                  - --no-password
                  - --tuples-only
                  - --command=SELECT 1
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
service:
  main:
    forceRename: postgresql
    controller: main
    ports:
      postgresql:
        port: 5432
        targetPort: 5432
        protocol: TCP
persistence:
  data:
    type: persistentVolumeClaim
    existingClaim: postgresql
    advancedMounts:
      main:
        permissions:
          - path: /var/lib/postgresql
        app:
          - path: /var/lib/postgresql
  run:
    type: emptyDir
    advancedMounts:
      main:
        permissions:
          - path: /var/run/postgresql
        app:
          - path: /var/run/postgresql
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
  shm:
    type: emptyDir
    medium: Memory
    sizeLimit: 256Mi
    advancedMounts:
      main:
        app:
          - path: /dev/shm
