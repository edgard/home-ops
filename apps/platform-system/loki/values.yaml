---
deploymentMode: Monolithic

defaults:
  automountServiceAccountToken: false

serviceAccount:
  automountServiceAccountToken: false

loki:
  auth_enabled: false
  analytics:
    reporting_enabled: false
  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1
  compactor:
    delete_request_store: filesystem
    retention_enabled: true
  limits_config:
    allow_structured_metadata: true
    discover_log_levels: true
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    retention_period: 720h
    volume_enabled: true
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem

singleBinary:
  replicas: 1
  affinity: {}
  podDisruptionBudget:
    enabled: false
  persistence:
    enabled: true
    enableStatefulSetAutoDeletePVC: true
    accessModes:
      - ReadWriteOnce
    size: 30Gi
    storageClass: nfs-fast
    whenDeleted: Retain
    whenScaled: Retain

gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
ruler:
  enabled: false
sidecar:
  rules:
    enabled: false
minio:
  enabled: false
test:
  enabled: false

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0

monitoring:
  dashboards:
    enabled: true
    defaultDashboardsTimezone: Europe/Warsaw
    loki-bloom-build:
      enabled: false
    loki-bloom-gateway:
      enabled: false
    loki-chunks:
      enabled: false
    loki-deletion:
      enabled: false
    loki-logs:
      enabled: true
    loki-mixin-recording-rules:
      enabled: false
    loki-operational:
      enabled: false
    loki-reads:
      enabled: false
    loki-reads-resources:
      enabled: false
    loki-retention:
      enabled: true
    loki-thanos-object-storage:
      enabled: false
    loki-writes:
      enabled: false
    loki-writes-resources:
      enabled: false
  alerts:
    enabled: true
    disabled:
      LokiRequestLatency: true
      LokiTooManyCompactorsRunning: true
    overrides:
      LokiRequestErrors:
        severity: critical
      LokiRequestPanics:
        severity: critical
      LokiCompactorHasNotSuccessfullyRunCompaction:
        severity: critical
  additionalPrometheusRules:
    home-ops:
      groups:
        - name: home-ops.loki
          rules:
            - alert: LokiDiscardingLogs
              expr: sum by (reason) (rate(loki_discarded_samples_total[5m])) > 0
              for: 15m
              labels:
                severity: critical
              annotations:
                summary: "Loki is discarding log samples"
                description: "Loki has continuously discarded log samples for reason {{ $labels.reason }} for 15 minutes."
            - alert: LokiStorageBackendAlmostFull
              expr: |
                (
                  kubelet_volume_stats_available_bytes{
                    namespace="platform-system",
                    persistentvolumeclaim="storage-loki-0"
                  }
                  /
                  kubelet_volume_stats_capacity_bytes{
                    namespace="platform-system",
                    persistentvolumeclaim="storage-loki-0"
                  }
                ) < 0.10
              for: 15m
              labels:
                severity: critical
              annotations:
                summary: "Loki NFS storage is almost full"
                description: "The NFS share backing storage-loki-0 has less than 10% free space for 15 minutes."
  serviceMonitor:
    enabled: true
