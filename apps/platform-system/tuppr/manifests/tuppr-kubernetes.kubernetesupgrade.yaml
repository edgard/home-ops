---
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
spec:
  kubernetes:
    # renovate: datasource=github-tags depName=siderolabs/kubelet
    version: v1.36.6
  healthChecks:
    - apiVersion: v1
      kind: Node
      name: homelab
      expr: status.conditions.exists(c, c.type == "Ready" && c.status == "True")
    - apiVersion: apps/v1
      kind: DaemonSet
      namespace: kube-system
      name: zfs-localpv-node
      expr: status.observedGeneration == object.metadata.generation && status.desiredNumberScheduled == 1 && status.updatedNumberScheduled == 1 && status.numberReady == 1
