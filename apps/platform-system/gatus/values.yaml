    - name: dns-quad9
      group: dns
      url: 9.9.9.9
      interval: 1m
      dns:
        query-name: edgard.org
        query-type: A
      conditions:
        - "[DNS_RCODE] == NOERROR"
      alerts:
        - type: telegram
        - type: homeassistant
    - name: internet-amazon
      group: internet
      url: icmp://www.amazon.com
      client:
        network: ip4
      interval: 1m
      conditions:
