    - name: dns-google
      group: dns
      url: 8.8.8.8
      interval: 1m
      dns:
        query-name: edgard.org
        query-type: A
      conditions:
        - "[DNS_RCODE] == NOERROR"
      alerts:
        - type: telegram
        - type: homeassistant
    - name: dns-cloudflare
      group: dns
      url: 1.1.1.1
      interval: 1m
      dns:
        query-name: edgard.org
