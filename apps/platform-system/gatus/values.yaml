---
deployment:
  strategy: Recreate

annotations:
  reloader.stakater.com/auto: "true"

image:
  repository: ghcr.io/twin/gatus
  tag: v5.37.0

serviceAccount:
  create: false
  autoMount: false

securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 100Mi

gateway:
  route:
    enabled: true
    parentRefs:
      - name: gateway
        namespace: platform-system
        sectionName: https
    hosts:
      - status.edgard.org

envFrom:
  - secretRef:
      name: gatus-credentials

persistence:
  enabled: false

config:
  storage:
    type: memory
  metrics: false
  alerting:
    homeassistant:
      url: http://homeassistant.home-automation.svc:8123
      token: "$HOMEASSISTANT_GATUS_TOKEN"
      default-alert:
        failure-threshold: 5
        success-threshold: 2
        send-on-resolved: true
    telegram:
      token: "$TELEGRAM_BOT_TOKEN"
      id: "$TELEGRAM_CHAT_ID"
      default-alert:
        failure-threshold: 5
        success-threshold: 2
        send-on-resolved: true
  endpoints:
    - name: argocd
      group: apps
      url: https://argocd.edgard.org
      interval: 1m
      conditions:
        - "[STATUS] >= 200"
        - "[STATUS] < 300"
      alerts:
        - type: telegram
        - type: homeassistant
    - name: homeassistant
      group: apps
      url: https://homeassistant.edgard.org
      interval: 1m
      conditions:
        - "[STATUS] >= 200"
        - "[STATUS] < 300"
      alerts:
        - type: telegram
        - type: homeassistant
    - name: scrypted
      group: apps
      url: https://scrypted.edgard.org
      interval: 1m
      conditions:
        - "[STATUS] >= 200"
        - "[STATUS] < 300"
      alerts:
        - type: telegram
        - type: homeassistant
    - name: bazarr
      group: apps
      url: https://bazarr.edgard.org
      interval: 1m
      conditions:
        - "[STATUS] >= 200"
        - "[STATUS] < 300"
      alerts:
        - type: telegram
        - type: homeassistant
    - name: jellyfin
      group: apps
      url: https://jellyfin.edgard.org/health
      interval: 1m
      conditions:
        - "[STATUS] >= 200"
        - "[STATUS] < 300"
      alerts:
        - type: telegram
        - type: homeassistant
    - name: prowlarr
      group: apps
      url: https://prowlarr.edgard.org
      interval: 1m
      conditions:
        - "[STATUS] >= 200"
        - "[STATUS] < 300"
      alerts:
        - type: telegram
        - type: homeassistant
    - name: qbittorrent
      group: apps
      url: https://qbittorrent.edgard.org
      interval: 1m
      conditions:
        - "[STATUS] >= 200"
        - "[STATUS] < 300"
      alerts:
        - type: telegram
        - type: homeassistant
    - name: radarr
      group: apps
      url: https://radarr.edgard.org
      interval: 1m
      conditions:
        - "[STATUS] >= 200"
        - "[STATUS] < 300"
      alerts:
        - type: telegram
        - type: homeassistant
    - name: sonarr
      group: apps
      url: https://sonarr.edgard.org
      interval: 1m
      conditions:
        - "[STATUS] >= 200"
        - "[STATUS] < 300"
      alerts:
        - type: telegram
        - type: homeassistant
    - name: atuin
      group: apps
      url: https://atuin.edgard.org
      interval: 1m
      conditions:
        - "[STATUS] >= 200"
        - "[STATUS] < 300"
      alerts:
        - type: telegram
