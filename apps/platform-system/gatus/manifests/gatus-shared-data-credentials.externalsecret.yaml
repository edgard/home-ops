---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shared-data-gatus-credentials
  namespace: platform-system
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: external-secrets-store
    kind: ClusterSecretStore
  target:
    name: shared-data-gatus-credentials
    creationPolicy: Owner
  data:
    - secretKey: SHARED_DATA_GATUS_TOKEN
      remoteRef:
        key: shared_data_gatus_token
