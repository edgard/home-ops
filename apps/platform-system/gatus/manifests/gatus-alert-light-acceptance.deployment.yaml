---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus-alert-light-acceptance
  namespace: platform-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: gatus-alert-light-acceptance
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fixture
          image: python:3.14.8-alpine
          command:
            - python
            - -B
            - /fixture/server.py
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: fixture
              mountPath: /fixture
              readOnly: true
            - name: control
              mountPath: /control
      volumes:
        - name: fixture
          configMap:
            name: gatus-alert-light-acceptance
        - name: control
          emptyDir: {}
