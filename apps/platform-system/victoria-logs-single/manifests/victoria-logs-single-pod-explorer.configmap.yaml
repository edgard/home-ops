---
apiVersion: v1
kind: ConfigMap
metadata:
  name: victoria-logs-pod-explorer
  namespace: platform-system
  labels:
    grafana_dashboard: "1"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  pod-logs.json: |-
    {
      "annotations": {
        "list": []
      },
      "description": "Kubernetes container logs collected by VLAgent and stored in VictoriaLogs.",
      "editable": false,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "victorialogs"
          },
          "description": "Use the ad hoc filter to narrow by namespace, app, container, pod, node, image, or runtime. The text box searches the log message.",
          "gridPos": {
            "h": 24,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "dedupStrategy": "none",
            "enableInfiniteScrolling": true,
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "victorialogs"
              },
              "editorMode": "code",
              "expr": "cluster:=\"homelab\" kubernetes.pod_namespace:* | $search",
              "maxLines": 1000,
              "queryType": "instant",
              "refId": "A"
            }
          ],
          "title": "Pod logs",
          "type": "logs"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 42,
      "tags": [
        "kubernetes",
        "logs",
        "victorialogs"
      ],
      "templating": {
        "list": [
          {
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "victorialogs"
            },
            "filters": [],
            "name": "filters",
            "type": "adhoc"
          },
          {
            "current": {
              "selected": true,
              "text": "*",
              "value": "*"
            },
            "label": "Message search",
            "name": "search",
            "options": [
              {
                "selected": true,
                "text": "*",
                "value": "*"
              }
            ],
            "query": "*",
            "type": "textbox"
          }
        ]
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Kubernetes Pod Logs",
      "uid": "home-ops-pod-logs",
      "version": 1
    }
