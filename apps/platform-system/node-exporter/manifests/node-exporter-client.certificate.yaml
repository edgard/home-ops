---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: node-exporter-client
  namespace: platform-system
spec:
  secretName: node-exporter-client-tls
  commonName: victoria-metrics
  usages:
    - digital signature
    - client auth
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: node-exporter
