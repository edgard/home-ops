---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: gateway-parameters
  namespace: platform-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      useListenerPortAsContainerPort: true
      envoyService:
        type: ClusterIP
      envoyDeployment:
        replicas: 1
        strategy:
          type: Recreate
        container:
          securityContext:
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |-
              [
                {
                  "name": "multus-lan-bridge",
                  "namespace": "kube-system",
                  "ips": ["192.168.1.241/24"],
                  "gateway": ["192.168.1.1"],
                  "mac": "02:42:c0:a8:01:f1"
                }
              ]
  telemetry:
    metrics:
      prometheus:
        disable: true
