---
global:
  createDefaultServiceAccount: false
defaultPodOptions:
  automountServiceAccountToken: true
  terminationGracePeriodSeconds: 120
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    runAsNonRoot: false
controllers:
  main:
    type: cronjob
    serviceAccount:
      name: shared-data
    cronjob:
      schedule: 0 3 * * *
      timeZone: Europe/Warsaw
      suspend: true
      concurrencyPolicy: Forbid
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      startingDeadlineSeconds: 300
      successfulJobsHistory: 1
      failedJobsHistory: 2
    pod:
      restartPolicy: Never
    containers:
      operations:
        image:
          repository: ghcr.io/edgard/home-ops-data-tools
          tag: 34d4c9a9e5ac52047ccd511b102b405039dbe10b
          digest: sha256:6e5919fa72ad11e9217e26f574730b04e986181d8553bf93b508d0e791ab566f
        args:
          - --extra-vars
          - "{\"shared_data_action\":\"backup\",\"shared_data_confirm\":true,\"shared_data_image\":\"ghcr.io/edgard/home-ops-data-tools:34d4c9a9e5ac52047ccd511b102b405039dbe10b@sha256:6e5919fa72ad11e9217e26f574730b04e986181d8553bf93b508d0e791ab566f\",\"shared_data_operation_kind\":\"backup\",\"shared_data_operation_id\":\"$(POD_NAME)\",\"shared_data_require_current_registry\":true}"
        env:
          POD_NAME:
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          POD_NAMESPACE:
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          POD_UID:
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
          HOME: /tmp
          ANSIBLE_LOCAL_TEMP: /tmp/ansible-local
          ANSIBLE_REMOTE_TEMP: /tmp/ansible-remote
          XDG_CACHE_HOME: /tmp/cache
          RESTIC_REPOSITORY: rest:http://restic.selfhosted.svc.cluster.local:8000/
          RESTIC_REST_USERNAME: restic
          RESTIC_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: restic-credentials
                key: RESTIC_PASSWORD
          RESTIC_REST_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: restic-credentials
                key: RESTIC_PASSWORD
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
            add:
              - CHOWN
              - DAC_READ_SEARCH
              - DAC_OVERRIDE
              - FSETID
              - FOWNER
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 2Gi
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false
          startup:
            enabled: false
  provision:
    type: cronjob
    serviceAccount:
      name: shared-data
    cronjob:
      schedule: 0 0 1 1 *
      timeZone: Europe/Warsaw
      suspend: true
      concurrencyPolicy: Forbid
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      startingDeadlineSeconds: 300
      successfulJobsHistory: 1
      failedJobsHistory: 2
    pod:
      restartPolicy: Never
    containers:
      operations:
        image:
          repository: ghcr.io/edgard/home-ops-data-tools
          tag: 34d4c9a9e5ac52047ccd511b102b405039dbe10b
          digest: sha256:6e5919fa72ad11e9217e26f574730b04e986181d8553bf93b508d0e791ab566f
        args:
          - --extra-vars
          - "{\"shared_data_action\":\"provision\",\"shared_data_confirm\":true,\"shared_data_image\":\"ghcr.io/edgard/home-ops-data-tools:34d4c9a9e5ac52047ccd511b102b405039dbe10b@sha256:6e5919fa72ad11e9217e26f574730b04e986181d8553bf93b508d0e791ab566f\",\"shared_data_operation_kind\":\"provision\",\"shared_data_operation_id\":\"$(POD_NAME)\",\"shared_data_apps\":[\"sure\",\"sparkyfitness\"],\"shared_data_require_current_registry\":true}"
        env:
          POD_NAME:
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          POD_NAMESPACE:
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          POD_UID:
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
          HOME: /tmp
          ANSIBLE_LOCAL_TEMP: /tmp/ansible-local
          ANSIBLE_REMOTE_TEMP: /tmp/ansible-remote
          XDG_CACHE_HOME: /tmp/cache
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
            add:
              - CHOWN
              - DAC_READ_SEARCH
              - FOWNER
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 2Gi
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false
          startup:
            enabled: false
  watchdog:
    type: cronjob
    serviceAccount:
      name: shared-data
    cronjob:
      schedule: "*/5 * * * *"
      timeZone: Europe/Warsaw
      suspend: true
      concurrencyPolicy: Forbid
      backoffLimit: 0
      activeDeadlineSeconds: 300
      startingDeadlineSeconds: 300
      successfulJobsHistory: 1
      failedJobsHistory: 2
    pod:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
    containers:
      operations:
        image:
          repository: ghcr.io/edgard/home-ops-data-tools
          tag: 34d4c9a9e5ac52047ccd511b102b405039dbe10b
          digest: sha256:6e5919fa72ad11e9217e26f574730b04e986181d8553bf93b508d0e791ab566f
        args:
          - --extra-vars
          - "{\"shared_data_action\":\"watchdog\",\"shared_data_confirm\":true,\"shared_data_monitor_enabled\":true,\"shared_data_image\":\"ghcr.io/edgard/home-ops-data-tools:34d4c9a9e5ac52047ccd511b102b405039dbe10b@sha256:6e5919fa72ad11e9217e26f574730b04e986181d8553bf93b508d0e791ab566f\"}"
        env:
          POD_NAME:
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          POD_NAMESPACE:
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          POD_UID:
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
          HOME: /tmp
          ANSIBLE_LOCAL_TEMP: /tmp/ansible-local
          ANSIBLE_REMOTE_TEMP: /tmp/ansible-remote
          XDG_CACHE_HOME: /tmp/cache
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 512Mi
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false
          startup:
            enabled: false
persistence:
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
  registry:
    type: configMap
    name: shared-data-registry
    globalMounts:
      - path: /opt/home-ops/ansible/roles/shared_data/files/registry.yaml
        subPath: registry.yaml
        readOnly: true
  credentials:
    type: secret
    name: shared-data-credentials
    advancedMounts:
      main:
        operations:
          - path: /run/credentials
            readOnly: true
      provision:
        operations:
          - path: /run/credentials
            readOnly: true
  appdata:
    type: persistentVolumeClaim
    existingClaim: restic-appdata
    advancedMounts:
      main:
        operations:
          - path: /data/appdata
            readOnly: true
  staging:
    type: persistentVolumeClaim
    existingClaim: shared-data-staging
    advancedMounts:
      main:
        operations:
          - path: /staging
  gatus-token:
    type: secret
    name: shared-data-gatus-credentials
    advancedMounts:
      watchdog:
        operations:
          - path: /run/gatus
            readOnly: true
