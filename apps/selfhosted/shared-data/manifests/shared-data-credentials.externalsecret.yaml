---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shared-data-credentials
  namespace: selfhosted
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: external-secrets-store
    kind: ClusterSecretStore
  target:
    name: shared-data-credentials
    creationPolicy: Owner
  data:
    - secretKey: atuin_db_password
      remoteRef:
        key: atuin_db_password
    - secretKey: bambuddy_db_password
      remoteRef:
        key: bambuddy_db_password
    - secretKey: bambuddy_mfa_encryption_key
      remoteRef:
        key: bambuddy_mfa_encryption_key
    - secretKey: bazarr_db_password
      remoteRef:
        key: bazarr_db_password
    - secretKey: homeassistant_db_password
      remoteRef:
        key: homeassistant_db_password
    - secretKey: paperless_db_password
      remoteRef:
        key: paperless_db_password
    - secretKey: paperless_redis_password
      remoteRef:
        key: paperless_redis_password
    - secretKey: paperless_secret_key
      remoteRef:
        key: paperless_secret_key
    - secretKey: postgresql_admin_password
      remoteRef:
        key: postgresql_admin_password
    - secretKey: prowlarr_db_password
      remoteRef:
        key: prowlarr_db_password
    - secretKey: radarr_db_password
      remoteRef:
        key: radarr_db_password
    - secretKey: redis_admin_password
      remoteRef:
        key: redis_admin_password
    - secretKey: shared_data_gatus_token
      remoteRef:
        key: shared_data_gatus_token
    - secretKey: sonarr_db_password
      remoteRef:
        key: sonarr_db_password
    - secretKey: sparkyfitness_api_encryption_key
      remoteRef:
        key: sparkyfitness_api_encryption_key
    - secretKey: sparkyfitness_app_db_password
      remoteRef:
        key: sparkyfitness_app_db_password
    - secretKey: sparkyfitness_auth_secret
      remoteRef:
        key: sparkyfitness_auth_secret
    - secretKey: sparkyfitness_db_password
      remoteRef:
        key: sparkyfitness_db_password
    - secretKey: sure_db_password
      remoteRef:
        key: sure_db_password
    - secretKey: sure_encryption_deterministic_key
      remoteRef:
        key: sure_encryption_deterministic_key
    - secretKey: sure_encryption_primary_key
      remoteRef:
        key: sure_encryption_primary_key
    - secretKey: sure_encryption_salt
      remoteRef:
        key: sure_encryption_salt
    - secretKey: sure_redis_password
      remoteRef:
        key: sure_redis_password
    - secretKey: sure_secret_key_base
      remoteRef:
        key: sure_secret_key_base
