---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shared-data-maintenance
  namespace: media
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - bazarr
      - prowlarr
      - radarr
      - sonarr
    verbs:
      - get
      - patch
