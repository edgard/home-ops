---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-data-staging
  namespace: selfhosted
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
  storageClassName: nfs-fast
