---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shared-data-maintenance
  namespace: selfhosted
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - atuin
      - bambuddy
      - changedetection
      - karakeep-chrome
      - karakeep-main
      - karakeep-meilisearch
      - paperless-gpt
      - paperless-main
      - sparkyfitness-garmin
      - sparkyfitness-main
      - sparkyfitness-server
      - sure-main
      - sure-worker
      - twitch-drops-miner
    verbs:
      - get
      - patch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    resourceNames:
      - shared-data-operation
    verbs:
      - get
      - patch
      - update
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - shared-data-operation
      - shared-data-status
      - shared-data-backup-status
    verbs:
      - get
      - patch
      - update
      - delete
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - shared-data-registry
      - shared-data-cold-recovery
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - patch
      - update
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - get
      - create
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - services
      - secrets
    resourceNames:
      - shared-data-redis-recovery
    verbs:
      - get
      - delete
  - apiGroups:
      - batch
    resources:
      - cronjobs
    resourceNames:
      - shared-data-main
      - shared-data-provision
      - restic-backup
      - restic-maintenance
    verbs:
      - get
      - patch
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - services
    resourceNames:
      - paperless-main
    verbs:
      - patch
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - paperless-redis
    verbs:
      - get
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    resourceNames:
      - shared-data
    verbs:
      - get
