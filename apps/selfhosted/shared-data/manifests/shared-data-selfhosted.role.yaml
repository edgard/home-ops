---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shared-data-maintenance
  namespace: selfhosted
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - atuin
      - bambuddy
      - paperless-gpt
      - paperless-main
      - sparkyfitness-garmin
      - sparkyfitness-main
      - sparkyfitness-server
      - sure-main
      - sure-worker
    verbs:
      - get
      - patch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    resourceNames:
      - shared-data-operation
    verbs:
      - get
      - patch
      - update
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - shared-data-operation
      - shared-data-status
    verbs:
      - get
      - patch
      - update
      - delete
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - shared-data-registry
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - patch
      - update
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - get
      - create
