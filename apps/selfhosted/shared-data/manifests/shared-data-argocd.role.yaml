---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shared-data-maintenance
  namespace: argocd
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    resourceNames:
      - atuin
      - bambuddy
      - bazarr
      - homeassistant
      - paperless
      - prowlarr
      - radarr
      - root
      - sonarr
      - sparkyfitness
      - sure
      - tuppr
    verbs:
      - get
      - patch
  - apiGroups:
      - argoproj.io
    resources:
      - applicationsets
    resourceNames:
      - apps
    verbs:
      - get
      - patch
