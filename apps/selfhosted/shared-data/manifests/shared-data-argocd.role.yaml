---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shared-data-maintenance
  namespace: argocd
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    resourceNames:
      - atuin
      - bambuddy
      - bazarr
      - changedetection
      - crosswatch
      - homeassistant
      - jellyfin
      - karakeep
      - paperless
      - postgresql
      - prowlarr
      - qbittorrent
      - radarr
      - recyclarr
      - redis
      - restic
      - root
      - scrypted
      - shared-data
      - sonarr
      - sparkyfitness
      - sure
      - tuppr
      - twitch-drops-miner
    verbs:
      - get
      - patch
  - apiGroups:
      - argoproj.io
    resources:
      - applicationsets
    resourceNames:
      - apps
    verbs:
      - get
      - patch
