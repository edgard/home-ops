---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sparkyfitness-credentials
  namespace: selfhosted
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: external-secrets-store
    kind: ClusterSecretStore
  target:
    name: sparkyfitness-credentials
    creationPolicy: Owner
  data:
    - secretKey: sparkyfitness_api_encryption_key
      remoteRef:
        key: sparkyfitness_api_encryption_key
    - secretKey: sparkyfitness_app_db_password
      remoteRef:
        key: sparkyfitness_app_db_password
    - secretKey: sparkyfitness_auth_secret
      remoteRef:
        key: sparkyfitness_auth_secret
    - secretKey: sparkyfitness_db_password
      remoteRef:
        key: sparkyfitness_db_password
    - secretKey: sparkyfitness_admin_email
      remoteRef:
        key: sparkyfitness_admin_email
    - secretKey: sparkyfitness_admin_password
      remoteRef:
        key: sparkyfitness_admin_password
