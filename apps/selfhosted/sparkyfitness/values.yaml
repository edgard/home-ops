---
defaultPodOptions:
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 60
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
controllers:
  main:
    type: deployment
    replicas: 1
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      securityContext:
        runAsUser: 1000
        runAsGroup: 0
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    containers:
      app:
        image:
          repository: ghcr.io/codewithcj/sparkyfitness-frontend
          tag: v1.12.1@sha256:c4e0769cece9ee70439b86cc457bed14d543edebab7502cd0c5d67174eb11f57
        env:
          SPARKY_FITNESS_FRONTEND_URL: https://sparkyfitness.edgard.org
          SPARKY_FITNESS_SERVER_HOST: sparkyfitness-server.selfhosted.svc.cluster.local
          SPARKY_FITNESS_SERVER_PORT: "3010"
          NGINX_LISTEN_PORT: "8080"
        securityContext:
          runAsUser: 1000
          runAsGroup: 0
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            memory: 256Mi
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /
            port: 8080
            spec:
              failureThreshold: 60
              periodSeconds: 10
          readiness:
            enabled: true
            type: HTTP
            path: /
            port: 8080
          liveness:
            enabled: true
            type: HTTP
            path: /
            port: 8080
  server:
    type: deployment
    replicas: 1
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: ghcr.io/codewithcj/sparkyfitness-server
          tag: v1.12.1@sha256:2f064604c2034fa5953cb3e17651aad32e8a9f8362895500cd5d188376215b3a
        env:
          NODE_ENV: production
          TZ: Europe/Warsaw
          SPARKY_FITNESS_DB_HOST: sparkyfitness-postgresql.selfhosted.svc.cluster.local
          SPARKY_FITNESS_DB_PORT: "5432"
          SPARKY_FITNESS_DB_NAME: sparkyfitness_db
          SPARKY_FITNESS_DB_USER: sparky
          SPARKY_FITNESS_DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: sparkyfitness-credentials
                key: sparkyfitness_db_password
          SPARKY_FITNESS_API_ENCRYPTION_KEY:
            valueFrom:
              secretKeyRef:
                name: sparkyfitness-credentials
                key: sparkyfitness_api_encryption_key
          BETTER_AUTH_SECRET:
            valueFrom:
              secretKeyRef:
                name: sparkyfitness-credentials
                key: sparkyfitness_auth_secret
          SPARKY_FITNESS_FRONTEND_URL: https://sparkyfitness.edgard.org
          BETTER_AUTH_URL: https://sparkyfitness.edgard.org
          SPARKY_FITNESS_SERVER_PORT: "3010"
          SPARKY_FITNESS_TRUSTED_PROXY_HOPS: "2"
          SPARKY_FITNESS_DISABLE_SIGNUP: "true"
          SPARKY_FITNESS_ADMIN_EMAIL: castro@edgard.org
          SPARKY_FITNESS_SHUTDOWN_TIMEOUT_SECONDS: "45"
          SPARKY_FITNESS_CUSTOM_UPLOADS_DIRECTORY: /data/uploads
          SPARKY_FITNESS_CUSTOM_BACKUP_DIRECTORY: /data/backups
          SPARKY_FITNESS_CUSTOM_TEMP_DIRECTORY: /tmp/sparky-temp-uploads
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /api/health
            port: 3010
            spec:
              failureThreshold: 60
              periodSeconds: 10
          readiness:
            enabled: true
            type: HTTP
            path: /api/health
            port: 3010
          liveness:
            enabled: true
            type: HTTP
            path: /api/health
            port: 3010
  postgresql:
    type: deployment
    replicas: 1
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    containers:
      app:
        image:
          repository: docker.io/library/postgres
          tag: 18.7-trixie@sha256:9f4fd4aa918f52ae3d6f3b687f1de90d8f867cd4d520021545a9a50c120eae3b
        env:
          PGDATA: /var/lib/postgresql/18/docker
          POSTGRES_DB: sparkyfitness_db
          POSTGRES_USER: sparky
          POSTGRES_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: sparkyfitness-credentials
                key: sparkyfitness_db_password
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - CHOWN
              - DAC_OVERRIDE
              - FOWNER
              - SETUID
              - SETGID
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - pg_isready
                  - -U
                  - sparky
                  - -d
                  - sparkyfitness_db
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 60
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - pg_isready
                  - -U
                  - sparky
                  - -d
                  - sparkyfitness_db
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - pg_isready
                  - -U
                  - sparky
                  - -d
                  - sparkyfitness_db
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
service:
  main:
    forceRename: sparkyfitness
    controller: main
    ports:
      http:
        port: 8080
        targetPort: 8080
  server:
    forceRename: sparkyfitness-server
    controller: server
    ports:
      http:
        port: 3010
        targetPort: 3010
  postgresql:
    forceRename: sparkyfitness-postgresql
    controller: postgresql
    type: ClusterIP
    ports:
      tcp:
        port: 5432
        targetPort: 5432
route:
  main:
    parentRefs:
      - name: gateway
        namespace: platform-system
        sectionName: https
    hostnames:
      - sparkyfitness.edgard.org
    rules:
      - backendRefs:
          - identifier: main
            port: 8080
persistence:
  run:
    type: emptyDir
    advancedMounts:
      main:
        app:
          - path: /run
  data:
    type: persistentVolumeClaim
    forceRename: sparkyfitness-data
    accessMode: ReadWriteOnce
    storageClass: nfs-fast
    size: 20Gi
    retain: true
    advancedMounts:
      server:
        app:
          - path: /data
      postgresql:
        app:
          - path: /var/lib/postgresql
            subPath: postgresql
