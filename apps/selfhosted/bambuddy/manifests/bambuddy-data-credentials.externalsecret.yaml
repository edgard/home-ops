---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bambuddy-data-credentials
  namespace: selfhosted
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: external-secrets-store
    kind: ClusterSecretStore
  target:
    name: bambuddy-data-credentials
    creationPolicy: Owner
  data:
    - secretKey: bambuddy_db_password
      remoteRef:
        key: bambuddy_db_password
    - secretKey: bambuddy_mfa_encryption_key
      remoteRef:
        key: bambuddy_mfa_encryption_key
