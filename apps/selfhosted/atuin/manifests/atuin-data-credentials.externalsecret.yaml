---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atuin-data-credentials
  namespace: selfhosted
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: external-secrets-store
    kind: ClusterSecretStore
  target:
    name: atuin-data-credentials
    creationPolicy: Owner
  data:
    - secretKey: atuin_db_password
      remoteRef:
        key: atuin_db_password
