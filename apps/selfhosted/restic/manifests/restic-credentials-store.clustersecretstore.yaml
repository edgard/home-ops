---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: restic-credentials-store
spec:
  conditions:
    - namespaces:
        - home-automation
  provider:
    kubernetes:
      remoteNamespace: selfhosted
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: selfhosted
          key: ca.crt
      auth:
        serviceAccount:
          name: restic-secret-reader
          namespace: selfhosted
