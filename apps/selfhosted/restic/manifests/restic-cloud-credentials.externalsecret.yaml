---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-cloud-credentials
  namespace: selfhosted
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: external-secrets-store
    kind: ClusterSecretStore
  target:
    name: restic-cloud-credentials
  data:
    - secretKey: rclone.conf
      remoteRef:
        key: restic_b2_rclone_config
