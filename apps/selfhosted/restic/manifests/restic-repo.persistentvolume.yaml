---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: restic-repo
spec:
  capacity:
    storage: 5Ti
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: selfhosted
    name: restic-repo
  local:
    path: /var/mnt/dpool/restic
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - homelab
