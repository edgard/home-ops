---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-credentials
  namespace: home-automation
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: restic-credentials-store
    kind: ClusterSecretStore
  target:
    name: restic-credentials
    creationPolicy: Owner
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: restic-credentials
        property: RESTIC_PASSWORD
    - secretKey: RESTIC_REPOSITORY_ID
      remoteRef:
        key: restic-credentials
        property: RESTIC_REPOSITORY_ID
