---
defaultPodOptions:
  securityContext:
    fsGroup: 0
    fsGroupChangePolicy: OnRootMismatch
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0

controllers:
  main:
    type: deployment
    replicas: 1
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [
            {
              "name": "homeassistant-matter-lan",
              "namespace": "home-automation",
              "interface": "net1",
              "ips": ["192.168.1.246/24"],
              "gateway": ["192.168.1.1"],
              "mac": "02:42:c0:a8:01:f6"
            }
          ]
    containers:
      app:
        image:
          repository: ghcr.io/home-assistant/home-assistant
          tag: "2026.10.1"
        ports:
          - name: http
            containerPort: 8123
        probes:
          startup:
            enabled: true
          liveness:
            enabled: true
          readiness:
            enabled: true
        securityContext:
          privileged: true
      matter-server:
        image:
          repository: ghcr.io/matter-js/matterjs-server
          tag: 1.4.0
        args:
          - --vendorid
          - "4939"
          - --fabricid
          - "2"
        env:
          STORAGE_PATH: /data
          PORT: "5580"
          LOG_LEVEL: info
          PRIMARY_INTERFACE: net1
          LISTEN_ADDRESS: 127.0.0.1
          # Talos TimeStatus must be synchronized before enabling device time sync.
          ENABLE_TIME_SYNC: "true"
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /usr/local/bin/healthcheck.sh
              periodSeconds: 5
              timeoutSeconds: 10
              failureThreshold: 180
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /usr/local/bin/healthcheck.sh
              periodSeconds: 60
              timeoutSeconds: 10
              failureThreshold: 6
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /usr/local/bin/healthcheck.sh
              periodSeconds: 10
              timeoutSeconds: 10
              failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

service:
  main:
    controller: main
    type: ClusterIP
    ports:
      http:
        enabled: true
        port: 8123
        protocol: TCP
        targetPort: 8123

route:
  main:
    parentRefs:
      - name: gateway
        namespace: platform-system
        sectionName: https
    hostnames:
      - homeassistant.edgard.org
    rules:
      - backendRefs:
          - identifier: main
            port: 8123

persistence:
  data:
    type: persistentVolumeClaim
    forceRename: homeassistant
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    accessMode: ReadWriteOnce
    size: 10Gi
    advancedMounts:
      main:
        app:
          - path: /config
  matter:
    type: persistentVolumeClaim
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    storageClass: nfs-fast
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      main:
        matter-server:
          - path: /data
  config-main:
    type: configMap
    name: homeassistant-config
    advancedMounts:
      main:
        app:
          - path: /config/configuration.yaml
            subPath: configuration.yaml
            readOnly: true

  config-gatus:
    type: configMap
    name: homeassistant-gatus-alert-light
    advancedMounts:
      main:
        app:
          - path: /config/packages/gatus_alert_light.yaml
            subPath: gatus_alert_light.yaml
            readOnly: true
          - path: /config/custom_templates/gatus_alert_light.jinja
            subPath: gatus_alert_light.jinja
            readOnly: true
