---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homeassistant-data-credentials
  namespace: home-automation
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: external-secrets-store
    kind: ClusterSecretStore
  target:
    name: homeassistant-data-credentials
    creationPolicy: Owner
  data:
    - secretKey: homeassistant_db_password
      remoteRef:
        key: homeassistant_db_password
