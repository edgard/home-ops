---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: homeassistant-matter-lan
  namespace: home-automation
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  config: |-
    {
      "cniVersion": "1.1.0",
      "name": "homeassistant-matter-lan",
      "plugins": [
        {
          "type": "bridge",
          "bridge": "br0",
          "capabilities": {"ips": true, "mac": true},
          "ipam": {"type": "static"}
        },
        {
          "type": "tuning",
          "sysctl": {
            "net.ipv6.conf.all.forwarding": "0",
            "net.ipv6.conf.IFNAME.forwarding": "0",
            "net.ipv6.conf.IFNAME.disable_ipv6": "0",
            "net.ipv6.conf.IFNAME.autoconf": "1",
            "net.ipv6.conf.IFNAME.accept_ra": "1",
            "net.ipv6.conf.IFNAME.accept_ra_rtr_pref": "1",
            "net.ipv6.conf.IFNAME.accept_ra_rt_info_min_plen": "0",
            "net.ipv6.conf.IFNAME.accept_ra_rt_info_max_plen": "64"
          }
        }
      ]
    }
