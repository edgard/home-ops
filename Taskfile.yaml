---
version: "3"

silent: true
set:
  - errexit
  - nounset
  - pipefail

vars:
  K8S_VERSION: "{{.K8S_VERSION | default \"\"}}"
  TERRAFORM_DIR: "{{.TERRAFORM_DIR | default (printf \"%s/terraform\" .TASKFILE_DIR)}}"
  TALOS_CLUSTER_NAME: "{{.TALOS_CLUSTER_NAME | default \"homelab\"}}"
  TALOS_INSTALL_DISK: "{{.TALOS_INSTALL_DISK | default \"\"}}"
  TALOS_NODE: "{{.TALOS_NODE | default \"\"}}"
  PYTHON_BIN: "{{.PYTHON_BIN | default \"python3.14\"}}"
  VENV_DIR: "{{.TASKFILE_DIR}}/.venv"
  VENV_PYTHON: "{{.VENV_DIR}}/bin/python"
  ANSIBLE_GALAXY: "{{.VENV_DIR}}/bin/ansible-galaxy"
  ANSIBLE_LINT: "{{.VENV_DIR}}/bin/ansible-lint"
  ANSIBLE_PLAYBOOK: "{{.VENV_DIR}}/bin/ansible-playbook"
  ANSIBLE_COLLECTIONS_PATH: "{{.TASKFILE_DIR}}/.ansible/collections"

env:
  TALOS_CLUSTER_NAME: "{{.TALOS_CLUSTER_NAME}}"
  TALOS_INSTALL_DISK: "{{.TALOS_INSTALL_DISK}}"
  TALOS_NODE: "{{.TALOS_NODE}}"
  TERRAFORM_DIR: "{{.TERRAFORM_DIR}}"
  K8S_VERSION: "{{.K8S_VERSION}}"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  deps:
    desc: Synchronize locked Python dependencies and pinned Ansible collections
    dir: "{{.TASKFILE_DIR}}"
    env:
      UV_PROJECT_ENVIRONMENT: "{{.VENV_DIR}}"
      UV_PYTHON_DOWNLOADS: never
    preconditions:
      - sh: command -v uv
        msg: Install uv through your machine setup before running `task deps`.
    cmds:
      - uv sync --locked --python {{.PYTHON_BIN | shellQuote}}
      - "\"{{.ANSIBLE_GALAXY}}\" collection install -r ansible/requirements.yml -p \"{{.ANSIBLE_COLLECTIONS_PATH}}\""

  python:check:
    internal: true
    preconditions:
      - sh: test -x "{{.VENV_PYTHON}}"
        msg: Run `task deps` to synchronize the project environment.
    cmds:
      - "true"

  ansible:check:
    internal: true
    desc: Verify local Ansible virtualenv exists
    preconditions:
      - sh: test -x "{{.ANSIBLE_PLAYBOOK}}"
        msg: Run `task deps` to create .venv and install Ansible dependencies.
    cmds:
      - "true"

  secrets:invoke:
    internal: true
    dir: "{{.TASKFILE_DIR}}"
    vars:
      action: "{{.action | default \"run\"}}"
      scope: "{{.scope | default \"cluster\"}}"
      playbook: "{{.playbook | default \"\"}}"
    env:
      HOME_OPS_SECRET_ACTION: "{{.action}}"
      HOME_OPS_SECRET_SCOPE: "{{.scope}}"
      HOME_OPS_SECRET_PLAYBOOK: "{{.playbook}}"
      HOME_OPS_SECRET_ROOT: "{{.TASKFILE_DIR}}"
      HOME_OPS_ANSIBLE_PLAYBOOK: "{{.ANSIBLE_PLAYBOOK}}"
    cmds:
      - |
        bash -c '
        set -euo pipefail
        for name in $(compgen -e); do
          case "$name" in
            BWS_ACCESS_TOKEN|BW_ACCESS_TOKEN|ANSIBLE_VAULT_*|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN|AWS_PROFILE|AWS_DEFAULT_PROFILE|AWS_SHARED_CREDENTIALS_FILE|AWS_CONFIG_FILE|SECRETSPEC_*|TF_VAR_*|TF_CLI_ARGS*|TALOS_SECRETS_YAML|ESO_BWS_ACCESS_TOKEN)
              unset "$name"
              ;;
          esac
        done
        export PATH="$HOME/.local/bin:$PATH"
        "$HOME_OPS_ANSIBLE_PLAYBOOK" ansible/playbooks/secrets-validate.yml
        export SECRETSPEC_BWS_CLI_PATH="$HOME_OPS_SECRET_ROOT/ansible/roles/cli_secrets/files/bws_readonly.py"
        case "$HOME_OPS_SECRET_ACTION" in
          login)
            exec secretspec config provider --file "$HOME_OPS_SECRET_ROOT/secretspec.toml" --reason "home-ops CLI machine-account login" login bitwarden
            ;;
          check)
            exec secretspec check --file "$HOME_OPS_SECRET_ROOT/secretspec.toml" --profile default --scope "$HOME_OPS_SECRET_SCOPE" --reason "home-ops $HOME_OPS_SECRET_SCOPE CLI command" --no-prompt
            ;;
          run)
            exec secretspec run --file "$HOME_OPS_SECRET_ROOT/secretspec.toml" --profile default --scope "$HOME_OPS_SECRET_SCOPE" --reason "home-ops $HOME_OPS_SECRET_SCOPE CLI command" -- "$HOME_OPS_ANSIBLE_PLAYBOOK" "$HOME_OPS_SECRET_ROOT/ansible/playbooks/$HOME_OPS_SECRET_PLAYBOOK"
            ;;
          *) exit 1 ;;
        esac
        '

  secrets:login:
    desc: Store the CLI machine token once in Keychain
    interactive: true
    deps:
      - task: ansible:check
    cmds:
      - task: secrets:invoke
        vars:
          action: login

  secrets:check:
    desc: Check scoped Bitwarden resolution without printing values
    vars:
      scope: "{{.scope | default \"cluster\"}}"
    deps:
      - task: ansible:check
    cmds:
      - task: secrets:invoke
        vars:
          action: check
          scope: "{{.scope}}"

  secrets:sync-cluster-token:
    desc: Replace ESO bootstrap token and verify fresh reconciliation
    deps:
      - task: ansible:check
    cmds:
      - task: secrets:invoke
        vars:
          scope: platform
          playbook: secrets-sync-cluster-token.yml

  # Quality gate and local development
  fmt:
    desc: Format YAML, Python imports/code, and Terraform
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - python:check
    cmds:
      - yamlfmt "**/*.{yaml,yml}"
      - "\"{{.VENV_DIR}}/bin/ruff\" check --select I --fix ansible/roles tests"
      - "\"{{.VENV_DIR}}/bin/ruff\" format ansible/roles tests"
      - tofu fmt -recursive terraform

  fmt:check:
    desc: Check formatting without modifying files
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - python:check
    cmds:
      - yamlfmt -lint "**/*.{yaml,yml}"
      - "\"{{.VENV_DIR}}/bin/ruff\" check --select I ansible/roles tests"
      - "\"{{.VENV_DIR}}/bin/ruff\" format --check ansible/roles tests"
      - tofu fmt -check -recursive terraform

  lint:
    desc: Run static analysis and backendless configuration validation
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - task: lint:yaml
      - task: lint:python
      - task: lint:config
      - task: lint:workflows
      - task: lint:ansible
      - task: lint:terraform

  lint:yaml:
    desc: Lint YAML syntax and conventions
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - python:check
    cmds:
      - "\"{{.VENV_DIR}}/bin/yamllint\" -c .yamllint ."

  lint:python:
    desc: Check Python code and dependency lock freshness
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - python:check
    env:
      UV_PYTHON_DOWNLOADS: never
    cmds:
      - uv lock --check --python {{.PYTHON_BIN | shellQuote}}
      - "\"{{.VENV_DIR}}/bin/ruff\" check ansible/roles tests"

  lint:config:
    desc: Validate Taskfile and Renovate configuration schemas
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - python:check
    cmds:
      - "\"{{.VENV_DIR}}/bin/check-jsonschema\" --builtin-schema vendor.taskfile Taskfile.yaml"
      - "\"{{.VENV_DIR}}/bin/check-jsonschema\" --builtin-schema vendor.renovate --regex-variant nonunicode .renovaterc.json5"

  lint:workflows:
    desc: Validate workflows, their shell scripts, and composite action schemas
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - python:check
    preconditions:
      - sh: command -v shellcheck
        msg: Install ShellCheck through your machine setup; workflow shell checks are required.
    cmds:
      - actionlint -shellcheck shellcheck
      - "\"{{.VENV_DIR}}/bin/check-jsonschema\" --builtin-schema vendor.github-actions .github/actions/*/action.y*ml"

  lint:ansible:
    desc: Run production-profile Ansible lint
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - ansible:check
    cmds:
      - "\"{{.ANSIBLE_LINT}}\" ansible tests/fixtures"

  lint:terraform:
    desc: Validate OpenTofu configuration using locked providers without a backend
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - |
        tf_data_dir=$(mktemp -d)
        trap 'rm -rf "$tf_data_dir"' EXIT
        export TF_DATA_DIR="$tf_data_dir"
        tofu -chdir=terraform init -backend=false -input=false -lockfile=readonly
        tofu -chdir=terraform validate

  test:
    desc: Run the full pytest suite, or forward arguments after --
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - python:check
    cmds:
      - "\"{{.VENV_PYTHON}}\" -m pytest {{.CLI_ARGS}}"

  check:
    desc: Check formatting, static analysis, and the complete test suite
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - task: fmt:check
      - task: lint
      - task: test

  # High-level cluster lifecycle
  cluster:create:
    desc: Install, configure, and bootstrap Talos + platform
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    requires:
      vars:
        - TALOS_NODE
        - TALOS_CLUSTER_NAME
        - TALOS_INSTALL_DISK
    cmds:
      - task: secrets:invoke
        vars:
          scope: cluster
          playbook: cluster-create.yml

  cluster:destroy:
    desc: Destroy platform and reset Talos node
    interactive: true
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    requires:
      vars:
        - TALOS_NODE
    cmds:
      - "\"{{.ANSIBLE_PLAYBOOK}}\" ansible/playbooks/cluster-destroy.yml"

  # Talos operations
  talos:gen:
    desc: Generate Talos config using configured client paths
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    requires:
      vars:
        - TALOS_NODE
        - TALOS_CLUSTER_NAME
        - TALOS_INSTALL_DISK
    cmds:
      - task: secrets:invoke
        vars:
          scope: talos
          playbook: talos-generate.yml

  talos:apply:
    desc: Apply Talos config to control plane
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    requires:
      vars:
        - TALOS_NODE
    cmds:
      - "\"{{.ANSIBLE_PLAYBOOK}}\" ansible/playbooks/talos-apply.yml"

  talos:bootstrap:
    desc: Bootstrap Talos control plane and kubeconfig
    interactive: true
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    requires:
      vars:
        - TALOS_NODE
        - TALOS_CLUSTER_NAME
    cmds:
      - "\"{{.ANSIBLE_PLAYBOOK}}\" ansible/playbooks/talos-bootstrap.yml"

  talos:upgrade:
    desc: Upgrade Talos on a node from the repo target version
    deps:
      - task: ansible:check
    requires:
      vars:
        - TALOS_NODE
    cmds:
      - "\"{{.ANSIBLE_PLAYBOOK}}\" ansible/playbooks/talos-upgrade.yml"

  talos:upgrade-k8s:
    desc: Upgrade Kubernetes control plane
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    requires:
      vars:
        - TALOS_NODE
        - K8S_VERSION
    cmds:
      - "\"{{.ANSIBLE_PLAYBOOK}}\" ansible/playbooks/talos-upgrade-k8s.yml"

  # Platform and Argo operations
  platform:create:
    desc: Create platform components via Ansible
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    cmds:
      - task: secrets:invoke
        vars:
          scope: platform
          playbook: platform-bootstrap.yml

  platform:destroy:
    desc: Destroy platform components via Ansible
    interactive: true
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    cmds:
      - "\"{{.ANSIBLE_PLAYBOOK}}\" ansible/playbooks/platform-destroy.yml"

  argo:sync:
    desc: Force Argo CD Applications to refresh
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    vars:
      app: "{{.app | default \"\"}}"
    cmds:
      - "\"{{.ANSIBLE_PLAYBOOK}}\" ansible/playbooks/argo-refresh.yml {{if .app}}--extra-vars {{dict \"app\" .app | toJson | shellQuote}}{{end}}"

  restic:restore:
    desc: Plan or run a restic restore for one Argo CD app
    interactive: true
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    vars:
      app: "{{.app | default \"\"}}"
      snapshot: "{{.snapshot | default \"latest\"}}"
      confirm_restore: "{{.confirm_restore | default \"false\"}}"
    requires:
      vars:
        - app
    cmds:
      - "\"{{.ANSIBLE_PLAYBOOK}}\" ansible/playbooks/restic-restore.yml --extra-vars {{dict \"restic_restore_mode\" \"app\" \"restic_restore_app\" .app \"restic_restore_snapshot\" .snapshot \"restic_restore_confirm\" .confirm_restore | toJson | shellQuote}}"

  restic:restore-all:
    desc: Plan or run a restic restore for all appdata PVCs
    interactive: true
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    vars:
      snapshot: "{{.snapshot | default \"latest\"}}"
      confirm_restore: "{{.confirm_restore | default \"false\"}}"
    cmds:
      - "\"{{.ANSIBLE_PLAYBOOK}}\" ansible/playbooks/restic-restore.yml --extra-vars {{dict \"restic_restore_mode\" \"all\" \"restic_restore_snapshot\" .snapshot \"restic_restore_confirm\" .confirm_restore | toJson | shellQuote}}"

  # Terraform operations
  tf:plan:
    desc: Terraform plan
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    cmds:
      - task: secrets:invoke
        vars:
          scope: terraform
          playbook: terraform-plan.yml

  tf:apply:
    desc: Terraform apply
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    cmds:
      - task: secrets:invoke
        vars:
          scope: terraform
          playbook: terraform-apply.yml

  tf:clean:
    desc: Clean terraform state/cache
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    cmds:
      - "\"{{.ANSIBLE_PLAYBOOK}}\" ansible/playbooks/terraform-clean.yml"
