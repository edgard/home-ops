---
version: "3"

silent: true
failfast: true
set:
  - errexit
  - nounset
  - pipefail
shell: bash -c

vars:
  K8S_VERSION: '{{.K8S_VERSION | default ""}}'
  TERRAFORM_DIR: '{{.TERRAFORM_DIR | default (printf "%s/terraform" .TASKFILE_DIR)}}'
  TALOS_CLUSTER_NAME: '{{.TALOS_CLUSTER_NAME | default "homelab"}}'
  TALOS_INSTALL_DISK: '{{.TALOS_INSTALL_DISK | default ""}}'
  TALOS_NODE: '{{.TALOS_NODE | default ""}}'
  PYTHON_BIN: '{{.PYTHON_BIN | default "python3.14"}}'
  VENV_DIR: "{{.TASKFILE_DIR}}/.venv"
  VENV_PYTHON: "{{.VENV_DIR}}/bin/python"
  ANSIBLE_GALAXY: "{{.VENV_DIR}}/bin/ansible-galaxy"
  ANSIBLE_LINT: "{{.VENV_DIR}}/bin/ansible-lint"
  ANSIBLE_PLAYBOOK: "{{.VENV_DIR}}/bin/ansible-playbook"
  ANSIBLE_COLLECTIONS_PATH: "{{.TASKFILE_DIR}}/.ansible/collections"

env:
  TALOS_CLUSTER_NAME: "{{.TALOS_CLUSTER_NAME}}"
  TALOS_INSTALL_DISK: "{{.TALOS_INSTALL_DISK}}"
  TALOS_NODE: "{{.TALOS_NODE}}"
  TERRAFORM_DIR: "{{.TERRAFORM_DIR}}"
  K8S_VERSION: "{{.K8S_VERSION}}"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  deps:
    desc: Install pinned validation dependencies
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - '"{{.PYTHON_BIN}}" -m venv "{{.VENV_DIR}}"'
      - '"{{.VENV_PYTHON}}" -m pip install --upgrade pip'
      - '"{{.VENV_PYTHON}}" -m pip uninstall -y ansible || true'
      - '"{{.VENV_PYTHON}}" -m pip install -r ansible/requirements.txt'
      - '"{{.ANSIBLE_GALAXY}}" collection install -r ansible/requirements.yml -p "{{.ANSIBLE_COLLECTIONS_PATH}}"'

  ansible:check:
    internal: true
    desc: Verify local Ansible virtualenv exists
    preconditions:
      - sh: test -x "{{.ANSIBLE_PLAYBOOK}}"
        msg: Run `task deps` to create .venv and install Ansible dependencies.
      - sh: test -x "{{.ANSIBLE_LINT}}"
        msg: Run `task deps` to create .venv and install Ansible dependencies.
    cmds:
      - true

  secrets:setup:
    desc: Install checksum-verified operator tools through Ansible
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    cmds:
      - '"{{.ANSIBLE_PLAYBOOK}}" ansible/playbooks/secrets-setup.yml'

  secrets:invoke:
    internal: true
    dir: "{{.TASKFILE_DIR}}"
    vars:
      action: '{{.action | default "run"}}'
      scope: '{{.scope | default "cluster"}}'
      playbook: '{{.playbook | default ""}}'
    env:
      HOME_OPS_SECRET_ACTION: "{{.action}}"
      HOME_OPS_SECRET_SCOPE: "{{.scope}}"
      HOME_OPS_SECRET_PLAYBOOK: "{{.playbook}}"
      HOME_OPS_SECRET_ROOT: "{{.TASKFILE_DIR}}"
      HOME_OPS_ANSIBLE_PLAYBOOK: "{{.ANSIBLE_PLAYBOOK}}"
    cmds:
      - |
        bash -c '
        set -euo pipefail
        for name in $(compgen -e); do
          case "$name" in
            BWS_ACCESS_TOKEN|BW_ACCESS_TOKEN|ANSIBLE_VAULT_*|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN|AWS_PROFILE|AWS_DEFAULT_PROFILE|AWS_SHARED_CREDENTIALS_FILE|AWS_CONFIG_FILE|SECRETSPEC_*|TF_VAR_*|TF_CLI_ARGS*|TALOS_SECRETS_YAML|ESO_BWS_ACCESS_TOKEN)
              unset "$name"
              ;;
          esac
        done
        export PATH="$HOME/.local/bin:$PATH"
        "$HOME_OPS_ANSIBLE_PLAYBOOK" ansible/playbooks/secrets-validate.yml
        export SECRETSPEC_BWS_CLI_PATH="$HOME_OPS_SECRET_ROOT/ansible/roles/operator_secrets/files/bws_readonly.py"
        case "$HOME_OPS_SECRET_ACTION" in
          login)
            exec secretspec config provider --file "$HOME_OPS_SECRET_ROOT/secretspec.toml" --reason "home-ops operator machine-account login" login operator
            ;;
          check)
            exec secretspec check --file "$HOME_OPS_SECRET_ROOT/secretspec.toml" --profile default --scope "$HOME_OPS_SECRET_SCOPE" --reason "home-ops $HOME_OPS_SECRET_SCOPE operator command" --no-prompt
            ;;
          run)
            exec secretspec run --file "$HOME_OPS_SECRET_ROOT/secretspec.toml" --profile default --scope "$HOME_OPS_SECRET_SCOPE" --reason "home-ops $HOME_OPS_SECRET_SCOPE operator command" -- "$HOME_OPS_ANSIBLE_PLAYBOOK" "$HOME_OPS_SECRET_ROOT/ansible/playbooks/$HOME_OPS_SECRET_PLAYBOOK"
            ;;
          *) exit 1 ;;
        esac
        '

  secrets:login:
    desc: Store the operator machine token once in Keychain
    interactive: true
    deps:
      - task: ansible:check
    cmds:
      - task: secrets:invoke
        vars:
          action: login

  secrets:check:
    desc: Check scoped Bitwarden resolution without printing values
    vars:
      scope: '{{.scope | default "cluster"}}'
    deps:
      - task: ansible:check
    cmds:
      - task: secrets:invoke
        vars:
          action: check
          scope: "{{.scope}}"

  secrets:sync-cluster-token:
    desc: Replace ESO bootstrap token and verify fresh reconciliation
    deps:
      - task: ansible:check
    cmds:
      - task: secrets:invoke
        vars:
          scope: platform
          playbook: secrets-sync-cluster-token.yml

  # Quality gate and local development
  fmt:
    desc: Format all code
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - prettier --write "**/*.{yaml,yml}"
      - yamlfmt "**/*.{yaml,yml}"
      - tofu fmt -recursive

  fmt:check:
    desc: Check formatting without modifying files
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - yamlfmt -lint "**/*.{yaml,yml}"
      - tofu fmt -check -recursive

  lint:
    desc: Run the offline validation checks
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - task: fmt:check
      - task: lint:static
      - task: lint:wiki
      - task: lint:workflows
      - task: lint:ansible:static
      - task: lint:terraform
      - task: test

  lint:static:
    desc: Run static YAML checks
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - yamllint -c .yamllint .

  lint:wiki:
    desc: Check wiki links, sources, and app coverage
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    cmds:
      - '"{{.ANSIBLE_PLAYBOOK}}" ansible/playbooks/validate-wiki.yml'

  lint:workflows:
    desc: Validate GitHub Actions workflows
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - find .github/workflows -maxdepth 1 \( -name "*.yml" -o -name "*.yaml" \) -print0 | xargs -0 actionlint

  lint:repository:
    desc: Check repository configuration and credential artifact protection
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    cmds:
      - '"{{.VENV_PYTHON}}" -m pytest tests/config/repository'

  lint:ansible:
    desc: Run Ansible lint and pytest unit and integration tests
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    cmds:
      - task: lint:ansible:static
      - '"{{.VENV_PYTHON}}" -m pytest tests/unit tests/integration'

  lint:ansible:static:
    desc: Run production-profile Ansible lint
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    cmds:
      - '"{{.ANSIBLE_LINT}}" ansible tests/fixtures'

  test:
    desc: Run all repository-owned pytest checks
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    cmds:
      - '"{{.VENV_PYTHON}}" -m pytest tests'

  lint:kubernetes:
    desc: Run Kubernetes source, resource, schema, and deprecation checks
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    cmds:
      - '"{{.VENV_PYTHON}}" -m pytest tests/config/kubernetes'

  lint:terraform:
    desc: Run backendless OpenTofu validation
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - tf_data_dir=$(mktemp -d) && trap 'rm -rf "$tf_data_dir"' EXIT && cd terraform && TF_DATA_DIR="$tf_data_dir" tofu init -upgrade -backend=false >/dev/null 2>&1 && TF_DATA_DIR="$tf_data_dir" tofu validate

  precommit:
    desc: Format code and run the offline validation checks
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - task: fmt
      - task: lint

  # High-level cluster lifecycle
  cluster:create:
    desc: Install, configure, and bootstrap Talos + platform
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    requires:
      vars:
        - TALOS_NODE
        - TALOS_CLUSTER_NAME
        - TALOS_INSTALL_DISK
    cmds:
      - task: secrets:invoke
        vars:
          scope: cluster
          playbook: cluster-create.yml

  cluster:destroy:
    desc: Destroy platform and reset Talos node
    interactive: true
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    requires:
      vars:
        - TALOS_NODE
    cmds:
      - '"{{.ANSIBLE_PLAYBOOK}}" ansible/playbooks/cluster-destroy.yml'

  # Talos operations
  talos:gen:
    desc: Generate Talos config using configured client paths
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    requires:
      vars:
        - TALOS_NODE
        - TALOS_CLUSTER_NAME
        - TALOS_INSTALL_DISK
    cmds:
      - task: secrets:invoke
        vars:
          scope: talos
          playbook: talos-generate.yml

  talos:apply:
    desc: Apply Talos config to control plane
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    requires:
      vars:
        - TALOS_NODE
    cmds:
      - '"{{.ANSIBLE_PLAYBOOK}}" ansible/playbooks/talos-apply.yml'

  talos:bootstrap:
    desc: Bootstrap Talos control plane and kubeconfig
    interactive: true
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    requires:
      vars:
        - TALOS_NODE
        - TALOS_CLUSTER_NAME
    cmds:
      - '"{{.ANSIBLE_PLAYBOOK}}" ansible/playbooks/talos-bootstrap.yml'

  talos:upgrade:
    desc: Upgrade Talos on a node from the repo target version
    deps:
      - task: ansible:check
    requires:
      vars:
        - TALOS_NODE
    cmds:
      - '"{{.ANSIBLE_PLAYBOOK}}" ansible/playbooks/talos-upgrade.yml'

  talos:upgrade-k8s:
    desc: Upgrade Kubernetes control plane
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    requires:
      vars:
        - TALOS_NODE
        - K8S_VERSION
    cmds:
      - '"{{.ANSIBLE_PLAYBOOK}}" ansible/playbooks/talos-upgrade-k8s.yml'

  # Platform and Argo operations
  platform:create:
    desc: Create platform components via Ansible
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    cmds:
      - task: secrets:invoke
        vars:
          scope: platform
          playbook: platform-bootstrap.yml

  platform:destroy:
    desc: Destroy platform components via Ansible
    interactive: true
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    cmds:
      - '"{{.ANSIBLE_PLAYBOOK}}" ansible/playbooks/platform-destroy.yml'

  argo:sync:
    desc: Force Argo CD Applications to refresh
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    vars:
      app: '{{.app | default ""}}'
    cmds:
      - '"{{.ANSIBLE_PLAYBOOK}}" ansible/playbooks/argo-refresh.yml {{if .app}}-e "app={{.app}}"{{end}}'

  restic:restore:
    desc: Plan or run a restic restore for one Argo CD app
    interactive: true
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    vars:
      app: '{{.app | default ""}}'
      snapshot: '{{.snapshot | default "latest"}}'
      confirm_restore: '{{.confirm_restore | default "false"}}'
    requires:
      vars:
        - app
    cmds:
      - '"{{.ANSIBLE_PLAYBOOK}}" ansible/playbooks/restic-restore.yml -e "restic_restore_mode=app" -e "restic_restore_app={{.app}}" -e "restic_restore_snapshot={{.snapshot}}" -e "restic_restore_confirm={{.confirm_restore}}"'

  restic:restore-all:
    desc: Plan or run a restic restore for all appdata PVCs
    interactive: true
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    vars:
      snapshot: '{{.snapshot | default "latest"}}'
      confirm_restore: '{{.confirm_restore | default "false"}}'
    cmds:
      - '"{{.ANSIBLE_PLAYBOOK}}" ansible/playbooks/restic-restore.yml -e "restic_restore_mode=all" -e "restic_restore_snapshot={{.snapshot}}" -e "restic_restore_confirm={{.confirm_restore}}"'

  # Terraform operations
  tf:plan:
    desc: Terraform plan
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    cmds:
      - task: secrets:invoke
        vars:
          scope: terraform
          playbook: terraform-plan.yml

  tf:apply:
    desc: Terraform apply
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    cmds:
      - task: secrets:invoke
        vars:
          scope: terraform
          playbook: terraform-apply.yml

  tf:clean:
    desc: Clean terraform state/cache
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: ansible:check
    cmds:
      - '"{{.ANSIBLE_PLAYBOOK}}" ansible/playbooks/terraform-clean.yml'
