---
name: Data tools image

on:
  pull_request:
    paths:
      - .dockerignore
      - containers/data-tools/**
      - ansible/roles/shared_data/**
      - ansible/roles/platform/**
      - ansible/playbooks/platform-recovery-executor.yml
      - ansible/playbooks/shared-data.yml
      - ansible/requirements.yml
      - .github/workflows/data-tools.yml
  push:
    branches:
      - master
    paths:
      - .dockerignore
      - containers/data-tools/**
      - ansible/roles/shared_data/**
      - ansible/roles/platform/**
      - ansible/playbooks/platform-recovery-executor.yml
      - ansible/playbooks/shared-data.yml
      - ansible/requirements.yml
      - .github/workflows/data-tools.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and smoke-test operations image
        run: |
          python3 ansible/roles/platform/files/cold_bundle.py build-context --root . --revision "$GITHUB_SHA" > "$RUNNER_TEMP/data-tools-context.tar"
          docker build --build-arg HOME_OPS_SOURCE_REVISION="$GITHUB_SHA" --tag data-tools:test --file containers/data-tools/Dockerfile - < "$RUNNER_TEMP/data-tools-context.tar"
          smoke=(docker run --rm --network none --user 1000:1000 --read-only --tmpfs /tmp:mode=1777 --env HOME=/tmp --env ANSIBLE_LOCAL_TEMP=/tmp/ansible-local --env ANSIBLE_REMOTE_TEMP=/tmp/ansible-remote)
          "${smoke[@]}" --entrypoint python data-tools:test ansible/roles/shared_data/files/data_tools.py validate
          "${smoke[@]}" --entrypoint python data-tools:test -c 'import jsonpatch, kubernetes, psycopg, redis'
          "${smoke[@]}" --entrypoint pg_dump data-tools:test --version
          "${smoke[@]}" --entrypoint restic data-tools:test version
          "${smoke[@]}" data-tools:test --syntax-check
          "${smoke[@]}" --entrypoint helm data-tools:test version --short
          "${smoke[@]}" --entrypoint ansible-playbook data-tools:test ansible/playbooks/platform-recovery-executor.yml --syntax-check
          expected_code_sha="$(python3 -c 'import sys,tarfile,json; print(json.load(tarfile.open(sys.argv[1]).extractfile(".home-ops-build.json"))["code_sha256"])' "$RUNNER_TEMP/data-tools-context.tar")"
          "${smoke[@]}" --entrypoint python data-tools:test ansible/roles/platform/files/cold_bundle.py verify-image --root /opt/home-ops --revision "$GITHUB_SHA" --code-sha256 "$expected_code_sha"
      - name: Verify PostgreSQL dump and recovery inside the operations image
        run: |
          data_smoke_network=data-tools-smoke
          data_smoke_database=data-tools-postgres
          cleanup() {
            docker stop "$data_smoke_database" >/dev/null 2>&1 || true
            docker rm -v "$data_smoke_database" >/dev/null 2>&1 || true
            docker network rm "$data_smoke_network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          postgres_image="$(awk '$1 == "FROM" && $NF == "postgres" {print $2}' containers/data-tools/Dockerfile)"
          docker network create "$data_smoke_network"
          docker run --detach --name "$data_smoke_database" --network "$data_smoke_network" --env POSTGRES_PASSWORD=synthetic-only "$postgres_image"
          docker run --rm --network "$data_smoke_network" --env PGHOST="$data_smoke_database" --env PGUSER=postgres --env PGPASSWORD=synthetic-only --entrypoint sh data-tools:test -euc '
            attempt=0
            until pg_isready >/dev/null 2>&1; do
              attempt=$((attempt + 1))
              test "$attempt" -lt 60
              sleep 1
            done
            psql -v ON_ERROR_STOP=1 -c "CREATE TABLE image_smoke(value text); INSERT INTO image_smoke VALUES ('"'"'preserved'"'"');"
            pg_dump --format=custom --file=/tmp/smoke.dump postgres
            psql -v ON_ERROR_STOP=1 -c "DROP TABLE image_smoke"
            pg_restore --exit-on-error --single-transaction --dbname=postgres /tmp/smoke.dump
            test "$(psql -Atc "SELECT value FROM image_smoke")" = preserved
            export RESTIC_REPOSITORY=/tmp/image-smoke-restic RESTIC_PASSWORD=synthetic-only
            restic init
            restic backup /tmp/smoke.dump --host image-smoke
            restic check --read-data
          '
      - name: Publish immutable commit image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          IMAGE: ghcr.io/edgard/home-ops-data-tools
          REVISION: ${{ github.sha }}
        run: |-
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          docker tag data-tools:test "$IMAGE:$REVISION"
          docker push "$IMAGE:$REVISION"
          docker logout ghcr.io
