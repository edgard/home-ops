---
name: Setup Home Ops Toolchain
description: Install pinned tools for Home Ops CI jobs.

inputs:
  profile:
    description: "Tool profile to install: format, lint, test."
    required: true

runs:
  using: composite
  steps:
    - name: Validate Profile
      shell: bash
      env:
        HOME_OPS_TOOLCHAIN_PROFILE: ${{ inputs.profile }}
      run: |
        case "$HOME_OPS_TOOLCHAIN_PROFILE" in
          format | lint | test)
            ;;
          *)
            echo "::error::Unsupported toolchain profile: $HOME_OPS_TOOLCHAIN_PROFILE"
            exit 1
            ;;
        esac

    - name: Set Up Task
      uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      with:
        # renovate: datasource=github-releases depName=go-task/task
        version: 3.54.0
        max-retries: 5

    - name: Set Up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: pyproject.toml

    - name: Set Up uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        # renovate: datasource=github-releases depName=astral-sh/uv
        version: "0.13.6"
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Set Up Node
      if: ${{ inputs.profile == 'test' }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26

    - name: Set Up Helm
      if: ${{ inputs.profile == 'test' }}
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        # renovate: datasource=github-releases depName=helm/helm
        version: v4.3.1

    - name: Set Up OpenTofu
      uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      with:
        # renovate: datasource=github-releases depName=opentofu/opentofu
        tofu_version: v1.13.1
        tofu_wrapper: false

    - name: Set Up Project Dependencies
      shell: bash
      run: task deps

    - name: Install SecretSpec
      if: ${{ inputs.profile == 'test' }}
      shell: bash
      run: |
        version="$(.venv/bin/python -c 'import yaml; print(yaml.safe_load(open("ansible/roles/cli_secrets/defaults/main.yml"))["cli_secrets_secretspec_version"])')"
        archive="secretspec-x86_64-unknown-linux-gnu.tar.xz"
        release="https://github.com/cachix/secretspec/releases/download/v${version}"
        tmp="$(mktemp -d "$RUNNER_TEMP/secretspec.XXXXXX")"
        trap 'rm -rf "$tmp"' EXIT

        curl --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 -fsSLo "$tmp/$archive" "$release/$archive"
        curl --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 -fsSLo "$tmp/$archive.sha256" "$release/$archive.sha256"
        (cd "$tmp" && sha256sum --check --status "$archive.sha256")
        tar -xJf "$tmp/$archive" -C "$tmp"
        test "$("$tmp/secretspec-x86_64-unknown-linux-gnu/secretspec" --version)" = "secretspec $version"
        mkdir -p "$RUNNER_TEMP/home-ops-bin"
        install -m 0755 "$tmp/secretspec-x86_64-unknown-linux-gnu/secretspec" "$RUNNER_TEMP/home-ops-bin/secretspec"
        echo "$RUNNER_TEMP/home-ops-bin" >> "$GITHUB_PATH"

    - name: Set Up pluto
      if: ${{ inputs.profile == 'test' }}
      uses: FairwindsOps/pluto/github-action@ac2c42d55d5ff46a1af0f4b15faf3555119eea23 # v5.24.4
      with:
        # renovate: datasource=docker depName=us-docker.pkg.dev/fairwinds-ops/oss/pluto
        IMAGE_TAG: v5.23

    - name: Set Up kubeconform
      if: ${{ inputs.profile == 'test' }}
      uses: bmuschko/setup-kubeconform@e5d264ec1eafe2314e750c429a9da7639dd5a003 # v1.1.0
      with:
        # renovate: datasource=github-releases depName=yannh/kubeconform
        kubeconform-version: "0.8.0"

    - name: Install APT Tools
      if: ${{ inputs.profile == 'lint' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck

    - name: Install yamlfmt
      if: ${{ inputs.profile == 'format' }}
      shell: bash
      env:
        # renovate: datasource=github-releases depName=google/yamlfmt
        YAMLFMT_VERSION: v0.21.0
      run: |
        version="${YAMLFMT_VERSION#v}"
        archive="yamlfmt_${version}_Linux_x86_64.tar.gz"
        checksum="checksums.txt"
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT

        curl --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 -fsSLo "$tmp/$archive" "https://github.com/google/yamlfmt/releases/download/${YAMLFMT_VERSION}/${archive}"
        curl --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 -fsSLo "$tmp/$checksum" "https://github.com/google/yamlfmt/releases/download/${YAMLFMT_VERSION}/${checksum}"

        grep "  ${archive}$" "$tmp/$checksum" | (cd "$tmp" && sha256sum --check --status)
        sudo tar -xzf "$tmp/$archive" -C /usr/local/bin yamlfmt
        yamlfmt -version

    - name: Install actionlint
      if: ${{ inputs.profile == 'lint' }}
      shell: bash
      env:
        # renovate: datasource=github-releases depName=rhysd/actionlint
        ACTIONLINT_VERSION: v1.7.12
      run: |-
        version="${ACTIONLINT_VERSION#v}"
        archive="actionlint_${version}_linux_amd64.tar.gz"
        checksum="actionlint_${version}_checksums.txt"
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT

        curl --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 -fsSLo "$tmp/$archive" "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/${archive}"
        curl --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 -fsSLo "$tmp/$checksum" "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/${checksum}"

        grep "  ${archive}$" "$tmp/$checksum" | (cd "$tmp" && sha256sum --check --status)
        sudo tar -xzf "$tmp/$archive" -C /usr/local/bin actionlint
        actionlint -version
