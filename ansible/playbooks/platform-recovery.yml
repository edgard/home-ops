---
- name: Bootstrap cold recovery infrastructure with consumers held
  hosts: localhost
  gather_facts: false
  vars:
    platform_recovery_mode: true
    platform_recovery_apps: "{{ lookup('ansible.builtin.env','HOME_OPS_RECOVERY_APPS').split(',') }}"
    platform_recovery_operation: "{{ lookup('ansible.builtin.env','HOME_OPS_RECOVERY_OPERATION') }}"
  tasks:
    - name: Bootstrap held platform
      ansible.builtin.include_role:
        name: platform
        tasks_from: bootstrap
