---
- name: Create Talos cluster and bootstrap platform
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Preflight all bootstrap inputs before node mutation
      ansible.builtin.include_role:
        name: platform
        tasks_from: preflight
      vars:
        platform_preflight_cluster: true

    - name: Generate Talos configuration
      ansible.builtin.include_role:
        name: talos
        tasks_from: generate

    - name: Execute composed creation under one exclusion owner
      ansible.builtin.include_role:
        name: node_operation
      vars:
        node_operation_action: cluster-create
