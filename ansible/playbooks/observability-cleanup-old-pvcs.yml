---
- name: Delete retired observability resources after the Victoria cutover
  hosts: localhost
  gather_facts: false
  vars:
    observability_cleanup_confirm: false
    observability_cleanup_namespace: platform-system
    observability_cleanup_old_statefulsets:
      - alertmanager-kube-prometheus-stack-alertmanager
      - alloy
      - kube-prometheus-stack-grafana
      - loki
      - prometheus-kube-prometheus-stack-prometheus
    observability_cleanup_new_pvcs:
      - server-volume-victoria-logs-single-server-0
      - storage-victoria-metrics-k8s-stack-grafana-0
      - vmsingle-victoria-metrics-k8s-stack
    observability_cleanup_old_pvcs:
      - alertmanager-kube-prometheus-stack-alertmanager-db-alertmanager-kube-prometheus-stack-alertmanager-0
      - prometheus-kube-prometheus-stack-prometheus-db-prometheus-kube-prometheus-stack-prometheus-0
      - storage-alloy-0
      - storage-kube-prometheus-stack-grafana-0
      - storage-loki-0
    observability_cleanup_old_custom_resources:
      - api_version: monitoring.coreos.com/v1alpha1
        kind: AlertmanagerConfig
        crd: alertmanagerconfigs.monitoring.coreos.com
      - api_version: monitoring.coreos.com/v1
        kind: Alertmanager
        crd: alertmanagers.monitoring.coreos.com
      - api_version: monitoring.coreos.com/v1
        kind: PodMonitor
        crd: podmonitors.monitoring.coreos.com
      - api_version: monitoring.coreos.com/v1
        kind: Probe
        crd: probes.monitoring.coreos.com
      - api_version: monitoring.coreos.com/v1alpha1
        kind: PrometheusAgent
        crd: prometheusagents.monitoring.coreos.com
      - api_version: monitoring.coreos.com/v1
        kind: Prometheus
        crd: prometheuses.monitoring.coreos.com
      - api_version: monitoring.coreos.com/v1
        kind: PrometheusRule
        crd: prometheusrules.monitoring.coreos.com
      - api_version: monitoring.coreos.com/v1alpha1
        kind: ScrapeConfig
        crd: scrapeconfigs.monitoring.coreos.com
      - api_version: monitoring.coreos.com/v1
        kind: ServiceMonitor
        crd: servicemonitors.monitoring.coreos.com
      - api_version: monitoring.coreos.com/v1
        kind: ThanosRuler
        crd: thanosrulers.monitoring.coreos.com

  tasks:
    - name: Require explicit legacy observability cleanup confirmation
      ansible.builtin.assert:
        that:
          - observability_cleanup_confirm | bool
        fail_msg: >-
          Refusing to delete legacy observability resources. Re-run with
          observability_cleanup_confirm=true only after the Victoria cutover has been verified.

    - name: Read StatefulSets remaining in the observability namespace
      kubernetes.core.k8s_info:
        context: "{{ kube_context }}"
        api_version: apps/v1
        kind: StatefulSet
        namespace: "{{ observability_cleanup_namespace }}"
      register: observability_cleanup_statefulsets

    - name: Assert retired StatefulSets have been pruned
      ansible.builtin.assert:
        that:
          - >-
            observability_cleanup_statefulsets.resources
            | map(attribute='metadata.name')
            | intersect(observability_cleanup_old_statefulsets)
            | length == 0
        fail_msg: "A retired Prometheus, Alertmanager, Grafana, Loki, or Alloy StatefulSet still exists."

    - name: Read replacement observability claims
      kubernetes.core.k8s_info:
        context: "{{ kube_context }}"
        api_version: v1
        kind: PersistentVolumeClaim
        name: "{{ item }}"
        namespace: "{{ observability_cleanup_namespace }}"
      loop: "{{ observability_cleanup_new_pvcs }}"
      register: observability_cleanup_replacement_claims

    - name: Assert every replacement claim exists and is distinct
      ansible.builtin.assert:
        that:
          - item.resources | length == 1
          - item.resources[0].metadata.name not in observability_cleanup_old_pvcs
        fail_msg: "Replacement observability claim is missing or overlaps a legacy claim: {{ item.item }}"
      loop: "{{ observability_cleanup_replacement_claims.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read retired Prometheus Operator CRDs
      kubernetes.core.k8s_info:
        context: "{{ kube_context }}"
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: "{{ item.crd }}"
      loop: "{{ observability_cleanup_old_custom_resources }}"
      loop_control:
        label: "{{ item.crd }}"
      register: observability_cleanup_old_crds

    - name: Reset present Prometheus custom resource types
      ansible.builtin.set_fact:
        observability_cleanup_present_custom_resources: []

    - name: Select installed Prometheus custom resource types
      ansible.builtin.set_fact:
        observability_cleanup_present_custom_resources: "{{ observability_cleanup_present_custom_resources + [item.item] }}"
      when: item.resources | length == 1
      loop: "{{ observability_cleanup_old_crds.results }}"
      loop_control:
        label: "{{ item.item.kind }}"

    - name: Read legacy Prometheus custom resources
      kubernetes.core.k8s_info:
        context: "{{ kube_context }}"
        api_version: "{{ item.api_version }}"
        kind: "{{ item.kind }}"
      loop: "{{ observability_cleanup_present_custom_resources }}"
      loop_control:
        label: "{{ item.kind }}"
      register: observability_cleanup_old_resources

    - name: Assert legacy Prometheus custom resources are absent
      ansible.builtin.assert:
        that:
          - item.resources | length == 0
        fail_msg: "Refusing to delete {{ item.item.crd }} while {{ item.item.kind }} resources still exist."
      loop: "{{ observability_cleanup_old_resources.results }}"
      loop_control:
        label: "{{ item.item.kind }}"

    - name: Delete retired Prometheus kubelet service
      kubernetes.core.k8s:
        context: "{{ kube_context }}"
        state: absent
        api_version: v1
        kind: Service
        name: kube-prometheus-stack-kubelet
        namespace: kube-system

    - name: Delete retired Prometheus Operator CRDs
      kubernetes.core.k8s:
        context: "{{ kube_context }}"
        state: absent
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: "{{ item.crd }}"
      loop: "{{ observability_cleanup_old_custom_resources }}"
      loop_control:
        label: "{{ item.crd }}"

    - name: Delete exact retired observability claims
      kubernetes.core.k8s:
        context: "{{ kube_context }}"
        state: absent
        api_version: v1
        kind: PersistentVolumeClaim
        name: "{{ item }}"
        namespace: "{{ observability_cleanup_namespace }}"
      loop: "{{ observability_cleanup_old_pvcs }}"
