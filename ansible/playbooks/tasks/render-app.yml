---
- name: Set chart cache paths
  ansible.builtin.set_fact:
    validation_chart_repo: "{{ validation_app.chart_repo }}"
    validation_chart_name: "{{ validation_app.chart_name if validation_app.chart_name else validation_app.chart_repo.split('/')[-1] }}"
    validation_chart_key: "{{ (validation_app.chart_repo ~ '|' ~ validation_app.chart_name ~ '|' ~ validation_app.chart_version) | hash('sha256') }}"

- name: Create chart cache directory
  ansible.builtin.file:
    path: "{{ validation_workdir.path }}/charts/{{ validation_chart_key }}"
    state: directory
    mode: "0700"

- name: Check chart cache
  ansible.builtin.stat:
    path: "{{ validation_workdir.path }}/charts/{{ validation_chart_key }}/{{ validation_chart_name }}"
  register: validation_chart_stat

- name: Pull chart once per repository and version
  ansible.builtin.command:
    argv: >-
      {{ ['helm', 'pull', validation_chart_repo if validation_chart_repo.startswith('oci://') else validation_chart_name,
          '--version', validation_app.chart_version, '--untar', '--untardir',
          validation_workdir.path ~ '/charts/' ~ validation_chart_key]
         + ([] if validation_chart_repo.startswith('oci://') else ['--repo', validation_chart_repo]) }}
  environment: "{{ validation_helm_env }}"
  register: validation_chart_pull
  retries: 3
  delay: 3
  until: validation_chart_pull is succeeded
  changed_when: true
  when: not validation_chart_stat.stat.exists

- name: Render application chart
  ansible.builtin.command:
    argv:
      - helm
      - template
      - test
      - "{{ validation_workdir.path }}/charts/{{ validation_chart_key }}/{{ validation_chart_name }}"
      - --values
      - "{{ validation_app.values_file }}"
      - --kube-version
      - "{{ validation_k8s_version | regex_replace('^v', '') }}"
      - --api-versions
      - gateway.networking.k8s.io/v1/HTTPRoute
  environment: "{{ validation_helm_env }}"
  register: validation_rendered_app
  changed_when: false

- name: Save rendered application
  ansible.builtin.file:
    path: "{{ validation_workdir.path }}/rendered/{{ validation_app.category }}"
    state: directory
    mode: "0700"

- name: Write rendered application
  ansible.builtin.copy:
    dest: "{{ validation_workdir.path }}/rendered/{{ validation_app.category }}/{{ validation_app.app_name }}.yaml"
    content: "{{ validation_rendered_app.stdout }}\n"
    mode: "0600"

- name: Track rendered application
  ansible.builtin.set_fact:
    validation_rendered_paths: "{{ validation_rendered_paths + [validation_workdir.path ~ '/rendered/' ~ validation_app.category ~ '/' ~ validation_app.app_name ~ '.yaml'] }}"
