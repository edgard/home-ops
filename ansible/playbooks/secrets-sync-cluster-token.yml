---
- name: Synchronize validated scoped ESO token to the cluster
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Load and validate operator credential tooling
      ansible.builtin.include_role:
        name: operator_secrets
        tasks_from: validate
        public: true

    - name: Synchronize ESO token with native cluster reconciliation
      ansible.builtin.include_role:
        name: platform
        tasks_from: sync_token
