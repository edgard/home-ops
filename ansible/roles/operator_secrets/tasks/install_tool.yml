---
- name: Create operator tool staging directory
  ansible.builtin.tempfile:
    state: directory
    suffix: "{{ operator_secrets_tool }}-install"
  register: operator_secrets_tool_temp

- name: Verify and install staged operator executable
  block:
    - name: Download checksum-verified operator archive
      ansible.builtin.get_url:
        url: "{{ operator_secrets_tools_catalog[operator_secrets_tool].url }}"
        dest: "{{ operator_secrets_tool_temp.path }}/{{ operator_secrets_tools_catalog[operator_secrets_tool].url | basename }}"
        checksum: "sha256:{{ operator_secrets_tools_catalog[operator_secrets_tool].checksum }}"
        mode: "0600"
        timeout: 120
      register: operator_secrets_tool_download
      retries: 5
      delay: 2
      until: operator_secrets_tool_download is succeeded

    - name: Extract verified operator archive
      when: ansible_facts.system != 'Darwin' or not operator_secrets_tool_download.dest.endswith('.tar.xz')
      ansible.builtin.unarchive:
        src: "{{ operator_secrets_tool_download.dest }}"
        dest: "{{ operator_secrets_tool_temp.path }}"
        remote_src: true

    # Ansible unarchive requires GNU tar; macOS provides BSD tar with xz support.
    - name: Extract verified operator tar archive on macOS
      when: ansible_facts.system == 'Darwin' and operator_secrets_tool_download.dest.endswith('.tar.xz')
      ansible.builtin.command:
        argv:
          - tar
          - -xf
          - "{{ operator_secrets_tool_download.dest }}"
          - -C
          - "{{ operator_secrets_tool_temp.path }}"
      changed_when: true

    - name: Locate staged operator executable
      ansible.builtin.find:
        paths: "{{ operator_secrets_tool_temp.path }}"
        patterns: "{{ operator_secrets_tool }}"
        file_type: file
        recurse: true
      register: operator_secrets_tool_binary

    - name: Require one operator executable in verified release
      ansible.builtin.assert:
        that: operator_secrets_tool_binary.matched == 1
        fail_msg: The verified operator release must contain exactly one executable for the selected tool.

    - name: Atomically install operator executable
      ansible.builtin.copy:
        src: "{{ operator_secrets_tool_binary.files[0].path }}"
        dest: "{{ operator_secrets_tools_directory }}/{{ operator_secrets_tool }}"
        remote_src: true
        mode: "0755"
        unsafe_writes: false
  always:
    - name: Remove operator tool staging directory
      ansible.builtin.file:
        path: "{{ operator_secrets_tool_temp.path }}"
        state: absent
