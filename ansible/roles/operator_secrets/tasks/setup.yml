---
- name: Gather operator platform facts
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - platform

- name: Validate supported operator tools and platform
  ansible.builtin.assert:
    that:
      - operator_secrets_tools_system | length > 0
      - operator_secrets_tools_architecture | length > 0
      - operator_secrets_install_tools is sequence
      - operator_secrets_install_tools is not string
      - operator_secrets_install_tools | length > 0
      - operator_secrets_install_tools | difference(['secretspec', 'bws']) | length == 0
      - operator_secrets_install_tools | difference(operator_secrets_tools_catalog.keys() | list) | length == 0
      - operator_secrets_tools_directory is abs
    fail_msg: Tool setup requires macOS/Linux arm64 or x86_64, supported tool names, and an absolute user-owned install directory.

- name: Install verified operator tools
  when: not ansible_check_mode
  block:
    - name: Create operator binary directory
      ansible.builtin.file:
        path: "{{ operator_secrets_tools_directory }}"
        state: directory
        mode: "0755"

    - name: Install selected operator release
      ansible.builtin.include_tasks: install_tool.yml
      loop: "{{ operator_secrets_install_tools | unique }}"
      loop_control:
        loop_var: operator_secrets_tool
