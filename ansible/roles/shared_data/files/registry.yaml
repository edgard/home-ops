      - media/prowlarr/logs.db
    databases:
      - name: prowlarr-main
        owner: prowlarr
      - name: prowlarr-log
        owner: prowlarr
    roles:
      - name: prowlarr
        password_key: prowlarr_db_password
        connection_limit: 10
    workloads:
      - kind: Deployment
        name: prowlarr
    cronjobs: []
    pvcs:
      - media/prowlarr
    migration:
      adapter: servarr
    key_refs: []
  bazarr:
    namespace: media
    enabled: false
    backend: sqlite
    sqlite_files:
      - media/bazarr/db/bazarr.db
    databases:
      - name: bazarr
        owner: bazarr
    roles:
      - name: bazarr
        password_key: bazarr_db_password
        connection_limit: 10
    workloads:
      - kind: Deployment
        name: bazarr
    cronjobs: []
    pvcs:
      - media/bazarr
    migration:
      adapter: bazarr
    key_refs: []
  homeassistant:
    namespace: home-automation
    enabled: false
    backend: sqlite
    sqlite_files:
      - home-automation/homeassistant/home-assistant_v2.db
    databases:
      - name: homeassistant
        owner: homeassistant
    roles:
      - name: homeassistant
        password_key: homeassistant_db_password
        connection_limit: 10
    workloads:
      - kind: Deployment
        name: homeassistant
    cronjobs: []
    pvcs:
      - home-automation/homeassistant
    migration:
      adapter: fresh
    key_refs: []
