---
version: 1
consumers:
  sure:
    namespace: selfhosted
    enabled: false
    drain:
      workload: sure-worker
      minimum_grace_seconds: 1900
      command: bundle exec rails runner 'require "sidekiq/api"; abort "busy" unless Sidekiq::ProcessSet.new.sum { |process| process["busy"] }.zero?'
    databases:
      - name: sure
        owner: sure
        extensions:
          - pgcrypto
    roles:
      - name: sure
        password_key: sure_db_password
        connection_limit: 10
    workloads:
      - kind: Deployment
        name: sure-main
      - kind: Deployment
        name: sure-worker
    cronjobs: []
    pvcs:
      - selfhosted/sure
    migration:
      adapter: new
    key_refs:
      - sure_secret_key_base
      - sure_encryption_primary_key
      - sure_encryption_deterministic_key
      - sure_encryption_salt
    redis:
      database: 1
      username: sure
      password_key: sure_redis_password
      prefix: "sure:"
  sparkyfitness:
    namespace: selfhosted
    enabled: false
    databases:
      - name: sparkyfitness_db
        owner: sparky_admin
    roles:
      - name: sparky_admin
        password_key: sparkyfitness_db_password
        connection_limit: 24
      - name: sparky_app
        password_key: sparkyfitness_app_db_password
        connection_limit: 12
    workloads:
      - kind: Deployment
        name: sparkyfitness-main
      - kind: Deployment
        name: sparkyfitness-server
      - kind: Deployment
        name: sparkyfitness-garmin
    cronjobs: []
    pvcs:
      - selfhosted/sparkyfitness-uploads
      - selfhosted/sparkyfitness-backup
    migration:
      adapter: new
    key_refs:
      - sparkyfitness_api_encryption_key
      - sparkyfitness_auth_secret
  paperless:
    namespace: selfhosted
    enabled: false
    drain:
      workload: paperless-main
      minimum_grace_seconds: 2000
      command: python3 -c 'from paperless.celery import app; inspector=app.control.inspect(timeout=10); batches=[inspector.active(), inspector.reserved()]; assert all(batch and all(not tasks for tasks in batch.values()) for batch in batches)'
    databases:
      - name: paperless
        owner: paperless
    roles:
      - name: paperless
        password_key: paperless_db_password
        connection_limit: 10
    workloads:
      - kind: Deployment
        name: paperless-main
      - kind: Deployment
        name: paperless-gpt
    cronjobs: []
    pvcs:
      - selfhosted/paperless
    migration:
      adapter: paperless
    key_refs:
      - paperless_secret_key
    redis:
      database: 2
      username: paperless
      password_key: paperless_redis_password
      prefix: "paperless:"
  bambuddy:
    namespace: selfhosted
    enabled: false
    databases:
      - name: bambuddy
        owner: bambuddy
    roles:
      - name: bambuddy
        password_key: bambuddy_db_password
        connection_limit: 10
    workloads:
      - kind: Deployment
        name: bambuddy
    cronjobs: []
    pvcs:
      - selfhosted/bambuddy
    migration:
      adapter: bambuddy
    key_refs:
      - bambuddy_mfa_encryption_key
  atuin:
    namespace: selfhosted
    enabled: false
    databases:
      - name: atuin
        owner: atuin
    roles:
      - name: atuin
        password_key: atuin_db_password
        connection_limit: 10
    workloads:
      - kind: Deployment
        name: atuin
    cronjobs: []
    pvcs:
      - selfhosted/atuin
    migration:
      adapter: atuin
    key_refs: []
  sonarr:
    namespace: media
    enabled: false
    databases:
      - name: sonarr-main
        owner: sonarr
      - name: sonarr-log
        owner: sonarr
    roles:
      - name: sonarr
        password_key: sonarr_db_password
        connection_limit: 10
    workloads:
      - kind: Deployment
        name: sonarr
    cronjobs: []
    pvcs:
      - media/sonarr
    migration:
      adapter: servarr
    key_refs: []
  radarr:
    namespace: media
    enabled: false
    databases:
      - name: radarr-main
        owner: radarr
      - name: radarr-log
        owner: radarr
    roles:
      - name: radarr
        password_key: radarr_db_password
        connection_limit: 10
    workloads:
      - kind: Deployment
        name: radarr
    cronjobs: []
    pvcs:
      - media/radarr
    migration:
      adapter: servarr
    key_refs: []
  prowlarr:
    namespace: media
    enabled: false
    databases:
      - name: prowlarr-main
        owner: prowlarr
      - name: prowlarr-log
        owner: prowlarr
    roles:
      - name: prowlarr
        password_key: prowlarr_db_password
        connection_limit: 10
    workloads:
      - kind: Deployment
        name: prowlarr
    cronjobs: []
    pvcs:
      - media/prowlarr
    migration:
      adapter: servarr
    key_refs: []
  bazarr:
    namespace: media
    enabled: false
    databases:
      - name: bazarr
        owner: bazarr
    roles:
      - name: bazarr
        password_key: bazarr_db_password
        connection_limit: 10
    workloads:
      - kind: Deployment
        name: bazarr
    cronjobs: []
    pvcs:
      - media/bazarr
    migration:
      adapter: bazarr
    key_refs: []
  homeassistant:
    namespace: home-automation
    enabled: false
    databases:
      - name: homeassistant
        owner: homeassistant
    roles:
      - name: homeassistant
        password_key: homeassistant_db_password
        connection_limit: 10
    workloads:
      - kind: Deployment
        name: homeassistant
    cronjobs: []
    pvcs:
      - home-automation/homeassistant
    migration:
      adapter: fresh
    key_refs: []
