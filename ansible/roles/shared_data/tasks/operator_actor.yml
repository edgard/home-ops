---
- name: Verify current live operator actor
  ansible.builtin.include_tasks: maintenance_executor.yml
- name: Require the exact bounded standalone operator Pod
  ansible.builtin.assert:
    that:
      - shared_data_executor_read.resources[0].metadata.ownerReferences | default([]) | length == 0
      - shared_data_executor_read.resources[0].metadata.name == shared_data_holder_pod_name
      - shared_data_executor_read.resources[0].metadata.labels['home-ops/data-role'] == 'operator'
      - shared_data_executor_read.resources[0].metadata.labels['home-ops/data-operation'] == shared_data_operation_id
      - shared_data_executor_read.resources[0].spec.restartPolicy == 'Never'
      - shared_data_executor_read.resources[0].spec.activeDeadlineSeconds | int >= 3600
      - shared_data_executor_read.resources[0].spec.activeDeadlineSeconds | int <= 43200
      - shared_data_executor_read.resources[0].spec.containers | length == 1
      - shared_data_executor_read.resources[0].spec.containers[0].name == 'operations'
      - shared_data_executor_read.resources[0].spec.containers[0].image == shared_data_image
      - shared_data_executor_read.resources[0].status.containerStatuses | default([]) | selectattr('restartCount', 'gt', 0) | length == 0
    fail_msg: The original live standalone operator identity and pinned image are required.
