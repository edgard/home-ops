---
- name: Verify the new live lease executor
  ansible.builtin.include_tasks: maintenance_executor.yml
- name: Read current Lease immediately before acquisition or takeover
  kubernetes.core.k8s_info:
    api_version: coordination.k8s.io/v1
    kind: Lease
    name: "{{ shared_data_lease_name | default('shared-data-operation') }}"
    namespace: "{{ shared_data_namespace | default('selfhosted') }}"
  register: shared_data_takeover_read
- name: Acquire only the exact inspected Lease with the current executor UID
  kubernetes.core.k8s_json_patch:
    api_version: coordination.k8s.io/v1
    kind: Lease
    name: "{{ shared_data_lease_name | default('shared-data-operation') }}"
    namespace: "{{ shared_data_namespace | default('selfhosted') }}"
    patch: >-
      {{ shared_data_takeover_read.resources[0] | shared_data_lease_takeover(
         shared_data_takeover_expected_identity, shared_data_operation_id, shared_data_operation_kind,
         shared_data_executor, '' | shared_data_now, shared_data_lease_duration | default(900),
         shared_data_takeover_stage | default('journaled')) }}
  register: shared_data_takeover_result
