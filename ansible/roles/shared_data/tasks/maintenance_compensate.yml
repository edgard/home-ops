---
- name: Initialize visible compensation failures without discarding original snapshots
  ansible.builtin.set_fact:
    shared_data_compensation_failures: []
- name: Compensate root before independently holding all remaining GitOps targets
  ansible.builtin.include_tasks: maintenance_compensate_target.yml
  loop: "{{ shared_data_journal.snapshots | selectattr('role', 'in', ['root', 'appset', 'application']) | list }}"
  loop_control:
    loop_var: shared_data_target
    label: "{{ shared_data_target.role }}/{{ shared_data_target.name }}"
