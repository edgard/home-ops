---
- name: Verify current recovery actor before any coordination mutation
  ansible.builtin.include_tasks: maintenance_executor.yml
- name: Load durable operation state independently of NFS
  ansible.builtin.include_tasks: maintenance_load.yml
- name: Require matching incomplete journal for recovery
  ansible.builtin.assert:
    that:
      - shared_data_journal | length > 0
      - shared_data_journal.operation_id == shared_data_operation_id
      - shared_data_journal.operation_kind == shared_data_operation_kind
      - shared_data_journal.phase != 'complete'
    fail_msg: Recovery requires the exact incomplete operation journal.
- name: Read all historical coordinator and child Pods
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
  register: shared_data_recovery_pods
- name: Read restart-capable coordinator and child Jobs
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
  register: shared_data_recovery_jobs
- name: Decide backup-only recovery from expiry and immutable fencing evidence
  ansible.builtin.set_fact:
    shared_data_recovery_decision: "{{ shared_data_journal | shared_data_recovery(shared_data_lease, shared_data_recovery_pods.resources, shared_data_recovery_jobs.resources, '' | shared_data_now, shared_data_holder_pod_uid) }}"
- name: Explain recovery decision
  ansible.builtin.debug:
    var: shared_data_recovery_decision
- name: Take over only eligible fenced transactions under this recovery Pod UID
  when: shared_data_recovery_decision.record | default(false)
  block:
    - name: CAS takeover without reusing the dead coordinator identity
      ansible.builtin.include_tasks: maintenance_takeover.yml
      vars:
        shared_data_takeover_expected_identity: "{{ shared_data_lease.spec.holderIdentity }}"
    - name: Preserve original holder while recording current coordinator and epoch
      ansible.builtin.set_fact:
        shared_data_journal: "{{ shared_data_journal | combine({'coordinator': shared_data_executor, 'epoch': shared_data_takeover_result.result.spec.leaseTransitions, 'recovery_result': shared_data_recovery_decision.reason}) }}"
    - name: Publish only the exact inspected journal transition
      ansible.builtin.include_tasks: maintenance_save.yml
- name: Keep destructive or unfenced transactions held for operator inspection
  ansible.builtin.assert:
    that: shared_data_recovery_decision.resume
    fail_msg: "{{ shared_data_recovery_decision.reason }}; transaction remains held for operator inspection."
- name: Resume only the expired fenced backup under its new live owner
  ansible.builtin.include_tasks: maintenance_resume_execute.yml
