---
- name: Fence root before its ApplicationSet and children
  ansible.builtin.include_tasks: maintenance_patch.yml
  loop: "{{ shared_data_journal.snapshots | selectattr('role', 'in', ['root', 'appset', 'application']) | list }}"
  loop_control:
    loop_var: shared_data_target
    label: "{{ shared_data_target.role }}/{{ shared_data_target.name }}"
  vars:
    shared_data_restore_target: false
- name: Wait for already running Argo sync operations to finish
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "{{ shared_data_target.name }}"
    namespace: argocd
  register: shared_data_sync_read
  until: shared_data_sync_read.resources | shared_data_sync_idle
  retries: "{{ shared_data_wait_retries | default(60) }}"
  delay: "{{ shared_data_wait_delay | default(5) }}"
  loop: "{{ shared_data_journal.snapshots | selectattr('role', 'in', ['root', 'application']) | list }}"
  loop_control:
    loop_var: shared_data_target
    label: "{{ shared_data_target.name }}"
- name: Reapply fences after previously running syncs have drained
  ansible.builtin.include_tasks: maintenance_patch.yml
  loop: "{{ shared_data_journal.snapshots | selectattr('role', 'in', ['root', 'appset', 'application']) | list }}"
  loop_control:
    loop_var: shared_data_target
    label: "{{ shared_data_target.role }}/{{ shared_data_target.name }}"
  vars:
    shared_data_restore_target: false
- name: Freeze idle Application reconciliation with a fresh identity and operation guard
  ansible.builtin.include_tasks: maintenance_skip.yml
  loop: "{{ shared_data_journal.snapshots | selectattr('role', 'in', ['root', 'application']) | list }}"
  loop_control:
    loop_var: shared_data_target
    label: "{{ shared_data_target.name }}"
