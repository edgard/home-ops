---
- name: Wait for selected writer controllers to reach zero replicas
  kubernetes.core.k8s_info:
    api_version: "{{ shared_data_target.api_version }}"
    kind: "{{ shared_data_target.kind }}"
    name: "{{ shared_data_target.name }}"
    namespace: "{{ shared_data_target.namespace }}"
  register: shared_data_writer_read
  until:
    - shared_data_writer_read.resources | length == 1
    - shared_data_writer_read.resources[0].spec.replicas | default(1) == 0
    - shared_data_writer_read.resources[0].status.replicas | default(0) == 0
  retries: "{{ shared_data_wait_retries | default(60) }}"
  delay: "{{ shared_data_wait_delay | default(5) }}"
  loop: "{{ shared_data_wait_targets | rejectattr('role', 'equalto', 'cronjob') | list }}"
  loop_control:
    loop_var: shared_data_target
    label: "{{ shared_data_target.namespace }}/{{ shared_data_target.name }}"
- name: Wait for selected writers and CronJob-owned work to terminate naturally
  ansible.builtin.include_tasks: maintenance_wait_pods.yml
