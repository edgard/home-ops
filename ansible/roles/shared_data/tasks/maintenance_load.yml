---
- name: Read durable maintenance Lease
  kubernetes.core.k8s_info:
    api_version: coordination.k8s.io/v1
    kind: Lease
    name: "{{ shared_data_lease_name | default('shared-data-operation') }}"
    namespace: "{{ shared_data_namespace | default('selfhosted') }}"
  register: shared_data_lease_read
- name: Read durable nonsecret journal
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    name: "{{ shared_data_journal_name | default('shared-data-operation') }}"
    namespace: "{{ shared_data_namespace | default('selfhosted') }}"
  register: shared_data_journal_read
- name: Decode durable transaction state
  ansible.builtin.set_fact:
    shared_data_journal_resource_version: "{{ shared_data_journal_read.resources[0].metadata.resourceVersion if shared_data_journal_read.resources | length else '' }}"
    shared_data_journal_uid: "{{ shared_data_journal_read.resources[0].metadata.uid if shared_data_journal_read.resources | length else '' }}"
    shared_data_lease: "{{ shared_data_lease_read.resources | first | default({}) }}"
    shared_data_journal: "{{ (shared_data_journal_read.resources[0].data['journal.json'] | from_json) if shared_data_journal_read.resources | length else {} }}"
- name: Fail closed on conflicting durable journal
  ansible.builtin.assert:
    that:
      - shared_data_journal | length == 0 or shared_data_journal.phase == 'complete' or shared_data_journal.operation_id == shared_data_operation_id
      - shared_data_journal | length == 0 or shared_data_journal.phase == 'complete' or shared_data_journal.operation_kind == shared_data_operation_kind
    fail_msg: Another maintenance operation is held; inspect its journal before proceeding.
