---
- name: Verify live cleanup executor without impersonating the original holder
  ansible.builtin.include_tasks: maintenance_executor.yml
- name: Read all Pods for exact coordinator and child fencing
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
  register: shared_data_cleanup_pods
- name: Read all Jobs that could recreate a coordinator or writer
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
  register: shared_data_cleanup_jobs
- name: Read current original node identities for historical fencing
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
  register: shared_data_cleanup_nodes
- name: Identify a claimed-only orphan even when an earlier completed journal remains
  ansible.builtin.set_fact:
    shared_data_cleanup_orphan: >-
      {{ (shared_data_journal | length == 0 or shared_data_journal.phase == 'complete')
         and shared_data_lease | shared_data_orphan_releasable(shared_data_cleanup_pods.resources,
           shared_data_cleanup_jobs.resources, '' | shared_data_now, shared_data_holder_pod_uid, shared_data_cleanup_nodes.resources) }}
- name: Require durable proof that no target replay is needed
  ansible.builtin.assert:
    that:
      - >-
        shared_data_cleanup_orphan | bool
        or (shared_data_journal | length > 0 and
          shared_data_journal | shared_data_completed_releasable(shared_data_lease,
            shared_data_cleanup_pods.resources, shared_data_cleanup_jobs.resources,
            '' | shared_data_now, shared_data_admin_resume | default(false), shared_data_holder_pod_uid, shared_data_cleanup_nodes.resources))
    fail_msg: Lease cleanup lacks expired claimed-only or completed-journal fencing evidence; no targets or lock ownership were changed.
- name: Verify a completed journal still matches every original target before releasing its lock
  ansible.builtin.include_tasks: maintenance_verify_completed.yml
  when: not shared_data_cleanup_orphan | bool
- name: Release only the exact inspected stale Lease without touching target state
  kubernetes.core.k8s_json_patch:
    api_version: coordination.k8s.io/v1
    kind: Lease
    name: "{{ shared_data_lease_name | default('shared-data-operation') }}"
    namespace: "{{ shared_data_namespace | default('selfhosted') }}"
    patch: "{{ shared_data_lease | shared_data_lease_release(shared_data_lease.spec.holderIdentity, 'fenced orphan cleanup' if shared_data_cleanup_orphan | bool else 'fenced completed-journal cleanup') }}"
- name: Report exact stale Lease cleanup without replaying workload policies
  ansible.builtin.debug:
    msg: "Released {{ shared_data_lease.spec.holderIdentity }} after coordinator/child fencing; cleanup={{ 'orphan claimed-only' if shared_data_cleanup_orphan | bool else 'completed journal' }}."
