---
- name: Validate selected maintenance scope
  ansible.builtin.set_fact:
    shared_data_targets: >-
      {{ shared_data_registry | shared_data_targets(shared_data_apps,
         shared_data_operation_id, shared_data_operation_kind,
         shared_data_tuppr_namespace | default('platform-system'),
         shared_data_tuppr_name | default('tuppr')) }}
- name: Explain maintenance preview
  ansible.builtin.debug:
    msg: "Maintenance {{ shared_data_operation_id }} selects {{ shared_data_apps }}; confirm={{ shared_data_confirm | default(false) | bool }}, check={{ ansible_check_mode }}."
