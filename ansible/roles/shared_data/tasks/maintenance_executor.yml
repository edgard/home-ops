---
- name: Require confirmed live execution before any coordination write
  ansible.builtin.assert:
    that:
      - shared_data_confirm | default(false) | bool
      - not ansible_check_mode
      - shared_data_holder_pod_uid | default('') | length > 0
      - shared_data_holder_pod_name | default('') | length > 0
- name: Read actual maintenance executor Pod
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    name: "{{ shared_data_holder_pod_name }}"
    namespace: "{{ shared_data_holder_pod_namespace }}"
  register: shared_data_executor_read
- name: Require immutable live standalone or Job-owned execution identity
  ansible.builtin.assert:
    that:
      - shared_data_executor_read.resources | length == 1
      - shared_data_executor_read.resources[0].metadata.uid == shared_data_holder_pod_uid
      - shared_data_executor_read.resources[0].status.phase == 'Running'
      - shared_data_executor_read.resources[0].metadata.deletionTimestamp is not defined
      - shared_data_executor_read.resources[0].metadata.ownerReferences | default([]) | rejectattr('kind', 'equalto', 'Job') | list | length == 0
    fail_msg: A live immutable standalone or Job-owned executor Pod is required.
- name: Read API authenticated projected-token identity
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: authentication.k8s.io/v1
      kind: SelfSubjectReview
      metadata:
        generateName: shared-data-executor-
  register: shared_data_executor_authenticated
- name: Read actual executor ServiceAccount and assigned node
  kubernetes.core.k8s_info:
    api_version: v1
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: "{{ item.namespace | default(omit) }}"
  loop:
    - {kind: ServiceAccount, namespace: "{{ shared_data_holder_pod_namespace }}", name: "{{ shared_data_executor_read.resources[0].spec.serviceAccountName }}"}
    - {kind: Node, name: "{{ shared_data_executor_read.resources[0].spec.nodeName }}"}
  register: shared_data_executor_bindings
- name: Require exact assigned executor identities
  ansible.builtin.assert:
    that: item.resources | length == 1
  loop: "{{ shared_data_executor_bindings.results }}"
- name: Capture authenticated original node identity before any ownership claim
  ansible.builtin.set_fact:
    shared_data_executor: >-
      {{ shared_data_executor_read.resources[0] | shared_data_executor_actor(
         shared_data_executor_bindings.results[1].resources[0],
         shared_data_executor_bindings.results[0].resources[0], shared_data_executor_authenticated.result) }}
