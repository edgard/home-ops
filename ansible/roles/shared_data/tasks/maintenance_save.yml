---
- name: Check journal writer ownership without reacquiring a released Lease
  ansible.builtin.include_tasks: maintenance_guard.yml
- name: Create the initial nonsecret journal before any target mutation
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ shared_data_journal_name | default('shared-data-operation') }}"
        namespace: "{{ shared_data_namespace | default('selfhosted') }}"
      data:
        journal.json: "{{ shared_data_journal | to_json }}"
  register: shared_data_journal_create
  when: shared_data_journal_resource_version | default('') | length == 0
- name: Publish only an exact resource-version journal transition
  kubernetes.core.k8s_json_patch:
    api_version: v1
    kind: ConfigMap
    name: "{{ shared_data_journal_name | default('shared-data-operation') }}"
    namespace: "{{ shared_data_namespace | default('selfhosted') }}"
    patch:
      - op: test
        path: /metadata/uid
        value: "{{ shared_data_journal_uid }}"
      - op: test
        path: /metadata/resourceVersion
        value: "{{ shared_data_journal_resource_version }}"
      - op: add
        path: /data/journal.json
        value: "{{ shared_data_journal | to_json }}"
  register: shared_data_journal_update
  when: shared_data_journal_resource_version | default('') | length > 0
- name: Track the newly published journal version for subsequent compare-and-swap writes
  ansible.builtin.set_fact:
    shared_data_journal_resource_version: "{{ (shared_data_journal_update.result if shared_data_journal_update is not skipped else shared_data_journal_create.result).metadata.resourceVersion }}"
    shared_data_journal_uid: "{{ (shared_data_journal_update.result if shared_data_journal_update is not skipped else shared_data_journal_create.result).metadata.uid }}"
- name: Read Lease before recording that a durable journal now exists
  kubernetes.core.k8s_info:
    api_version: coordination.k8s.io/v1
    kind: Lease
    name: "{{ shared_data_lease_name | default('shared-data-operation') }}"
    namespace: "{{ shared_data_namespace | default('selfhosted') }}"
  register: shared_data_journal_lease
- name: Mark journaled stage before allowing any target mutation
  kubernetes.core.k8s_json_patch:
    api_version: coordination.k8s.io/v1
    kind: Lease
    name: "{{ shared_data_lease_name | default('shared-data-operation') }}"
    namespace: "{{ shared_data_namespace | default('selfhosted') }}"
    patch: >-
      {{ shared_data_journal_lease.resources[0] | shared_data_lease_takeover(
         shared_data_operation_id ~ ':' ~ shared_data_holder_pod_uid,
         shared_data_operation_id, shared_data_operation_kind, shared_data_executor,
         '' | shared_data_now, shared_data_lease_duration | default(900), 'journaled') }}
