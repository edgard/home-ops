---
- name: Read journal without caller operation scope or filesystem dependencies
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    name: "{{ shared_data_journal_name | default('shared-data-operation') }}"
    namespace: "{{ shared_data_namespace | default('selfhosted') }}"
  register: shared_data_watchdog_read
- name: Read Lease even when the coordinator died before creating its journal
  kubernetes.core.k8s_info:
    api_version: coordination.k8s.io/v1
    kind: Lease
    name: "{{ shared_data_lease_name | default('shared-data-operation') }}"
    namespace: "{{ shared_data_namespace | default('selfhosted') }}"
  register: shared_data_watchdog_lease_read
- name: Decode durable watchdog state
  ansible.builtin.set_fact:
    shared_data_journal: "{{ (shared_data_watchdog_read.resources[0].data['journal.json'] | from_json) if shared_data_watchdog_read.resources | length else {} }}"
    shared_data_lease: "{{ shared_data_watchdog_lease_read.resources | first | default({}) }}"
- name: Freeze watchdog dispatch before recovery changes transaction facts
  ansible.builtin.set_fact:
    shared_data_watchdog_held: "{{ shared_data_lease.get('spec', {}).get('holderIdentity', '') | length > 0 }}"
    shared_data_watchdog_cleanup: "{{ shared_data_journal | length == 0 or shared_data_journal.phase == 'complete' }}"
    shared_data_watchdog_recover: "{{ shared_data_journal | length > 0 and shared_data_journal.phase != 'complete' }}"
- name: Handle confirmed held Lease without changing historical target snapshots
  when:
    - shared_data_confirm | default(false) | bool
    - not ansible_check_mode
    - shared_data_watchdog_held | bool
  block:
    - name: Clean only proven orphan or completed locks without target replay
      ansible.builtin.include_tasks: maintenance_cleanup.yml
      when: shared_data_watchdog_cleanup | bool
    - name: Recover an incomplete durable transaction
      when: shared_data_watchdog_recover | bool
      block:
        - name: Load exact operation identity and scope
          ansible.builtin.set_fact:
            shared_data_operation_id: "{{ shared_data_journal.operation_id }}"
            shared_data_operation_kind: "{{ shared_data_journal.operation_kind }}"
            shared_data_apps: "{{ shared_data_journal.apps }}"
        - name: Attempt backup-only fenced recovery under a distinct live owner
          ansible.builtin.include_tasks: maintenance_recover.yml
