---
- name: Renew existing operation ownership during each bounded quiescence poll
  ansible.builtin.include_tasks: maintenance_guard.yml
  when:
    - shared_data_journal is defined
    - shared_data_journal.operation_id | default('') == shared_data_operation_id
- name: Read Jobs at the beginning of this quiescence iteration
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
  register: shared_data_poll_jobs_before
- name: Read writer Pods in the same quiescence iteration
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
  register: shared_data_poll_pods
- name: Refresh Jobs after the Pod inventory to catch in-flight CronJob creation
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
  register: shared_data_poll_jobs_after
- name: Require both Job inventories and their Pod owners to be quiescent
  ansible.builtin.set_fact:
    shared_data_writers_idle: >-
      {{ shared_data_wait_targets | shared_data_writers_stopped(shared_data_poll_pods.resources,
         shared_data_poll_jobs_before.resources + shared_data_poll_jobs_after.resources,
         shared_data_holder_pod_uid | default('')) and
         (shared_data_poll_pods.resources | shared_data_operation_jobs_stopped(
         shared_data_poll_jobs_before.resources + shared_data_poll_jobs_after.resources,
         shared_data_holder_pod_uid | default(''), shared_data_namespace)) }}
- name: Delay only before a remaining quiescence retry
  ansible.builtin.pause:
    seconds: "{{ shared_data_wait_delay | default(5) | int }}"
  when:
    - not shared_data_writers_idle | bool
    - shared_data_writer_attempt | int < shared_data_wait_retries | default(60) | int
    - shared_data_wait_delay | default(5) | int > 0
