---
- name: Inspect Talos and Kubernetes upgrade plans
  kubernetes.core.k8s_info:
    api_version: tuppr.home-operations.com/v1alpha1
    kind: "{{ shared_data_upgrade_kind }}"
  loop:
    - TalosUpgrade
    - KubernetesUpgrade
  loop_control:
    loop_var: shared_data_upgrade_kind
  register: shared_data_upgrade_read
- name: Refuse active or unrecognized node upgrade state
  ansible.builtin.assert:
    that:
      - shared_data_upgrade_read.results | rejectattr('api_found', 'equalto', true) | list | length == 0
      - shared_data_upgrade_read.results | map(attribute='resources') | flatten | shared_data_upgrades_idle
    fail_msg: A node upgrade is active or its status is unknown; maintenance remains held for inspection.
- name: Inspect independent Tuppr upgrade and hook Jobs
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
  register: shared_data_upgrade_jobs
- name: Inspect upgrade Pods including children of stale or removed Jobs
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
  register: shared_data_upgrade_pods
- name: Reject upgrade workers that can survive controller termination
  ansible.builtin.assert:
    that: >-
      (shared_data_upgrade_read.results | map(attribute='resources') | flatten)
      | shared_data_upgrade_workers_idle(shared_data_upgrade_jobs.resources, shared_data_upgrade_pods.resources)
    fail_msg: A Tuppr upgrade Job or Pod remains active or restart-capable despite its CR phase; maintenance remains held.
