---
- name: Apply Talos configuration under the composed owner
  ansible.builtin.include_role:
    name: talos
    tasks_from: apply_execute
- name: Stop composed creation until accepted configuration is independently complete
  ansible.builtin.include_tasks: pending.yml
- name: Bootstrap Talos under the composed owner
  ansible.builtin.include_role:
    name: talos
    tasks_from: bootstrap_execute
- name: Bootstrap platform under the composed owner
  ansible.builtin.include_role:
    name: platform
    tasks_from: bootstrap_execute
