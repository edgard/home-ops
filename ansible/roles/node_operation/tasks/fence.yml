---
- name: Fence root before the generator and Tuppr Application
  ansible.builtin.include_tasks: target.yml
  loop: "{{ node_operation_journal.snapshots | rejectattr('role', 'equalto', 'tuppr') | list }}"
  loop_control:
    loop_var: node_operation_target
  vars:
    node_operation_target_mode: hold
- name: Freeze only idle original Applications after automation is disabled
  ansible.builtin.include_tasks: target.yml
  loop: "{{ node_operation_journal.snapshots | selectattr('role', 'in', ['root', 'application']) | list }}"
  loop_control:
    loop_var: node_operation_target
  vars:
    node_operation_target_mode: skip
- name: Stop the automatic upgrade controller under durable reconciliation fences
  ansible.builtin.include_tasks: target.yml
  loop: "{{ node_operation_journal.snapshots | selectattr('role', 'equalto', 'tuppr') | list }}"
  loop_control:
    loop_var: node_operation_target
  vars:
    node_operation_target_mode: hold
- name: Verify controller termination and all independent upgrade workers
  ansible.builtin.include_tasks: barrier.yml
