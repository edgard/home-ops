---
tofu_binary_path: "{{ lookup('env', 'TOFU_BINARY_PATH') | default(lookup('ansible.builtin.pipe', 'command -v tofu'), true) }}"
tofu_project_path: "{{ lookup('env', 'TERRAFORM_DIR') | default(repo_root + '/terraform', true) }}"
tofu_aws_access_key_id: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
tofu_aws_secret_access_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
tofu_clean_paths:
  - .terraform
  - .bw-provider-state
tofu_clean_file_patterns:
  - "*.tfplan"
  - "terraform.tfstate*"
tofu_cloudflare_api_token: "{{ lookup('env', 'TF_VAR_cloudflare_api_token') }}"
tofu_cloudflare_zone_id: "{{ lookup('env', 'TF_VAR_cloudflare_zone_id') }}"
tofu_tailscale_client_id: "{{ lookup('env', 'TF_VAR_tailscale_client_id') }}"
tofu_tailscale_client_secret: "{{ lookup('env', 'TF_VAR_tailscale_client_secret') }}"
