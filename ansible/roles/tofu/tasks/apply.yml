---
- name: Require Terraform credentials
  ansible.builtin.assert:
    that:
      - tofu_aws_access_key_id | length > 0
      - tofu_aws_secret_access_key | length > 0
      - tofu_cloudflare_api_token | length > 0
      - tofu_cloudflare_zone_id | length > 0
      - tofu_tailscale_client_id | length > 0
      - tofu_tailscale_client_secret | length > 0
    fail_msg: Run tf:apply through the scoped SecretSpec command.
  no_log: true

- name: Apply Terraform infrastructure
  community.general.terraform:
    project_path: "{{ tofu_project_path }}"
    binary_path: "{{ tofu_binary_path }}"
    state: present
    force_init: true
  environment:
    AWS_ACCESS_KEY_ID: "{{ tofu_aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ tofu_aws_secret_access_key }}"
    TF_VAR_cloudflare_api_token: "{{ tofu_cloudflare_api_token }}"
    TF_VAR_cloudflare_zone_id: "{{ tofu_cloudflare_zone_id }}"
    TF_VAR_tailscale_client_id: "{{ tofu_tailscale_client_id }}"
    TF_VAR_tailscale_client_secret: "{{ tofu_tailscale_client_secret }}"
  no_log: true
