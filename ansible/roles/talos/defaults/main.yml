---
talos_config_dir: "{{ lookup('env', 'TALOS_CONFIG_DIR') | default(home_dir + '/.talos', true) }}"
talos_config_path: "{{ lookup('env', 'TALOSCONFIG') | default(talos_config_dir + '/config', true) }}"
talos_controlplane_config_path: "{{ lookup('env', 'TALOS_CONTROLPLANE_CONFIG_PATH') | default(talos_config_dir + '/controlplane.yaml', true) }}"
talos_controlplane_patch_file: "{{ role_path }}/files/controlplane-patch.yaml"
talos_secrets_yaml: "{{ lookup('env', 'TALOS_SECRETS_YAML') }}"
talos_api_wait_retries: 30
talos_api_wait_delay: 5
talos_health_wait_timeout: 5m
talos_upgrade_test_mode: false

talos_upgrade:
  installer:
    repository: factory.talos.dev/metal-installer/135cb2840c3e39194d5d5d20ead2d6bdcade91a6c06eb5b8ad6939e1e1e55ddf
    # renovate: datasource=github-releases depName=siderolabs/talos
    version: v1.13.11
  upgrade:
    rebootMode: default
    timeout: 30m
