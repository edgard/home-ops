---
talos_config_dir: "{{ lookup('env', 'TALOS_CONFIG_DIR') | default(home_dir + '/.talos', true) }}"
talos_config_path: "{{ lookup('env', 'TALOSCONFIG') | default(talos_config_dir + '/config', true) }}"
talos_controlplane_config_path: "{{ lookup('env', 'TALOS_CONTROLPLANE_CONFIG_PATH') | default(talos_config_dir + '/controlplane.yaml', true) }}"
talos_controlplane_patch_file: "{{ role_path }}/files/controlplane-patch.yaml"
talos_secrets_yaml: "{{ lookup('env', 'TALOS_SECRETS_YAML') }}"
talos_api_wait_retries: 30
talos_api_wait_delay: 5
talos_health_wait_timeout: 5m
talos_install_serial: "{{ lookup('env', 'TALOS_INSTALL_SERIAL') }}"
talos_install_wwid: "{{ lookup('env', 'TALOS_INSTALL_WWID') }}"
talos_uplink_mac: "{{ lookup('env', 'TALOS_UPLINK_MAC') | lower }}"
talos_maintenance_node: "{{ lookup('env', 'TALOS_MAINTENANCE_NODE') }}"
talos_maintenance_fingerprint: "{{ lookup('env', 'TALOS_MAINTENANCE_FINGERPRINT') }}"
talos_destroy_confirm: "{{ lookup('env', 'TALOS_DESTROY_CONFIRM') }}"

talos_upgrade:
  installer:
    repository: factory.talos.dev/metal-installer/39699a54506a4570606671d813387abadbba0767ec91769b57e993f3387795d9
    # renovate: datasource=github-releases depName=siderolabs/talos
    version: v1.14.6
  upgrade:
    rebootMode: default
    timeout: 30m

talos_zfs_guard_file: "{{ role_path }}/files/zfs-import-guard.yaml"
talos_zfs_guard: "{{ lookup('ansible.builtin.file', talos_zfs_guard_file) | from_yaml }}"
talos_debug_image: "{{ lookup('env', 'DEBUG_IMAGE') }}"
talos_authenticated_client: "{{ ['talosctl', '--talosconfig', talos_config_path, '--endpoints', talos_node, '--nodes', talos_node] }}"
talos_zfs_release_guid: "{{ lookup('env', 'MIGRATION_POOL_GUID') }}"
talos_zfs_snapshot: "{{ lookup('env', 'MIGRATION_SNAPSHOT') }}"
talos_zfs_snapshot_guid: "{{ lookup('env', 'MIGRATION_SNAPSHOT_GUID') }}"
