---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/39699a54506a4570606671d813387abadbba0767ec91769b57e993f3387795d9:v1.14.7
---
apiVersion: v1alpha1
kind: KubeletConfig
extraArgs:
  rotate-server-certificates: true
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  node.kubernetes.io/exclude-from-external-load-balancers:
    $patch: delete
taints:
  node-role.kubernetes.io/control-plane:
    $patch: delete
---
apiVersion: v1alpha1
kind: KubeAdmissionControlConfig
name: PodSecurity
configuration:
  defaults:
    audit: privileged
    enforce: privileged
    warn: privileged
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: zfs
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  fs.inotify.max_user_instances: "8192"
  fs.inotify.max_user_watches: "1048576"
  net.core.rmem_max: "67108864"
  net.core.wmem_max: "67108864"
  net.ipv4.neigh.default.gc_thresh1: "4096"
  net.ipv4.neigh.default.gc_thresh2: "8192"
  net.ipv4.neigh.default.gc_thresh3: "16384"
  net.ipv4.tcp_fastopen: "3"
  user.max_user_namespaces: "11255"
---
apiVersion: v1alpha1
kind: SysfsConfig
params:
  # Ryzen 9 3900X exposes one CPUFreq policy per logical CPU.
  devices.system.cpu.cpufreq.policy0.energy_performance_preference: balance_power
  devices.system.cpu.cpufreq.policy1.energy_performance_preference: balance_power
  devices.system.cpu.cpufreq.policy2.energy_performance_preference: balance_power
  devices.system.cpu.cpufreq.policy3.energy_performance_preference: balance_power
  devices.system.cpu.cpufreq.policy4.energy_performance_preference: balance_power
  devices.system.cpu.cpufreq.policy5.energy_performance_preference: balance_power
  devices.system.cpu.cpufreq.policy6.energy_performance_preference: balance_power
  devices.system.cpu.cpufreq.policy7.energy_performance_preference: balance_power
  devices.system.cpu.cpufreq.policy8.energy_performance_preference: balance_power
  devices.system.cpu.cpufreq.policy9.energy_performance_preference: balance_power
  devices.system.cpu.cpufreq.policy10.energy_performance_preference: balance_power
  devices.system.cpu.cpufreq.policy11.energy_performance_preference: balance_power
  devices.system.cpu.cpufreq.policy12.energy_performance_preference: balance_power
  devices.system.cpu.cpufreq.policy13.energy_performance_preference: balance_power
  devices.system.cpu.cpufreq.policy14.energy_performance_preference: balance_power
  devices.system.cpu.cpufreq.policy15.energy_performance_preference: balance_power
  devices.system.cpu.cpufreq.policy16.energy_performance_preference: balance_power
  devices.system.cpu.cpufreq.policy17.energy_performance_preference: balance_power
  devices.system.cpu.cpufreq.policy18.energy_performance_preference: balance_power
  devices.system.cpu.cpufreq.policy19.energy_performance_preference: balance_power
  devices.system.cpu.cpufreq.policy20.energy_performance_preference: balance_power
  devices.system.cpu.cpufreq.policy21.energy_performance_preference: balance_power
  devices.system.cpu.cpufreq.policy22.energy_performance_preference: balance_power
  devices.system.cpu.cpufreq.policy23.energy_performance_preference: balance_power
---
version: v1alpha1
machine:
  features:
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles:
        - os:admin
      allowedKubernetesNamespaces:
        - platform-system
---
apiVersion: v1alpha1
kind: BridgeConfig
name: br0
hardwareAddr: "02:42:c0:a8:01:fd"
links:
  - uplink
stp:
  enabled: false
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: br0
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: homelab
auto:
  $patch: delete
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: openebs-keys
volumeType: directory
