---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/39699a54506a4570606671d813387abadbba0767ec91769b57e993f3387795d9:v1.14.6
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  node.kubernetes.io/exclude-from-external-load-balancers:
    $patch: delete
taints:
  node-role.kubernetes.io/control-plane:
    $patch: delete
---
apiVersion: v1alpha1
kind: KubeAdmissionControlConfig
name: PodSecurity
configuration:
  defaults:
    audit: privileged
    enforce: privileged
    warn: privileged
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: zfs
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  fs.inotify.max_user_instances: "8192"
  fs.inotify.max_user_watches: "1048576"
  net.core.rmem_max: "67108864"
  net.core.wmem_max: "67108864"
  net.ipv4.neigh.default.gc_thresh1: "4096"
  net.ipv4.neigh.default.gc_thresh2: "8192"
  net.ipv4.neigh.default.gc_thresh3: "16384"
  net.ipv4.tcp_fastopen: "3"
  user.max_user_namespaces: "11255"
---
version: v1alpha1
machine:
  features:
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles:
        - os:admin
      allowedKubernetesNamespaces:
        - platform-system
---
apiVersion: v1alpha1
kind: BridgeConfig
name: br0
hardwareAddr: "02:42:c0:a8:01:fd"
links:
  - uplink
stp:
  enabled: false
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: br0
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: homelab
auto:
  $patch: delete
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: openebs-keys
volumeType: directory
