---
- name: Read the Kubernetes version from the committed Tuppr upgrade
  ansible.builtin.import_tasks: validate_generation.yml
  vars:
    talos_validate_material: false

- name: Require the selected node and the repository Kubernetes target
  ansible.builtin.assert:
    that:
      - talos_node | length > 0
      - not k8s_version | default('') or k8s_version == talos_generation_targets.kubernetes
    fail_msg: Set TALOS_NODE. Any K8S_VERSION override must equal the committed KubernetesUpgrade version.

- name: Verify Kubernetes and Talos target the same physical node
  ansible.builtin.include_role:
    name: platform
    tasks_from: target

- name: Check Tuppr before starting the storage observer
  ansible.builtin.include_tasks: require_tuppr_pause.yml

- name: Verify the live datasets before upgrading
  ansible.builtin.include_role:
    name: platform
    tasks_from: storage_mounts

- name: Recheck Tuppr immediately before the manual upgrade
  ansible.builtin.include_tasks: require_tuppr_pause.yml

- name: Upgrade Kubernetes control plane
  when: not ansible_check_mode
  ansible.builtin.command:
    argv:
      - talosctl
      - --talosconfig
      - "{{ talos_config_path }}"
      - --endpoints
      - "{{ talos_node }}"
      - -n
      - "{{ talos_node }}"
      - upgrade-k8s
      - --to
      - "{{ talos_generation_targets.kubernetes }}"
  changed_when: true
