---
- name: Require Talos bootstrap variables
  ansible.builtin.assert:
    that:
      - talos_node | length > 0
      - talos_cluster_name | length > 0
    fail_msg: TALOS_NODE and TALOS_CLUSTER_NAME are required.

- name: Wait for Talos API
  when: not ansible_check_mode
  ansible.builtin.command:
    argv:
      - talosctl
      - --talosconfig
      - "{{ talos_config_path }}"
      - --endpoints
      - "{{ talos_node }}"
      - version
      - --nodes
      - "{{ talos_node }}"
  register: talos_bootstrap_api_wait
  until: talos_bootstrap_api_wait.rc == 0
  retries: "{{ talos_api_wait_retries }}"
  delay: "{{ talos_api_wait_delay }}"
  changed_when: false

- name: Verify physical hardware before bootstrapping etcd
  ansible.builtin.import_tasks: target.yml

- name: Read the local etcd member before requesting initialization
  when: not ansible_check_mode
  ansible.builtin.command:
    argv: "{{ talos_target_client + ['get', 'etcdmembers', '-o', 'yaml'] }}"
  register: talos_existing_etcd
  changed_when: false

- name: Initialize fresh etcd when Talos has no healthy local member
  when:
    - not ansible_check_mode
    - talos_existing_etcd.stdout | trim | length == 0
  ansible.builtin.command:
    argv: "{{ talos_target_client + ['bootstrap'] }}"
  register: talos_bootstrap_result
  # An earlier request can initialize storage before the healthy member resource appears.
  # The health and membership checks below must still succeed before issuing credentials.
  failed_when: >-
    talos_bootstrap_result.rc != 0 and
    'code = AlreadyExists desc = etcd data directory is not empty' not in talos_bootstrap_result.stderr
  changed_when: talos_bootstrap_result.rc == 0

- name: Wait for Talos health
  when: not ansible_check_mode
  ansible.builtin.command:
    argv:
      - talosctl
      - --talosconfig
      - "{{ talos_config_path }}"
      - --endpoints
      - "{{ talos_node }}"
      - health
      - --nodes
      - "{{ talos_node }}"
      - --wait-timeout
      - "{{ talos_health_wait_timeout }}"
  changed_when: false

- name: Read the healthy local etcd member ID from Talos
  when: not ansible_check_mode
  ansible.builtin.command:
    argv: "{{ talos_target_client + ['get', 'etcdmembers', 'local', '-o', 'yaml'] }}"
  register: talos_local_etcd
  changed_when: false

- name: Query the etcd membership through the authenticated physical node
  when: not ansible_check_mode
  ansible.builtin.command:
    argv: "{{ talos_target_client + ['etcd', 'members'] }}"
  register: talos_etcd_members
  changed_when: false

- name: Require exactly one voting member matching this physical control plane
  when: not ansible_check_mode
  vars:
    talos_member_id: "{{ (talos_local_etcd.stdout | from_yaml).spec.memberID }}"
    talos_member_row: "{{ talos_etcd_members.stdout_lines[-1].split() }}"
  ansible.builtin.assert:
    that:
      - talos_member_id is match('^[0-9a-f]{16}$') and talos_member_id != '0000000000000000'
      - talos_etcd_members.stdout_lines | length == 2
      - talos_member_row | length == 6
      - talos_member_row[:3] == [talos_node, talos_member_id, 'homelab']
      - "'https://' + talos_node + ':2380' in talos_member_row[3].split(',')"
      - "'https://' + talos_node + ':2379' in talos_member_row[4].split(',')"
      - talos_member_row[5] == 'false'
    fail_msg: Etcd must report one healthy voting homelab member on the verified physical address before kubeconfig is issued.

- name: Ensure kubeconfig parent exists
  when: not ansible_check_mode
  ansible.builtin.file:
    path: "{{ kubeconfig_path | dirname }}"
    state: directory
    mode: "0700"

- name: Fetch kubeconfig
  when: not ansible_check_mode
  ansible.builtin.command:
    argv:
      - talosctl
      - --talosconfig
      - "{{ talos_config_path }}"
      - --endpoints
      - "{{ talos_node }}"
      - kubeconfig
      - "{{ kubeconfig_path }}"
      - --nodes
      - "{{ talos_node }}"
      - --force-context-name
      - "{{ kube_context }}"
      - --force
  changed_when: true

- name: Restrict kubeconfig permissions
  when: not ansible_check_mode
  ansible.builtin.file:
    path: "{{ kubeconfig_path }}"
    mode: "0600"
