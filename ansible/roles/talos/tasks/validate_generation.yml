---
- name: Read repository upgrade targets and control plane patch
  ansible.builtin.set_fact:
    talos_generation_kubernetes: "{{ lookup('ansible.builtin.file', repo_root + '/apps/platform-system/tuppr/manifests/tuppr-kubernetes.kubernetesupgrade.yaml') | from_yaml }}"
    talos_generation_talos: "{{ lookup('ansible.builtin.file', repo_root + '/apps/platform-system/tuppr/manifests/tuppr-talos.talosupgrade.yaml') | from_yaml }}"
    talos_generation_install: >-
      {{ lookup('ansible.builtin.file', talos_controlplane_patch_file) | from_yaml_all
         | selectattr('kind', 'defined') | selectattr('kind', 'equalto', 'UnattendedInstallConfig') | first }}

- name: Record explicit repository generation targets
  ansible.builtin.set_fact:
    talos_generation_targets:
      talos: "{{ talos_generation_talos.spec.talos.version }}"
      installer: "{{ talos_generation_install.installer.image }}"
      kubernetes: "{{ talos_generation_kubernetes.spec.kubernetes.version }}"

- name: Require consistent repository installer and nonempty versions
  ansible.builtin.assert:
    that:
      - talos_generation_targets.talos | length > 0
      - talos_generation_targets.kubernetes | length > 0
      - talos_generation_targets.installer.endswith(':' ~ talos_generation_targets.talos)
    fail_msg: repository-generation-targets-invalid

- name: Require valid existing Talos identity without parser diagnostics
  ansible.builtin.assert:
    that: talos_secrets_yaml | valid_talos_material
    fail_msg: invalid-talos-material
  when: talos_validate_material | default(true) | bool
  no_log: true
