---
- name: Verify the selected SSD and explicit teardown confirmation
  ansible.builtin.import_tasks: destroy_target.yml

- name: Reset Talos node
  when: not ansible_check_mode
  ansible.builtin.command:
    argv:
      - talosctl
      - --talosconfig
      - "{{ talos_config_path }}"
      - --endpoints
      - "{{ talos_node }}"
      - reset
      - --nodes
      - "{{ talos_node }}"
      - --graceful=false
      - --wipe-mode=system-disk
      - --reboot
  changed_when: true
