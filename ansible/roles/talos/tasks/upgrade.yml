---
- name: Verify the selected physical node and operator Kubernetes context
  ansible.builtin.include_role:
    name: platform
    tasks_from: target

- name: Verify the live datasets before upgrading
  ansible.builtin.include_role:
    name: platform
    tasks_from: storage_mounts

- name: Drain the verified node and hold the cordon across reboot
  when: not ansible_check_mode
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubeconfig_path }}"
      - --context
      - "{{ kube_context }}"
      - drain
      - homelab
      - --ignore-daemonsets
      - --delete-emptydir-data
      - --timeout=5m
  changed_when: true

- name: Build Talos upgrade command
  ansible.builtin.set_fact:
    talos_upgrade_command:
      - talosctl
      - --talosconfig
      - "{{ talos_config_path }}"
      - --endpoints
      - "{{ talos_node }}"
      - --nodes
      - "{{ talos_node }}"
      - upgrade
      - --drain=false
      - --image
      - "{{ talos_upgrade.installer.repository }}:{{ talos_upgrade.installer.version }}"
      - --reboot-mode
      - "{{ talos_upgrade.upgrade.rebootMode | default('default') }}"
      - --timeout
      - "{{ talos_upgrade.upgrade.timeout | default('30m') }}"
      - --wait

- name: Upgrade Talos node
  when:
    - not ansible_check_mode
  ansible.builtin.command:
    argv: "{{ talos_upgrade_command }}"
  changed_when: true

- name: Read Talos server version
  when:
    - not ansible_check_mode
  ansible.builtin.command:
    argv:
      - talosctl
      - --talosconfig
      - "{{ talos_config_path }}"
      - --endpoints
      - "{{ talos_node }}"
      - --nodes
      - "{{ talos_node }}"
      - version
      - --json
  register: talos_upgrade_version
  changed_when: false

- name: Assert Talos server version
  when:
    - not ansible_check_mode
  ansible.builtin.assert:
    that:
      - (talos_upgrade_version.stdout | from_json).version.tag == talos_upgrade.installer.version
    fail_msg: "Talos server version mismatch; expected {{ talos_upgrade.installer.version }}."

- name: Verify the returned hardware and Kubernetes instance
  ansible.builtin.include_role:
    name: platform
    tasks_from: target

- name: Verify the same data returned before accepting workloads
  ansible.builtin.include_role:
    name: platform
    tasks_from: storage_mounts

- name: Uncordon the verified control plane
  when: not ansible_check_mode
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    context: "{{ kube_context }}"
    state: patched
    definition:
      apiVersion: v1
      kind: Node
      metadata:
        name: homelab
      spec:
        unschedulable: false
