---
- name: Read the storage identity recorded at foundation
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    context: "{{ kube_context }}"
    api_version: v1
    kind: ConfigMap
    namespace: kube-system
    name: storage-identity
  register: migration_identity

- name: Require a recorded physical pool identity
  ansible.builtin.assert:
    that:
      - migration_identity.resources | length == 1
      - migration_identity.resources[0].data['pool-guid'] is match('^[0-9]+$')
      - not migration_pool_guid or migration_pool_guid == migration_identity.resources[0].data['pool-guid']

- name: Inspect current host filesystems from a fresh pod
  block:
    - name: Start mount verification
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        context: "{{ kube_context }}"
        definition: "{{ lookup('template', 'mount-check.yml.j2') | from_yaml }}"
        state: present
      register: migration_mount_pod

    - name: Wait for the mount verifier to exit
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        context: "{{ kube_context }}"
        kind: Pod
        namespace: kube-system
        name: "{{ migration_mount_pod.result.metadata.name }}"
      register: migration_mount_result
      until: (migration_mount_result.resources | first).status.phase in ['Succeeded', 'Failed']
      retries: 60
      delay: 3

    - name: Require the expected GUID and ZFS mount sources
      ansible.builtin.assert:
        that: (migration_mount_result.resources | first).status.phase == 'Succeeded'
        fail_msg: Pool identity, health, or dataset mount verification failed.
  always:
    - name: Remove mount verifier
      when: migration_mount_pod.result.metadata.name is defined
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        context: "{{ kube_context }}"
        kind: Pod
        namespace: kube-system
        name: "{{ migration_mount_pod.result.metadata.name }}"
        state: absent
