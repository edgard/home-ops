---
- name: Identify the claim and held snapshot
  ansible.builtin.set_fact:
    migration_ns: "{{ migration_claim.metadata.namespace }}"
    migration_name: "{{ migration_claim.metadata.name }}"
    migration_annotations:
      home-ops.edgard.org/source-snapshot-guid: "{{ migration_snapshot_guid }}"
      home-ops.edgard.org/source-pool-guid: "{{ migration_identity.resources[0].data['pool-guid'] }}"

- name: Look up the destination claim
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    context: "{{ kube_context }}"
    api_version: v1
    kind: PersistentVolumeClaim
    namespace: "{{ migration_ns }}"
    name: "{{ migration_name }}"
  register: migration_existing

- name: Create a new destination for this source
  when: migration_seed and not migration_existing.resources
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    context: "{{ kube_context }}"
    definition: "{{ migration_claim | combine({'metadata': {'annotations': migration_annotations}}, recursive=true) }}"
    state: present

- name: Read destination identity
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    context: "{{ kube_context }}"
    api_version: v1
    kind: PersistentVolumeClaim
    namespace: "{{ migration_ns }}"
    name: "{{ migration_name }}"
  register: migration_destination

- name: Reject an absent or unrelated destination
  ansible.builtin.assert:
    that:
      - migration_destination.resources | length == 1
      - migration_annotations.items() | difference(migration_destination.resources[0].metadata.annotations.items()) | length == 0
      - migration_destination.resources[0].spec.storageClassName == 'zfs-appdata'
      - migration_destination.resources[0].spec.accessModes == ['ReadWriteOnce']
      - migration_destination.resources[0].metadata.deletionTimestamp is undefined

- name: Name the copy receipt after the destination UID
  ansible.builtin.set_fact:
    migration_uid: "{{ migration_destination.resources[0].metadata.uid }}"
    migration_job: "migration-copy-{{ migration_destination.resources[0].metadata.uid }}"

- name: Look up copy evidence
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    context: "{{ kube_context }}"
    api_version: batch/v1
    kind: Job
    namespace: "{{ migration_ns }}"
    name: "{{ migration_job }}"
  register: migration_previous_job

- name: Start one copy on a new, idle claim
  when: migration_seed and not migration_previous_job.resources
  block:
    - name: Find existing namespace consumers
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        context: "{{ kube_context }}"
        api_version: v1
        kind: Pod
        namespace: "{{ migration_ns }}"
      register: migration_pods

    - name: Require exclusive access to the destination
      ansible.builtin.assert:
        that: >-
          migration_name not in (item.spec.volumes | default([]) | selectattr('persistentVolumeClaim', 'defined')
          | map(attribute='persistentVolumeClaim.claimName') | list)
      loop: "{{ migration_pods.resources | rejectattr('status.phase', 'in', ['Succeeded', 'Failed']) }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Launch copy and checksum comparison
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        context: "{{ kube_context }}"
        definition: "{{ lookup('template', 'copy.yml.j2') | from_yaml }}"
        state: present

- name: Require completed copy evidence before releasing this claim
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    context: "{{ kube_context }}"
    api_version: batch/v1
    kind: Job
    namespace: "{{ migration_ns }}"
    name: "{{ migration_job }}"
  register: migration_receipt
  until: >-
    not migration_seed or (migration_receipt.resources and
    (migration_receipt.resources[0].status.conditions | default([]) | selectattr('status', 'equalto', 'True')
    | selectattr('type', 'in', ['Complete', 'Failed']) | list | length > 0))
  retries: 1440
  delay: 10

- name: Verify successful copy of the expected snapshot into this claim
  ansible.builtin.assert:
    that:
      - migration_receipt.resources | length == 1
      - migration_annotations.items() | difference(migration_receipt.resources[0].metadata.annotations.items()) | length == 0
      - migration_receipt.resources[0].spec.template.spec.volumes | selectattr('persistentVolumeClaim', 'defined') | map(attribute='persistentVolumeClaim.claimName') | list == [migration_name]
      - migration_receipt.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Complete') | selectattr('status', 'equalto', 'True') | list | length == 1
      - not migration_receipt.resources[0].status.active | default(0)

- name: Verify the retained backing volume
  ansible.builtin.include_tasks: binding.yml

- name: Compare the bound claim with the held snapshot again
  when: not migration_seed
  vars:
    migration_compare_only: true
  block:
    - name: Launch a fresh read-only comparison
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        context: "{{ kube_context }}"
        definition: "{{ lookup('template', 'copy.yml.j2') | from_yaml }}"
        state: present
      register: migration_comparison

    - name: Await this comparison
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        context: "{{ kube_context }}"
        api_version: batch/v1
        kind: Job
        namespace: "{{ migration_ns }}"
        name: "{{ migration_comparison.result.metadata.name }}"
      register: migration_compared
      until: >-
        migration_compared.resources and (migration_compared.resources[0].status.conditions | default([])
        | selectattr('status', 'equalto', 'True') | selectattr('type', 'in', ['Complete', 'Failed']) | list | length > 0)
      retries: 1440
      delay: 10

    - name: Require current contents and metadata to match the snapshot
      ansible.builtin.assert:
        that: >-
          migration_compared.resources[0].status.conditions | selectattr('type', 'equalto', 'Complete')
          | selectattr('status', 'equalto', 'True') | list | length == 1
        fail_msg: "Current contents or metadata differ, or the compare job failed for {{ migration_ns }}/{{ migration_name }}."
  always:
    - name: Remove the temporary read-only comparison
      when: migration_comparison.result.metadata.name is defined
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        context: "{{ kube_context }}"
        api_version: batch/v1
        kind: Job
        namespace: "{{ migration_ns }}"
        name: "{{ migration_comparison.result.metadata.name }}"
        state: absent
