---
- name: Find rendered routes
  ansible.builtin.find:
    paths: "{{ kubernetes_validation_rendered_root }}"
    recurse: true
    patterns: "*.yaml"
    file_type: file
  register: kubernetes_validation_rendered_files

- name: Find raw routes
  ansible.builtin.find:
    paths: "{{ kubernetes_validation_apps_root }}"
    recurse: true
    patterns: "*.httproute.yaml"
    file_type: file
  register: kubernetes_validation_raw_routes

- name: Read Gatus configuration
  ansible.builtin.set_fact:
    kubernetes_validation_gatus: "{{ lookup('ansible.builtin.file', kubernetes_validation_apps_root ~ '/platform-system/gatus/values.yaml') | from_yaml }}"
    kubernetes_validation_route_docs: []
    kubernetes_validation_actual_hosts: []

- name: Parse raw and rendered route documents
  ansible.builtin.set_fact:
    kubernetes_validation_route_docs: "{{ kubernetes_validation_route_docs + (lookup('ansible.builtin.file', item.path) | from_kubernetes_yaml_all) }}"
  loop: "{{ kubernetes_validation_rendered_files.files + kubernetes_validation_raw_routes.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Collect routed application hosts
  ansible.builtin.set_fact:
    kubernetes_validation_route_hosts: >-
      {{ kubernetes_validation_route_docs
         | selectattr('kind', 'defined')
         | selectattr('kind', 'equalto', 'HTTPRoute')
         | map(attribute='spec.hostnames')
         | flatten
         | list }}

- name: Collect Gatus HTTP targets
  ansible.builtin.set_fact:
    kubernetes_validation_actual_hosts: "{{ kubernetes_validation_actual_hosts + [item.url | urlsplit('hostname')] }}"
  loop: "{{ kubernetes_validation_gatus.config.endpoints }}"
  loop_control:
    label: "{{ item.url }}"
  when: item.url | urlsplit('scheme') in ['http', 'https']

- name: Create temporary route coverage inventory
  ansible.builtin.tempfile:
    state: file
    suffix: route-coverage.json
  register: kubernetes_validation_route_inventory

- name: Validate collected route coverage
  block:
    - name: Write route coverage policy inventory
      ansible.builtin.copy:
        dest: "{{ kubernetes_validation_route_inventory.path }}"
        mode: "0600"
        content: >-
          {{ {'route_coverage': {
               'route_hosts': kubernetes_validation_route_hosts,
               'excluded_hosts': kubernetes_validation_gatus.gateway.route.hosts | default([]),
               'http_hosts': kubernetes_validation_actual_hosts
             }} | to_json }}

    - name: Apply Gatus route coverage policy
      ansible.builtin.command:
        argv:
          - conftest
          - test
          - --no-color
          - --policy
          - "{{ kubernetes_validation_repo_root }}/policy/kubernetes"
          - "{{ kubernetes_validation_route_inventory.path }}"
      changed_when: false
  always:
    - name: Remove temporary route coverage inventory
      ansible.builtin.file:
        path: "{{ kubernetes_validation_route_inventory.path }}"
        state: absent
