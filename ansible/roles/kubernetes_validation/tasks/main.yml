---
- name: Read Kubernetes target version
  ansible.builtin.set_fact:
    kubernetes_validation_k8s_version: >-
      {{ (lookup('ansible.builtin.file', kubernetes_validation_apps_root ~ '/platform-system/tuppr/manifests/tuppr-kubernetes.kubernetesupgrade.yaml') | from_yaml).spec.kubernetes.version }}

- name: Require Kubernetes target version
  ansible.builtin.assert:
    that: kubernetes_validation_k8s_version | length > 0

- name: Find application directories
  ansible.builtin.find:
    paths: "{{ kubernetes_validation_apps_root }}"
    recurse: true
    depth: 2
    file_type: directory
  register: kubernetes_validation_found_app_dirs

- name: Find application source manifests
  ansible.builtin.find:
    paths: "{{ kubernetes_validation_apps_root }}"
    recurse: true
    patterns: "*.yaml"
    file_type: file
  register: kubernetes_validation_found_app_yaml

- name: Find Argo CD source manifests
  ansible.builtin.find:
    paths: "{{ kubernetes_validation_repo_root }}/argocd"
    recurse: true
    patterns: "*.yaml"
    file_type: file
  register: kubernetes_validation_found_argocd_yaml

- name: Build source path lists
  ansible.builtin.set_fact:
    kubernetes_validation_app_dirs: >-
      {{ kubernetes_validation_found_app_dirs.files | map(attribute='path')
         | select('match', '^' ~ kubernetes_validation_apps_root ~ '/[^/]+/[^/]+$') | sort | list }}
    kubernetes_validation_manifest_files: >-
      {{ (kubernetes_validation_found_app_yaml.files | map(attribute='path')
          | select('search', '/manifests/[^/]+\.yaml$') | list)
         + (kubernetes_validation_found_argocd_yaml.files | map(attribute='path') | list) | sort }}

- name: Require application discovery
  ansible.builtin.assert:
    that:
      - kubernetes_validation_app_dirs | length > 0
      - kubernetes_validation_manifest_files | length > 0
      - >-
        kubernetes_validation_manifest_files | select('search', '/apps/') | list | length
        == kubernetes_validation_found_app_yaml.files | selectattr('path', 'search', '/manifests/') | list | length

- name: Create temporary validation workspace
  ansible.builtin.tempfile:
    state: directory
    suffix: homeops-validation
  register: kubernetes_validation_workdir

- name: Validate repository
  block:
    - name: Build metadata and source policy inventory
      ansible.builtin.template:
        src: inventory.json.j2
        dest: "{{ kubernetes_validation_workdir.path }}/inventory.json"
        mode: "0600"

    - name: Validate metadata and source policies
      ansible.builtin.command:
        argv:
          - conftest
          - test
          - --no-color
          - --policy
          - "{{ kubernetes_validation_repo_root }}/policy/{{ item }}"
          - "{{ kubernetes_validation_workdir.path }}/inventory.json"
      loop:
        - metadata
        - source
      changed_when: false

    - name: Verify policy regression tests
      ansible.builtin.command:
        argv:
          - conftest
          - verify
          - --no-color
          - --policy
          - "{{ kubernetes_validation_repo_root }}/policy/{{ item }}"
      loop:
        - metadata
        - source
        - kubernetes
      changed_when: false

    - name: Set raw validation paths
      ansible.builtin.set_fact:
        kubernetes_validation_raw_paths: >-
          {{ ([kubernetes_validation_repo_root ~ '/argocd']
              + (kubernetes_validation_manifest_files | select('search', '/apps/') | map('dirname') | unique | list)) | sort }}
        kubernetes_validation_rendered_paths: []
        kubernetes_validation_helm_env:
          HELM_CONFIG_HOME: "{{ kubernetes_validation_workdir.path }}/helm/config"
          HELM_CACHE_HOME: "{{ kubernetes_validation_workdir.path }}/helm/cache"
          HELM_DATA_HOME: "{{ kubernetes_validation_workdir.path }}/helm/data"
          HELM_REPOSITORY_CONFIG: "{{ kubernetes_validation_workdir.path }}/helm/config/repositories.yaml"
          HELM_REPOSITORY_CACHE: "{{ kubernetes_validation_workdir.path }}/helm/cache/repository"
          HELM_REGISTRY_CONFIG: "{{ kubernetes_validation_workdir.path }}/helm/config/registry/config.json"
          HELM_CONTENT_CACHE: "{{ kubernetes_validation_workdir.path }}/helm/cache/content"

    - name: Create temporary tool directories
      ansible.builtin.file:
        path: "{{ kubernetes_validation_workdir.path }}/{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - helm/config/registry
        - helm/cache/content
        - helm/cache/repository
        - helm/data
        - charts
        - rendered
        - schemas

    - name: Validate raw manifest policy
      ansible.builtin.command:
        argv: "{{ ['conftest', 'test', '--no-color', '--policy', kubernetes_validation_repo_root ~ '/policy/kubernetes'] + kubernetes_validation_raw_paths }}"
      changed_when: false

    - name: Parse local Gateway API CRD schemas
      ansible.builtin.set_fact:
        kubernetes_validation_gateway_crds: >-
          {{ lookup('ansible.builtin.file', kubernetes_validation_apps_root ~ '/platform-system/gateway-api/manifests/gateway-api-crds.yaml')
             | from_yaml_all | selectattr('kind', 'defined')
             | selectattr('kind', 'equalto', 'CustomResourceDefinition') | list }}

    - name: Create local schema group directories
      ansible.builtin.file:
        path: "{{ kubernetes_validation_workdir.path }}/schemas/{{ item }}"
        state: directory
        mode: "0700"
      loop: "{{ kubernetes_validation_gateway_crds | map(attribute='spec.group') | unique | list }}"

    - name: Export served Gateway API schemas
      ansible.builtin.copy:
        dest: >-
          {{ kubernetes_validation_workdir.path }}/schemas/{{ item.0.spec.group }}/{{ item.0.spec.names.kind | lower }}_{{ item.1.name }}.json
        content: "{{ item.1.schema.openAPIV3Schema | to_json }}"
        mode: "0600"
      loop: "{{ kubernetes_validation_gateway_crds | subelements('spec.versions') }}"
      loop_control:
        label: "{{ item.0.metadata.name }} {{ item.1.name }}"
      when:
        - item.1.served | bool
        - item.1.schema.openAPIV3Schema is defined

    - name: Validate raw manifest schemas
      ansible.builtin.command:
        argv: >-
          {{ ['kubeconform', '-kubernetes-version', kubernetes_validation_k8s_version | regex_replace('^v', ''),
              '-schema-location', kubernetes_validation_workdir.path ~ '/schemas/' ~ '{' ~ '{' ~ '.Group' ~ '}' ~ '}' ~ '/' ~ '{' ~ '{' ~ '.ResourceKind' ~ '}' ~ '}' ~ '_' ~ '{' ~ '{' ~ '.ResourceAPIVersion' ~ '}' ~ '}' ~ '.json',
              '-schema-location', 'default',
              '-schema-location', kubernetes_validation_schema_catalog ~ '{' ~ '{' ~ '.Group' ~ '}' ~ '}' ~ '/' ~ '{' ~ '{' ~ '.ResourceKind' ~ '}' ~ '}' ~ '_' ~ '{' ~ '{' ~ '.ResourceAPIVersion' ~ '}' ~ '}' ~ '.json',
              '-skip', 'CustomResourceDefinition,renovate-operator.mogenius.com/v1alpha1/RenovateJob']
             + kubernetes_validation_raw_paths }}
      changed_when: false

    - name: Validate raw manifest deprecations
      ansible.builtin.command:
        argv:
          - pluto
          - detect-files
          - -d
          - "{{ item }}"
          - --target-versions
          - "k8s={{ kubernetes_validation_k8s_version }}"
          - -o
          - wide
      loop: "{{ kubernetes_validation_raw_paths }}"
      changed_when: false

    - name: Render all declared Helm applications
      ansible.builtin.include_tasks: render-app.yml
      loop: "{{ (lookup('ansible.builtin.file', kubernetes_validation_workdir.path ~ '/inventory.json') | from_json).apps }}"
      loop_control:
        loop_var: kubernetes_validation_app
        label: "{{ kubernetes_validation_app.category }}/{{ kubernetes_validation_app.app_name }}"
      when:
        - kubernetes_validation_app.has_app_file
        - kubernetes_validation_app.has_values_file

    - name: Validate Gatus route coverage
      ansible.builtin.include_tasks: check-uptime.yml
      vars:
        kubernetes_validation_rendered_root: "{{ kubernetes_validation_workdir.path }}/rendered"

    - name: Validate rendered manifest policy
      ansible.builtin.command:
        argv: "{{ ['conftest', 'test', '--no-color', '--parser', 'yaml', '--policy', kubernetes_validation_repo_root ~ '/policy/kubernetes'] + kubernetes_validation_rendered_paths }}"
      changed_when: false

    - name: Validate rendered manifest schemas
      ansible.builtin.command:
        argv: >-
          {{ ['kubeconform', '-kubernetes-version', kubernetes_validation_k8s_version | regex_replace('^v', ''),
              '-schema-location', kubernetes_validation_workdir.path ~ '/schemas/' ~ '{' ~ '{' ~ '.Group' ~ '}' ~ '}' ~ '/' ~ '{' ~ '{' ~ '.ResourceKind' ~ '}' ~ '}' ~ '_' ~ '{' ~ '{' ~ '.ResourceAPIVersion' ~ '}' ~ '}' ~ '.json',
              '-schema-location', 'default',
              '-schema-location', kubernetes_validation_schema_catalog ~ '{' ~ '{' ~ '.Group' ~ '}' ~ '}' ~ '/' ~ '{' ~ '{' ~ '.ResourceKind' ~ '}' ~ '}' ~ '_' ~ '{' ~ '{' ~ '.ResourceAPIVersion' ~ '}' ~ '}' ~ '.json',
              '-skip', 'CustomResourceDefinition']
             + kubernetes_validation_rendered_paths }}
      changed_when: false

    - name: Validate rendered manifest deprecations
      ansible.builtin.command:
        argv:
          - pluto
          - detect-files
          - -d
          - "{{ kubernetes_validation_workdir.path }}/rendered"
          - --target-versions
          - "k8s={{ kubernetes_validation_k8s_version }}"
          - -o
          - wide
      changed_when: false
  always:
    - name: Remove temporary validation workspace
      ansible.builtin.file:
        path: "{{ kubernetes_validation_workdir.path }}"
        state: absent
