---
- name: Verify repository policy regressions
  ansible.builtin.command:
    argv:
      - conftest
      - verify
      - --no-color
      - --policy
      - "{{ repository_validation_root }}/policy/repository"
  changed_when: false

- name: Create repository policy workspace
  ansible.builtin.tempfile:
    state: directory
    suffix: repository-policy
  register: repository_validation_workspace

- name: Evaluate repository configuration
  block:
    - name: Normalize tracked repository configuration
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ role_path }}/files/inventory.py"
          - "{{ repository_validation_root }}"
          - "{{ repository_validation_workspace.path }}/inventory.json"
      changed_when: false

    - name: Validate repository configuration policy
      ansible.builtin.command:
        argv:
          - conftest
          - test
          - --no-color
          - --policy
          - "{{ repository_validation_root }}/policy/repository"
          - "{{ repository_validation_workspace.path }}/inventory.json"
      changed_when: false
  always:
    - name: Remove repository policy workspace
      ansible.builtin.file:
        path: "{{ repository_validation_workspace.path }}"
        state: absent

- name: Verify protected credential and recovery artifacts are ignored
  ansible.builtin.command:
    argv: "{{ ['git', 'check-ignore', '--'] + repository_validation_artifacts }}"
    chdir: "{{ repository_validation_root }}"
  register: repository_validation_ignored
  changed_when: false
  failed_when: >-
    repository_validation_ignored.rc != 0 or
    repository_validation_ignored.stdout_lines | length != repository_validation_artifacts | length
  vars:
    repository_validation_artifacts:
      - ansible/roles/talos/files/secrets.yaml
      - .envrc.backup
      - .vault-password.backup
      - ansible/roles/talos/files/secrets.yaml.backup
      - terraform/crash.123.log
      - terraform/terraform.tfstate.backup
      - terraform/recovery.tfplan.backup

- name: Reject tracked credential artifacts
  ansible.builtin.command:
    argv:
      - git
      - ls-files
      - --
      - ansible/roles/talos/files/secrets.yaml
      - ansible/vault/operator.yml
      - ansible/roles/talos/files/secrets.vault.yml
    chdir: "{{ repository_validation_root }}"
  register: repository_validation_tracked
  changed_when: false
  failed_when: repository_validation_tracked.rc != 0 or repository_validation_tracked.stdout | length != 0
