---
- name: List immediate namespace children in the pinned snapshot
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ kubeconfig_path }}"
    context: "{{ kube_context }}"
    namespace: "{{ restic_restore_namespace }}"
    pod: "{{ restic_restore_servers.resources[0].metadata.name }}"
    container: app
    command: >-
      /tools/restic --no-lock ls --json {{ restic_restore_app_plan.snapshot.id }}
      {{ (restic_restore_snapshot_root + '/' + restic_restore_app_plan.namespace) | quote }}
  changed_when: false
  check_mode: false
  register: restic_restore_listing
  failed_when: restic_restore_listing.rc != 0

- name: Require every selected PVC directory in the pinned snapshot
  ansible.builtin.assert:
    that: restic_restore_app_plan.claims | map(attribute='path') | difference(restic_restore_directories) | length == 0
    fail_msg: "Snapshot {{ restic_restore_app_plan.snapshot.id }} is missing a selected claim directory for {{ restic_restore_app_plan.app }}."
  vars:
    restic_restore_directories: >-
      {{ restic_restore_listing.stdout_lines | map('from_json') | selectattr('type', 'defined')
         | selectattr('type', 'equalto', 'dir') | map(attribute='path') | list }}
