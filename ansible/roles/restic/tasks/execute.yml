---
- name: Read the application controller replica count
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    context: "{{ kube_context }}"
    api_version: apps/v1
    kind: StatefulSet
    namespace: "{{ restic_restore_argocd_namespace }}"
    name: "{{ restic_restore_controller }}"
  register: restic_restore_controller_info

- name: Require an active controller before entering maintenance
  ansible.builtin.assert:
    that:
      - restic_restore_controller_info.resources | length == 1
      - restic_restore_controller_info.resources[0].spec.replicas | int > 0

- name: Acquire exclusive restore lock and persist the recovery record
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubeconfig_path }}"
      - --context
      - "{{ kube_context }}"
      - create
      - -f
      - "-"
    stdin: "{{ restic_restore_lock | to_json }}"
  changed_when: true
  vars:
    restic_restore_lock:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: restic-restore-lock
        namespace: "{{ restic_restore_namespace }}"
      immutable: true
      data:
        plan.json: "{{ restic_restore_plan | to_json }}"
        cronjobs.json: "{{ restic_restore_cronjobs | to_json }}"
        controller-replicas: "{{ restic_restore_controller_info.resources[0].spec.replicas | string }}"

- name: Restore the selected claims while GitOps and scheduled consumers are paused
  block:
    - name: Pause Argo workload reconciliation
      kubernetes.core.k8s_scale:
        kubeconfig: "{{ kubeconfig_path }}"
        context: "{{ kube_context }}"
        api_version: apps/v1
        kind: StatefulSet
        namespace: "{{ restic_restore_argocd_namespace }}"
        name: "{{ restic_restore_controller }}"
        replicas: 0
        wait: true
        wait_timeout: 300

    - name: Suspend scheduled jobs that could observe partial data or prune a selected snapshot
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        context: "{{ kube_context }}"
        state: patched
        definition:
          apiVersion: batch/v1
          kind: CronJob
          metadata:
            name: "{{ item.name }}"
            namespace: "{{ item.namespace }}"
          spec:
            suspend: true
      loop: "{{ restic_restore_cronjobs }}"

    - name: Wait for existing jobs issued by the suspended schedulers to finish
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        context: "{{ kube_context }}"
        api_version: batch/v1
        kind: Job
        namespace: "{{ item.namespace }}"
      register: restic_restore_scheduled_jobs
      until: restic_restore_scheduled_jobs.resources | restic_unfinished_jobs(item.name) | length == 0
      retries: 240
      delay: 30
      loop: "{{ restic_restore_cronjobs }}"

    - name: Scale down selected applications
      ansible.builtin.include_tasks: execute_prepare_app.yml
      loop: "{{ restic_restore_plan }}"
      loop_control:
        loop_var: restic_restore_app_plan
        label: "{{ restic_restore_app_plan.app }}"

    - name: Require every selected claim to have zero running consumers
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        context: "{{ kube_context }}"
        api_version: v1
        kind: Pod
      register: restic_restore_consumers
      until: restic_restore_consumers.resources | restic_claim_consumers(restic_restore_plan, 'pod') | length == 0
      retries: 60
      delay: 5

    - name: Restore and verify each application
      ansible.builtin.include_tasks: execute_restore_app.yml
      loop: "{{ restic_restore_plan }}"
      loop_control:
        loop_var: restic_restore_app_plan
        label: "{{ restic_restore_app_plan.app }}"

    - name: Return applications to their original replica counts
      ansible.builtin.include_tasks: execute_resume_app.yml
      loop: "{{ restic_restore_plan }}"
      loop_control:
        loop_var: restic_restore_app_plan
        label: "{{ restic_restore_app_plan.app }}"

    - name: Return scheduled jobs to their previous state
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        context: "{{ kube_context }}"
        state: patched
        definition:
          apiVersion: batch/v1
          kind: CronJob
          metadata:
            name: "{{ item.name }}"
            namespace: "{{ item.namespace }}"
          spec:
            suspend: "{{ item.suspend }}"
      loop: "{{ restic_restore_cronjobs }}"

    - name: Resume Argo workload reconciliation
      kubernetes.core.k8s_scale:
        kubeconfig: "{{ kubeconfig_path }}"
        context: "{{ kube_context }}"
        api_version: apps/v1
        kind: StatefulSet
        namespace: "{{ restic_restore_argocd_namespace }}"
        name: "{{ restic_restore_controller }}"
        replicas: "{{ restic_restore_controller_info.resources[0].spec.replicas }}"
        wait: true
        wait_timeout: 300

    - name: Release the transaction lock
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        context: "{{ kube_context }}"
        api_version: v1
        kind: ConfigMap
        name: restic-restore-lock
        namespace: "{{ restic_restore_namespace }}"
        state: absent
  rescue:
    - name: Preserve the recovery record for manual inspection
      ansible.builtin.fail:
        msg: >-
          Restore stopped. Inspect Jobs named {{ restic_restore_job_name }}-<app> in the selected namespaces
          and {{ restic_restore_namespace }}/restic-restore-lock for pinned snapshot IDs, claims, workload replicas,
          controller replicas and CronJob states. Verify the data before resuming workloads or clearing the lock.
