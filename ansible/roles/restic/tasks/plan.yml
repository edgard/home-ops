---
- name: Validate requested restore selection
  ansible.builtin.assert:
    that:
      - restic_restore_mode in ["app", "all"]
      - restic_restore_mode == "all" or restic_restore_app | length > 0

- name: Read live restore inventory
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    context: "{{ kube_context }}"
    api_version: "{{ item.version }}"
    kind: "{{ item.kind }}"
    namespace: "{{ item.namespace | default(omit) }}"
  loop:
    - {version: argoproj.io/v1alpha1, kind: Application, namespace: "{{ restic_restore_argocd_namespace }}"}
    - {version: v1, kind: PersistentVolumeClaim}
    - {version: v1, kind: PersistentVolume}
    - {version: apps/v1, kind: Deployment}
    - {version: apps/v1, kind: StatefulSet}
    - {version: batch/v1, kind: CronJob}
  register: restic_restore_inventory

- name: Index live inventory by kind
  ansible.builtin.set_fact:
    restic_restore_objects: >-
      {{ dict(restic_restore_inventory.results | map(attribute='item.kind') |
              zip(restic_restore_inventory.results | map(attribute='resources'))) }}

- name: Read the repository snapshot catalog
  ansible.builtin.import_tasks: repository.yml

- name: Match Argo apps to concrete snapshot IDs and bound OpenEBS volumes
  ansible.builtin.set_fact:
    restic_restore_plan: >-
      {{ restic_restore_selected | restic_restore_bindings(
           restic_restore_objects.PersistentVolumeClaim, restic_restore_objects.PersistentVolume,
           restic_restore_objects.Deployment + restic_restore_objects.StatefulSet,
           restic_restore_snapshot_catalog.stdout | from_json, restic_restore_snapshot,
           restic_restore_snapshot_root, restic_restore_excluded_pvcs) }}
  vars:
    restic_restore_apps: "{{ restic_restore_objects.Application | rejectattr('metadata.name', 'in', restic_restore_excluded_apps) }}"
    restic_restore_selected: >-
      {{ restic_restore_apps | list if restic_restore_mode == 'all'
         else restic_restore_apps | selectattr('metadata.name', 'equalto', restic_restore_app) | list }}

- name: Require restorable appdata for the selected apps
  ansible.builtin.assert:
    that: restic_restore_plan | length > 0
    fail_msg: "No matching Argo Application with a restorable bound zfs-appdata claim. SparkyFitness requires native SQL recovery."

- name: Validate each snapshot tree before any workload or data changes
  ansible.builtin.include_tasks: plan_app.yml
  loop: "{{ restic_restore_plan }}"
  loop_control:
    loop_var: restic_restore_app_plan
    label: "{{ restic_restore_app_plan.app }}"

- name: Record CronJobs that back up the selected claims or prune the repository
  ansible.builtin.set_fact:
    restic_restore_cronjobs: "{{ restic_restore_objects.CronJob | restic_claim_consumers(restic_restore_plan, 'cronjob') }}"
