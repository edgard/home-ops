---
- name: Create a single-use restore job in the PVC namespace
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubeconfig_path }}"
      - --context
      - "{{ kube_context }}"
      - create
      - -f
      - "-"
    stdin: "{{ lookup('ansible.builtin.template', 'restore-job.yml.j2') }}"
  changed_when: true

- name: Wait for the restore job to complete or fail
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    context: "{{ kube_context }}"
    api_version: batch/v1
    kind: Job
    namespace: "{{ restic_restore_app_plan.namespace }}"
    name: "{{ restic_restore_job_name }}-{{ restic_restore_app_plan.app }}"
  register: restic_restore_job
  until: >-
    restic_restore_job.resources | length == 1 and
    restic_restore_job.resources[0].status.conditions | default([]) | selectattr('status', 'equalto', 'True') |
    selectattr('type', 'in', ['Complete', 'Failed']) | length > 0
  retries: 1440
  delay: 30

- name: Require verified restore success before resuming workloads
  ansible.builtin.assert:
    that: restic_restore_job.resources[0].status.succeeded | default(0) | int == 1

- name: Remove the completed restore job
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    context: "{{ kube_context }}"
    api_version: batch/v1
    kind: Job
    namespace: "{{ restic_restore_app_plan.namespace }}"
    name: "{{ restic_restore_job_name }}-{{ restic_restore_app_plan.app }}"
    state: absent
    wait: true
    wait_timeout: 120
