---
- name: Scale app workloads down
  kubernetes.core.k8s_scale:
    kubeconfig: "{{ kubeconfig_path }}"
    context: "{{ kube_context }}"
    api_version: apps/v1
    kind: "{{ item.kind }}"
    namespace: "{{ item.namespace }}"
    name: "{{ item.name }}"
    replicas: 0
    wait: true
    wait_timeout: 300
  loop: "{{ restic_restore_app_plan.workloads }}"
