---
- name: Run platform bootstrap preflight
  ansible.builtin.import_tasks: preflight.yml

- name: Refuse ordinary bootstrap before any chart mutation during unfinished cold recovery
  when: not platform_recovery_mode | bool
  block:
    - name: Read the cold journal before ordinary foundational work
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        context: "{{ kube_context }}"
        api_version: v1
        kind: ConfigMap
        namespace: "{{ platform_recovery_namespace }}"
        name: "{{ platform_recovery_journal_name }}"
      register: platform_normal_initial_cold_gate
    - name: Require absent or fully admitted cold state for ordinary bootstrap
      ansible.builtin.assert:
        that: (platform_normal_initial_cold_gate.resources[0].data['journal.json'] | from_json if platform_normal_initial_cold_gate.resources | length == 1 else {}) | cold_normal_bootstrap

- name: Dispatch cold bootstrap without performing local platform mutations
  ansible.builtin.include_tasks: recovery_dispatch.yml
  when: platform_recovery_mode | bool

- name: Execute the normal local bootstrap unchanged
  ansible.builtin.include_tasks: bootstrap_execute.yml
  when: not platform_recovery_mode | bool
