---
- name: Pin the storage identity before installing the CSI driver
  when: not platform_mount_identity.resources
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    context: "{{ kube_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: storage-identity
        namespace: kube-system
      immutable: true
      data:
        pool-guid: "{{ platform_verified_pool_guid | string }}"
        system-disk: "{{ talos_install_disk }}"
