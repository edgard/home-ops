---
- name: Require explicit authorization to start workloads
  ansible.builtin.assert:
    that: platform_handoff_confirm | bool
    fail_msg: Set PLATFORM_HANDOFF_CONFIRM=true only to release the verified storage to application workloads.

- name: Verify the merged repository and scoped credentials
  ansible.builtin.import_tasks: preflight.yml

- name: Verify the physical node and Kubernetes context
  ansible.builtin.import_tasks: target.yml

- name: Release the verified foundation while restores are excluded
  ansible.builtin.include_tasks: with_storage_lock.yml
  vars:
    platform_locked_task: start_gitops.yml
