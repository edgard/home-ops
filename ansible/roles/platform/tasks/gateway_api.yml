---
- name: Check whether Argo CD owns the gateway CRDs
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    context: "{{ kube_context }}"
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "{{ platform_gateway_crds_dir | basename }}"
    namespace: argocd
  register: platform_gateway_app
  until: >-
    not platform_gateway_app.resources or
    (platform_gateway_app.resources[0].status.resources | default([])
     | selectattr('kind', 'equalto', 'CustomResourceDefinition') | map(attribute='name') | list)
    is superset(['httproutes.gateway.networking.k8s.io', 'envoyproxies.gateway.envoyproxy.io'])
  retries: "{{ platform_wait_default_retries }}"
  delay: "{{ platform_wait_default_delay }}"

- name: Bootstrap gateway CRDs before Argo CD takes ownership
  ansible.builtin.include_tasks: install_gateway_crds.yml
  when: not platform_gateway_app.resources

- name: Wait for each gateway CRD to be established
  vars:
    platform_gateway_owned_crds: >-
      {{ platform_gateway_app.resources[0].status.resources | selectattr('kind', 'equalto', 'CustomResourceDefinition') | map(attribute='name') | list }}
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    context: "{{ kube_context }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ item }}"
    wait: true
    wait_condition:
      type: Established
      status: "True"
    hidden_fields:
      - metadata.managedFields
      - spec
  loop: "{{ platform_gateway_owned_crds if platform_gateway_app.resources else platform_gateway_install_crds }}"
  register: platform_gateway_crd
  failed_when: platform_gateway_crd is failed or platform_gateway_crd.resources | default([]) | length != 1

- name: Wait for discovery of the HTTPRoute API used by Argo CD
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    context: "{{ kube_context }}"
    api_version: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    namespace: argocd
  register: platform_gateway_routes
  until: platform_gateway_routes.api_found | default(false)
  retries: "{{ platform_wait_default_retries }}"
  delay: "{{ platform_wait_default_delay }}"
