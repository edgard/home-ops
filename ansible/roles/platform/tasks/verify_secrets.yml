---
- name: Record bounded application secret reconciliation deadline
  ansible.builtin.set_fact:
    platform_secret_stage: ClusterSecretStore/external-secrets-store
    platform_secret_deadline: "{{ now().timestamp() | float + platform_secret_reconcile_timeout | int }}"

- name: Require a bounded reconciliation timeout
  ansible.builtin.assert:
    that:
      - platform_secret_reconcile_timeout | int > 0
      - platform_secret_reconcile_timeout | int <= 600

- name: Verify fresh ExternalSecret reconciliation and target keys
  no_log: true
  block:
    - name: Wait for the application ClusterSecretStore
      timeout: 15
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        context: "{{ kube_context }}"
        api_version: external-secrets.io/v1
        kind: ClusterSecretStore
        name: external-secrets-store
      register: platform_secret_store_result
      failed_when: platform_secret_store_result.resources is not defined
      until: >-
        (platform_secret_store_result.resources | default([]) | length == 1 and
        platform_secret_store_result.resources[0].status.conditions | default([])
        | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list | length > 0)
        or now().timestamp() >= platform_secret_deadline | float
      retries: 120
      delay: 5

    - name: Require the application ClusterSecretStore
      ansible.builtin.assert:
        that:
          - platform_secret_store_result.resources | default([]) | length == 1
          - platform_secret_store_result.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list | length > 0

    - name: Verify every tracked application credential target
      ansible.builtin.include_tasks: verify_secret.yml
      loop: "{{ platform_secret_manifests }}"
      loop_control:
        loop_var: platform_secret_manifest
        label: "{{ platform_secret_manifest.metadata.namespace }}/{{ platform_secret_manifest.metadata.name }}"

    - name: Require reconciliation within deadline
      ansible.builtin.assert:
        that: now().timestamp() <= platform_secret_deadline | float
  rescue:
    - name: Reject stale or incomplete application secrets
      ansible.builtin.fail:
        msg: "Application secret reconciliation failed or timed out at {{ platform_secret_stage }}; fresh Ready status and all target keys are required."
      no_log: false
