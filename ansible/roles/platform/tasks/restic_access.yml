---
- name: Check for a GitOps owner under the storage lock
  ansible.builtin.import_tasks: read_root.yml

- name: Expose the recovery repository only on a writer-free foundation
  when: not platform_existing_root.resources
  block:
    - name: Check for orphaned applications and storage consumers
      ansible.builtin.import_tasks: writers_absent.yml

    - name: Start the private read-only server
      ansible.builtin.include_tasks: restic_server.yml
      vars:
        platform_restic_dir: "{{ repo_root }}/apps/selfhosted/restic"
