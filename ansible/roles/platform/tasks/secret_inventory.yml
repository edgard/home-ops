---
- name: List tracked application manifests
  timeout: 30
  ansible.builtin.command:
    argv:
      - git
      - ls-files
      - --
      - apps
    chdir: "{{ repo_root }}"
  register: platform_tracked_paths
  changed_when: false

- name: Reset application secret inventory
  ansible.builtin.set_fact:
    platform_secret_manifests: []
    platform_expected_applications: >-
      {{ platform_tracked_paths.stdout_lines | select('match', '^apps/[^/]+/[^/]+/app[.]yaml$')
         | map('dirname') | map('basename') | unique | list }}

- name: Read tracked ExternalSecret manifests
  ansible.builtin.set_fact:
    platform_secret_manifests: >-
      {{ platform_secret_manifests +
         (lookup('ansible.builtin.file', repo_root ~ '/' ~ item) | from_yaml_all | list
          | select('mapping') | selectattr('kind', 'defined') | selectattr('kind', 'equalto', 'ExternalSecret') | list) }}
  loop: "{{ platform_tracked_paths.stdout_lines | select('match', '^apps/[^/]+/[^/]+/manifests/[^/]+[.]yaml$') | list }}"

- name: Require application secret inventory
  ansible.builtin.assert:
    that:
      - platform_secret_manifests | length > 0
      - platform_expected_applications | length > 0
    fail_msg: Tracked application inventory is unavailable.
