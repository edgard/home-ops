---
- name: Require remaining reconciliation time
  ansible.builtin.assert:
    that: now().timestamp() < platform_secret_deadline | float

- name: Record application ExternalSecret verification stage
  ansible.builtin.set_fact:
    platform_secret_stage: "ExternalSecret/{{ platform_secret_manifest.metadata.namespace }}/{{ platform_secret_manifest.metadata.name }}"

- name: Wait for a fresh Ready application ExternalSecret
  timeout: 15
  no_log: true
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    context: "{{ kube_context }}"
    api_version: external-secrets.io/v1
    kind: ExternalSecret
    name: "{{ platform_secret_manifest.metadata.name }}"
    namespace: "{{ platform_secret_manifest.metadata.namespace }}"
  register: platform_secret_resource
  failed_when: platform_secret_resource.resources is not defined
  until: >-
    (platform_secret_resource.resources | default([]) | length == 1 and (platform_secret_resource.resources[0] | platform_secret_ready(platform_secret_after | float))) or now().timestamp() >= platform_secret_deadline | float
  retries: "{{ [1, ((platform_secret_deadline | float - now().timestamp()) / 5) | int] | max }}"
  delay: 5

- name: Require a fresh Ready application ExternalSecret within deadline
  ansible.builtin.assert:
    that:
      - now().timestamp() < platform_secret_deadline | float
      - platform_secret_resource.resources | default([]) | length == 1
      - platform_secret_resource.resources[0] | platform_secret_ready(platform_secret_after | float)
  no_log: true

- name: Record target Secret verification stage and expected keys
  ansible.builtin.set_fact:
    platform_secret_stage: "Secret/{{ platform_secret_manifest.metadata.namespace }}/{{ platform_secret_manifest.spec.target.name }}"
    platform_secret_expected_keys: >-
      {{ (platform_secret_manifest.spec.target.template.data | default({})).keys() | list
         or (platform_secret_manifest.spec.data | map(attribute='secretKey') | list) }}

- name: Wait for every expected key in the application target Secret
  timeout: 15
  no_log: true
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    context: "{{ kube_context }}"
    api_version: v1
    kind: Secret
    name: "{{ platform_secret_manifest.spec.target.name }}"
    namespace: "{{ platform_secret_manifest.metadata.namespace }}"
  register: platform_secret_target
  failed_when: platform_secret_target.resources is not defined
  until: >-
    (platform_secret_target.resources | default([]) | length == 1 and platform_secret_expected_keys | difference((platform_secret_target.resources[0].data | default({})).keys() | list) | length == 0) or now().timestamp() >= platform_secret_deadline | float
  retries: "{{ [1, ((platform_secret_deadline | float - now().timestamp()) / 5) | int] | max }}"
  delay: 5

- name: Require every target key within the reconciliation deadline
  ansible.builtin.assert:
    that:
      - now().timestamp() < platform_secret_deadline | float
      - platform_secret_target.resources | default([]) | length == 1
      - platform_secret_expected_keys | difference((platform_secret_target.resources[0].data | default({})).keys() | list) | length == 0
  no_log: true
