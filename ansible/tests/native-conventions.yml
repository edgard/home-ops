---
- name: Validate Ansible configuration and bounded OpenTofu cleanup
  hosts: localhost
  gather_facts: false
  vars:
    conventions_repo_root: "{{ playbook_dir }}/../.."
    conventions_generated_files:
      - saved.tfplan
      - terraform.tfstate
      - terraform.tfstate.backup
      - .terraform.lock.hcl
      - .bw-provider-state
      - .terraform/provider-cache
    conventions_preserved_files:
      - main.tf
      - local.tfvars
      - notes.txt
      - nested/saved.tfplan
      - nested/terraform.tfstate
  tasks:
    - name: Check local runtime directories are ignored
      ansible.builtin.command:
        argv:
          - git
          - check-ignore
          - -q
          - "{{ item }}"
      args:
        chdir: "{{ conventions_repo_root }}"
      loop:
        - .venv
        - .ansible
      changed_when: false

    - name: Load OpenTofu role defaults
      ansible.builtin.include_vars:
        file: "{{ conventions_repo_root }}/ansible/roles/tofu/defaults/main.yml"

    - name: Check resolved OpenTofu executable
      ansible.builtin.stat:
        path: "{{ tofu_binary_path }}"
      register: conventions_tofu_binary

    - name: Assert OpenTofu executable resolves
      ansible.builtin.assert:
        that:
          - tofu_binary_path is match('^/')
          - conventions_tofu_binary.stat.executable

    - name: Create isolated OpenTofu cleanup fixture
      ansible.builtin.tempfile:
        state: directory
        suffix: tofu-clean-contract
      register: conventions_tofu_fixture

    - name: Exercise real cleanup tasks on disposable files
      block:
        - name: Create fixture subdirectories
          ansible.builtin.file:
            path: "{{ conventions_tofu_fixture.path }}/{{ item }}"
            state: directory
            mode: "0700"
          loop:
            - .terraform
            - nested

        - name: Create generated and preserved fixture files
          ansible.builtin.copy:
            content: fixture
            dest: "{{ conventions_tofu_fixture.path }}/{{ item }}"
            mode: "0600"
          loop: "{{ conventions_generated_files + conventions_preserved_files }}"

        - name: Preview real cleanup in check mode
          ansible.builtin.include_tasks:
            file: ../roles/tofu/tasks/clean.yml
            apply:
              check_mode: true
          vars:
            tofu_project_path: "{{ conventions_tofu_fixture.path }}"

        - name: Inspect files after check mode
          ansible.builtin.stat:
            path: "{{ conventions_tofu_fixture.path }}/{{ item }}"
          loop: "{{ conventions_generated_files + conventions_preserved_files }}"
          register: conventions_check_files

        - name: Assert check mode preserved every file
          ansible.builtin.assert:
            that: item.stat.exists
          loop: "{{ conventions_check_files.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Execute real cleanup
          ansible.builtin.include_tasks: ../roles/tofu/tasks/clean.yml
          vars:
            tofu_project_path: "{{ conventions_tofu_fixture.path }}"

        - name: Inspect files after cleanup
          ansible.builtin.stat:
            path: "{{ conventions_tofu_fixture.path }}/{{ item }}"
          loop: "{{ conventions_generated_files + conventions_preserved_files }}"
          register: conventions_clean_files

        - name: Assert only generated top-level artifacts were removed
          ansible.builtin.assert:
            that: item.stat.exists == (item.item in conventions_preserved_files)
          loop: "{{ conventions_clean_files.results }}"
          loop_control:
            label: "{{ item.item }}"
      always:
        - name: Remove cleanup fixture
          ansible.builtin.file:
            path: "{{ conventions_tofu_fixture.path }}"
            state: absent
