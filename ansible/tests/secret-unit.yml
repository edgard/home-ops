---
- name: Validate secret adapters and isolated role behavior
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Exercise Python adapter and role integration fixtures
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - -m
          - unittest
          - discover
          - -s
          - "{{ repo_root }}/ansible/tests/unit"
          - -v
        chdir: "{{ repo_root }}"
      changed_when: false
