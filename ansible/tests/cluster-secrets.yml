---
- name: Validate native cluster transactions and safe diagnostics
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Capture isolated provider and Kubernetes API fixtures
      ansible.builtin.command:
        argv:
          - "{{ repo_root }}/.venv/bin/ansible-playbook"
          - "{{ repo_root }}/ansible/tests/fixtures/cluster-secrets.yml"
        chdir: "{{ repo_root }}"
      register: cluster_transaction_fixture
      changed_when: false
      failed_when: false
      no_log: true

    - name: Require transaction, rollback and output-redaction regressions to pass
      ansible.builtin.assert:
        that:
          - cluster_transaction_fixture.rc == 0
          - "'SYNTHETIC-PRIVATE-API-DIAGNOSTIC' not in cluster_transaction_fixture.stdout ~ cluster_transaction_fixture.stderr"
          - "'SYNTHETIC-PRIVATE-PROVIDER-DIAGNOSTIC' not in cluster_transaction_fixture.stdout ~ cluster_transaction_fixture.stderr"
        fail_msg: Native cluster transaction or safe diagnostic fixtures failed.
