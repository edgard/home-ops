---
- name: Validate Talos upgrade command construction
  hosts: localhost
  gather_facts: false
  vars:
    talos_upgrade_repo_root: "{{ playbook_dir }}/../.."
    talos_upgrade_test_mode: true
    talos_node: 192.0.2.10

  tasks:
    - name: Load default Talos upgrade vars
      ansible.builtin.include_vars:
        file: "{{ talos_upgrade_repo_root }}/ansible/roles/talos/defaults/main.yml"
        name: talos_upgrade_defaults

    - name: Read Talos control plane patch
      ansible.builtin.slurp:
        src: "{{ talos_upgrade_repo_root }}/ansible/roles/talos/files/controlplane-patch.yaml"
      register: talos_upgrade_controlplane_patch

    - name: Parse Talos control plane patch
      ansible.builtin.set_fact:
        talos_upgrade_controlplane_config: "{{ (talos_upgrade_controlplane_patch.content | b64decode | from_yaml_all | list | first) }}"

    - name: Build Talos upgrade command with repository defaults
      ansible.builtin.include_role:
        name: talos
        tasks_from: upgrade

    - name: Preserve the configured Image Factory installer during upgrades
      ansible.builtin.assert:
        that:
          - talos_upgrade_command[talos_upgrade_command.index('--image') + 1] == talos_upgrade_controlplane_config.machine.install.image
        fail_msg: "Talos upgrades must use the installer image from the control plane patch."
