---
- name: Validate native cluster secret workflow contracts
  hosts: localhost
  gather_facts: false
  vars:
    cluster_contract_root: "{{ inventory_dir | dirname | dirname }}"
    repo_root: "{{ cluster_contract_root }}"
  tasks:
    - name: Load pure secret-delivery predicates without credential resolution
      ansible.builtin.import_role:
        name: operator_secrets
        tasks_from: validate
      when: false

    - name: Test fresh secret and committed handoff predicates with synthetic resources
      ansible.builtin.assert:
        that:
          - cluster_fixture_root | platform_root_ready('merged-head')
          - not (cluster_fixture_root | platform_root_ready('old-head'))
          - "not (cluster_fixture_root | combine({'spec': {'sources': [{}]}}) | platform_root_ready('merged-head'))"
          - "not (cluster_fixture_root | combine({'status': {'sync': {'status': 'OutOfSync', 'revisions': ['merged-head', 'merged-head']}}}) | platform_root_ready('merged-head'))"
          - cluster_fixture_secret | platform_secret_ready(1791676800)
          - not (cluster_fixture_secret | platform_secret_ready(1791676801))
          - "not ({'status': {'refreshTime': 'bad', 'conditions': [{'type': 'Ready', 'status': 'True'}]}} | platform_secret_ready(0))"
          - "not ({'status': {'refreshTime': '2026-10-11T00:00:00Z', 'conditions': [{'type': 'Ready', 'status': 'False'}]}} | platform_secret_ready(0))"
          - "not ({} | platform_secret_ready(0))"
          - cluster_fixture_apps | platform_owned_applications('expected-owner') == ['owned']
      vars:
        cluster_fixture_root:
          spec:
            sources:
              - {}
              - {}
          status:
            sync:
              status: Synced
              revisions:
                - merged-head
                - merged-head
        cluster_fixture_secret:
          status:
            conditions:
              - {type: Ready, status: "True"}
            refreshTime: "2026-10-11T00:00:00.123456Z"
        cluster_fixture_apps:
          - metadata:
              name: owned
              ownerReferences:
                - {uid: expected-owner}
          - metadata:
              name: impostor
              ownerReferences:
                - {uid: wrong-owner}
          - metadata:
              name: unowned

    - name: Load native secret workflow task documents
      ansible.builtin.set_fact:
        cluster_contract_access: "{{ lookup('file', cluster_contract_root ~ '/ansible/roles/platform/tasks/application_access.yml') | from_yaml }}"
        cluster_contract_preflight: "{{ lookup('file', cluster_contract_root ~ '/ansible/roles/platform/tasks/preflight.yml') | from_yaml }}"
        cluster_contract_rotation: "{{ lookup('file', cluster_contract_root ~ '/ansible/roles/platform/tasks/sync_token.yml') | from_yaml }}"
        cluster_contract_handoff: "{{ lookup('file', cluster_contract_root ~ '/ansible/roles/platform/tasks/handoff.yml') | from_yaml }}"
        cluster_contract_reconcile: "{{ lookup('file', cluster_contract_root ~ '/ansible/roles/platform/tasks/verify_secrets.yml') | from_yaml }}"

    - name: Validate token access and rollback boundaries
      ansible.builtin.assert:
        that:
          - cluster_contract_access[0].no_log | bool
          - cluster_contract_access[0].rescue[-1]['ansible.builtin.fail'].msg == 'Application credential validation failed.'
          - cluster_contract_rotation[0]['ansible.builtin.include_tasks'] == 'application_access.yml'
          - cluster_contract_rotation[1].no_log | bool
          - cluster_contract_rotation[1].block[-1].block[0]['kubernetes.core.k8s'].definition.stringData.keys() | list == ['token']
          - cluster_contract_rotation[1].block[-1].rescue[0].block[0]['kubernetes.core.k8s'].definition.data.keys() | list == ['token']
          - cluster_contract_rotation[1].block[-1].rescue[1]['ansible.builtin.fail'].msg == 'ESO token reconciliation failed; previous token restored.'
          - cluster_contract_rotation[1].block[-1].rescue[0].rescue[-1]['ansible.builtin.fail'].msg == 'ESO token reconciliation failed; previous token restoration failed.'
          - cluster_contract_preflight[-1]['ansible.builtin.set_fact'].platform_bootstrap_revision is defined
          - cluster_contract_handoff[0]['ansible.builtin.set_fact'].platform_handoff_deadline is search('300')
          - cluster_contract_reconcile[0]['ansible.builtin.set_fact'].platform_secret_deadline is search('600')

    - name: Build synthetic application key inventory from tracked manifests
      ansible.builtin.include_role:
        name: platform
        tasks_from: secret_inventory

    - name: Create isolated read-only provider fixture
      ansible.builtin.tempfile:
        state: directory
        suffix: native-secret-fixture
      register: cluster_fixture_dir

    - name: Exercise native application credential validation with fixture provider
      environment:
        PATH: "{{ cluster_fixture_dir.path }}:{{ lookup('env', 'PATH') }}"
      vars:
        repo_root: "{{ cluster_contract_root }}"
        platform_bitwarden_access_token: synthetic-read-only-token
        cluster_fixture_projects: >-
          {{ (lookup('file', cluster_contract_root ~ '/secretspec.toml') | from_toml).providers.values()
             | map(attribute='uri') | map('urlsplit', 'netloc') | list }}
        cluster_fixture_keys: >-
          {{ platform_secret_manifests | map(attribute='spec.data') | flatten
             | map(attribute='remoteRef.key') | unique | list }}
      block:
        - name: Write exact read-only fixture BWS adapter
          ansible.builtin.copy:
            dest: "{{ cluster_fixture_dir.path }}/bws"
            mode: "0700"
            content: |
              #!{{ ansible_python_interpreter }}
              import pathlib, sys
              base = pathlib.Path(__file__).parent
              args = sys.argv[1:]
              if args == ['--color', 'no', '--server-url', 'https://vault.bitwarden.com', 'project', 'list', '--output', 'json']:
                  print((base / 'projects.json').read_text())
              elif len(args) == 9 and args[:6] == ['--color', 'no', '--server-url', 'https://vault.bitwarden.com', 'secret', 'list'] and args[7:] == ['--output', 'json']:
                  print((base / 'secrets.json').read_text())
              else:
                  sys.exit(92)

        - name: Record synthetic provider projects and values
          ansible.builtin.set_fact:
            cluster_fixture_project_rows: []
            cluster_fixture_value_rows: []

        - name: Build synthetic project response
          ansible.builtin.set_fact:
            cluster_fixture_project_rows: "{{ cluster_fixture_project_rows + [{'id': item}] }}"
          loop: "{{ cluster_fixture_projects }}"

        - name: Build synthetic secret response
          ansible.builtin.set_fact:
            cluster_fixture_value_rows: "{{ cluster_fixture_value_rows + [{'id': item, 'key': item, 'value': 'synthetic-fixture-value'}] }}"
          loop: "{{ cluster_fixture_keys }}"

        - name: Write synthetic provider responses
          ansible.builtin.copy:
            dest: "{{ cluster_fixture_dir.path }}/{{ item.name }}.json"
            content: "{{ item.value | to_json }}"
            mode: "0600"
          loop:
            - name: projects
              value: "{{ cluster_fixture_project_rows }}"
            - name: secrets
              value: "{{ cluster_fixture_value_rows }}"

        - name: Accept exact project access and complete application keys
          ansible.builtin.include_role:
            name: platform
            tasks_from: application_access

        - name: Build synthetic target Secret keys
          ansible.builtin.set_fact:
            cluster_fixture_target_keys: >-
              {{ dict((platform_secret_manifests | map(attribute='spec.data') | flatten | map(attribute='secretKey') | list
                       + platform_secret_manifests | map(attribute='spec.target.template.data', default={}) | map('dict2items') | flatten | map(attribute='key') | list)
                      | zip(['c3ludGhldGlj'] * 1000)) }}

        - name: Start isolated Kubernetes HTTP fixture
          ansible.builtin.command:
            argv:
              - "{{ ansible_python_interpreter }}"
              - "{{ playbook_dir }}/cluster_api.py"
              - "{{ cluster_fixture_dir.path }}"
          async: 240
          poll: 0
          changed_when: false
          register: cluster_fixture_api_job

        - name: Wait for local Kubernetes fixture listener
          ansible.builtin.stat:
            path: "{{ cluster_fixture_dir.path }}/api-port"
          register: cluster_fixture_api_port
          until: cluster_fixture_api_port.stat.exists
          retries: 10
          delay: 1

        - name: Write isolated unauthenticated loopback kubeconfig
          ansible.builtin.copy:
            dest: "{{ cluster_fixture_dir.path }}/kubeconfig"
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
                - name: fixture
                  cluster:
                    server: http://127.0.0.1:{{ lookup('file', cluster_fixture_dir.path ~ '/api-port') }}
              contexts:
                - name: fixture
                  context:
                    cluster: fixture
                    user: fixture
              users:
                - name: fixture
                  user: {}
              current-context: fixture

        - name: Exercise native token transaction against the local Kubernetes API
          ansible.builtin.include_tasks: cluster-token-case.yml
          loop:
            - {name: success, timeout: 120, rejected: false, patches: ["c3ludGhldGljLXJlYWQtb25seS10b2tlbg=="]}
            - {name: ambiguous-patch, timeout: 1, rejected: true, patches: ["c3ludGhldGljLXJlYWQtb25seS10b2tlbg==", "c3ludGhldGljLXByZXZpb3VzLXRva2Vu"]}
            - {name: reconciliation-failure, timeout: 1, rejected: true, patches: ["c3ludGhldGljLXJlYWQtb25seS10b2tlbg==", "c3ludGhldGljLXByZXZpb3VzLXRva2Vu"]}
            - {name: missing-previous-token, timeout: 1, rejected: true, patches: []}
            - {name: malformed-previous-token, timeout: 1, rejected: true, patches: []}
            - {name: previous-read-failure, timeout: 1, rejected: true, patches: []}
            - {name: store-read-failure, timeout: 1, rejected: true, patches: ["c3ludGhldGljLXJlYWQtb25seS10b2tlbg==", "c3ludGhldGljLXByZXZpb3VzLXRva2Vu"]}
            - {name: es-read-failure, timeout: 3, rejected: true, patches: ["c3ludGhldGljLXJlYWQtb25seS10b2tlbg==", "c3ludGhldGljLXByZXZpb3VzLXRva2Vu"]}
            - {name: target-read-failure, timeout: 3, rejected: true, patches: ["c3ludGhldGljLXJlYWQtb25seS10b2tlbg==", "c3ludGhldGljLXByZXZpb3VzLXRva2Vu"]}
            - {name: restore-failure, timeout: 1, rejected: true, patches: ["c3ludGhldGljLXJlYWQtb25seS10b2tlbg==", "c3ludGhldGljLXByZXZpb3VzLXRva2Vu"]}
            - {name: invalid-provider-access, timeout: 1, rejected: true, patches: []}
          loop_control:
            loop_var: cluster_token_case
            label: "{{ cluster_token_case.name }}"
          vars:
            kubeconfig_path: "{{ cluster_fixture_dir.path }}/kubeconfig"
            kube_context: fixture
            platform_secret_reconcile_timeout: "{{ cluster_token_case.timeout }}"

        - name: Limit handoff fixture to one synthetic credential target
          ansible.builtin.set_fact:
            platform_secret_manifests: "{{ platform_secret_manifests[:1] }}"

        - name: Exercise final native GitOps handoff snapshots
          ansible.builtin.include_tasks: cluster-handoff-case.yml
          loop:
            - {name: handoff-success, rejected: false}
            - {name: root-advanced, rejected: true}
            - {name: appset-recreated, rejected: true}
          loop_control:
            loop_var: cluster_handoff_case
            label: "{{ cluster_handoff_case.name }}"
          vars:
            kubeconfig_path: "{{ cluster_fixture_dir.path }}/kubeconfig"
            kube_context: fixture
            platform_bootstrap_revision: synthetic-merged-head
            platform_handoff_timeout: 120
            platform_secret_reconcile_timeout: 120

        - name: Exercise malformed provider and access mismatch failures
          ansible.builtin.include_tasks: cluster-access-case.yml
          loop:
            - {name: extra-project, file: projects, value: "{{ cluster_fixture_project_rows + [{'id': 'extra-project'}] }}"}
            - {name: missing-project, file: projects, value: "{{ cluster_fixture_project_rows[:1] }}"}
            - {name: malformed-projects, file: projects, value: {unexpected: object}}
            - {name: invalid-project-json, file: projects, value: null, raw: SYNTHETIC-PRIVATE-PROVIDER-DIAGNOSTIC}
            - {name: invalid-secret-json, file: secrets, value: null, raw: SYNTHETIC-PRIVATE-PROVIDER-DIAGNOSTIC}
            - {name: malformed-secret-shape, file: secrets, value: {unexpected: object}}
            - {name: duplicate-keys, file: secrets, value: "{{ cluster_fixture_value_rows + [cluster_fixture_value_rows[0]] }}"}
            - {name: missing-application-key, file: secrets, value: "{{ cluster_fixture_value_rows[1:] }}"}
            - {name: missing-repo-credential, file: secrets, value: "{{ cluster_fixture_value_rows | rejectattr('key', 'equalto', 'argocd_repo_password') | list }}"}
          loop_control:
            loop_var: cluster_access_case
            label: "{{ cluster_access_case.name }}"
      always:
        - name: Stop isolated Kubernetes HTTP fixture
          ansible.builtin.copy:
            dest: "{{ cluster_fixture_dir.path }}/api-stop"
            content: stop
            mode: "0600"

        - name: Wait for fixture server cleanup
          ansible.builtin.async_status:
            jid: "{{ cluster_fixture_api_job.ansible_job_id }}"
          register: cluster_fixture_api_finished
          until: cluster_fixture_api_finished.finished
          retries: 10
          delay: 1
          when: cluster_fixture_api_job is defined

        - name: Remove synthetic provider fixture
          ansible.builtin.file:
            path: "{{ cluster_fixture_dir.path }}"
            state: absent
