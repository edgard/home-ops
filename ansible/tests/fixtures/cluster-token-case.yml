---
- name: Reset valid synthetic provider responses
  ansible.builtin.copy:
    dest: "{{ cluster_fixture_dir.path }}/{{ item.name }}.json"
    content: "{{ item.value | to_json }}"
    mode: "0600"
  loop:
    - {name: projects, value: "{{ cluster_fixture_project_rows }}"}
    - {name: secrets, value: "{{ cluster_fixture_value_rows }}"}
  loop_control:
    label: "{{ item.name }}"

- name: Deny excessive project access in invalid token scenario
  ansible.builtin.copy:
    dest: "{{ cluster_fixture_dir.path }}/projects.json"
    content: "{{ cluster_fixture_project_rows[:1] | to_json }}"
    mode: "0600"
  when: cluster_token_case.name == 'invalid-provider-access'

- name: Initialize isolated Kubernetes fixture state
  ansible.builtin.copy:
    dest: "{{ cluster_fixture_dir.path }}/api-state.json"
    content: "{{ {'scenario': cluster_token_case.name, 'token': 'c3ludGhldGljLXByZXZpb3VzLXRva2Vu', 'patches': [], 'reads': [], 'target_keys': cluster_fixture_target_keys} | to_json }}"
    mode: "0600"

- name: Reset observed token rejection
  ansible.builtin.set_fact:
    cluster_token_rejected: false
    cluster_token_failure_message: ""

- name: Exercise the native scoped token workflow
  block:
    - name: Run native validation and token transaction
      ansible.builtin.include_role:
        name: platform
        tasks_from: sync_token
  rescue:
    - name: Record transaction failure
      ansible.builtin.set_fact:
        cluster_token_rejected: true
        cluster_token_failure_message: "{{ ansible_failed_result.msg | default('') }}"

- name: Inspect synthetic API transaction results
  ansible.builtin.set_fact:
    cluster_fixture_api_result: "{{ lookup('file', cluster_fixture_dir.path ~ '/api-state.json') | from_json }}"

- name: Require scoped mutation and original-token rollback semantics
  ansible.builtin.assert:
    that:
      - cluster_token_rejected == cluster_token_case.rejected
      - cluster_fixture_api_result.patches == cluster_token_case.patches
      - "cluster_token_case.name not in ['ambiguous-patch', 'reconciliation-failure', 'store-read-failure', 'es-read-failure', 'target-read-failure'] or cluster_token_failure_message == 'ESO token reconciliation failed; previous token restored.'"
      - "cluster_token_case.name != 'restore-failure' or cluster_token_failure_message == 'ESO token reconciliation failed; previous token restoration failed.'"
      - "cluster_token_case.name != 'invalid-provider-access' or cluster_fixture_api_result.reads | length == 0"
      - "cluster_token_case.name == 'success' or cluster_fixture_api_result.token == 'c3ludGhldGljLXByZXZpb3VzLXRva2Vu'"

- name: Require fixture errors to reach their intended API boundary
  ansible.builtin.assert:
    that:
      - "cluster_token_case.name != 'previous-read-failure' or '/api/v1/namespaces/platform-system/secrets/bitwarden-credentials' in cluster_fixture_api_result.reads"
      - "cluster_token_case.name != 'store-read-failure' or '/apis/external-secrets.io/v1/clustersecretstores/external-secrets-store' in cluster_fixture_api_result.reads"
      - "cluster_token_case.name != 'es-read-failure' or cluster_fixture_es_path in cluster_fixture_api_result.reads"
      - "cluster_token_case.name != 'target-read-failure' or cluster_fixture_target_path in cluster_fixture_api_result.reads"
  vars:
    cluster_fixture_es_path: "/apis/external-secrets.io/v1/namespaces/{{ platform_secret_manifests[0].metadata.namespace }}/externalsecrets/{{ platform_secret_manifests[0].metadata.name }}"
    cluster_fixture_target_path: "/api/v1/namespaces/{{ platform_secret_manifests[0].metadata.namespace }}/secrets/{{ platform_secret_manifests[0].spec.target.name }}"
