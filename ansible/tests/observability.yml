        that:
          - not item.stat.exists
      loop: "{{ observability_forbidden_app_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Assert Restic includes durable Victoria state only
      ansible.builtin.assert:
        that:
          - "'/data/appdata/platform-system/storage-victoria-metrics-k8s-stack-grafana-0' not in observability_restic_values.controllers.backup.containers.app.args"
          - "'/data/appdata/platform-system/server-volume-victoria-logs-single-server-0' not in observability_restic_values.controllers.backup.containers.app.args"
