---
- name: Validate Victoria observability contracts
  hosts: localhost
  gather_facts: false
  vars:
    observability_repo_root: "{{ playbook_dir }}/../.."
    observability_required_victoria_crds:
      - victoria-metrics-k8s-stack-vmagent.customresourcedefinition.yaml
      - victoria-metrics-k8s-stack-vmalertmanagerconfig.customresourcedefinition.yaml
      - victoria-metrics-k8s-stack-vmanomalyconfig.customresourcedefinition.yaml
      - victoria-metrics-k8s-stack-vmnodescrape.customresourcedefinition.yaml
      - victoria-metrics-k8s-stack-vmpodscrape.customresourcedefinition.yaml
      - victoria-metrics-k8s-stack-vmprobe.customresourcedefinition.yaml
      - victoria-metrics-k8s-stack-vmrule.customresourcedefinition.yaml
      - victoria-metrics-k8s-stack-vmscrapeconfig.customresourcedefinition.yaml
      - victoria-metrics-k8s-stack-vmservicescrape.customresourcedefinition.yaml
      - victoria-metrics-k8s-stack-vmsingle.customresourcedefinition.yaml
      - victoria-metrics-k8s-stack-vmstaticscrape.customresourcedefinition.yaml
      - victoria-metrics-k8s-stack-vmuser.customresourcedefinition.yaml
    observability_disabled_victoria_controllers:
      - AlertmanagerConfig
      - PodMonitor
      - Probe
      - PrometheusRule
      - ScrapeConfig
      - ServiceMonitor
      - VLAgent
      - VLCluster
      - VLDistributed
      - VLogs
      - VLSingle
      - VMAlert
      - VMAlertmanager
      - VMAlertmanagerConfig
      - VMAnomaly
      - VMAnomalyConfig
      - VMAuth
      - VMCluster
      - VMDistributed
      - VMRule
      - VMScrapeConfig
      - VMStaticScrape
      - VTSingle
      - VTCluster
      - VMUser
    observability_alerts:
      - ArgoCDAppUnhealthy
      - BlackboxProbeFailed
      - CertificateExpiringSoon
      - CoreScrapeTargetDown
      - GrafanaNotificationFailures
      - KubePersistentVolumeErrors
      - KubePersistentVolumeFillingUp
      - NodeFilesystemAlmostFull
      - NodeMemoryAvailableLow
      - NodeNotReady
      - PodContainerOOMKilled
      - PodRestartingFrequently
      - ResticBackupStale
      - VLAgentDown
      - VMAgentDown
      - VMAgentRemoteWriteFailures
      - VMSingleDown
      - VictoriaLogsDown
      - VictoriaLogsRowsDropped
      - VictoriaMetricsOperatorDown
    observability_dashboard_sources:
      - node-exporter-full
      - victorialogs-single-node
      - victoriametrics-single-node

  tasks:
    - name: Find the selectively vendored VictoriaMetrics CRDs
      ansible.builtin.find:
        paths: "{{ observability_repo_root }}/apps/platform-system/victoria-metrics-k8s-stack/manifests"
        patterns: "*.customresourcedefinition.yaml"
        file_type: file
      register: observability_victoria_crd_files

    - name: Read observability configuration
      ansible.builtin.slurp:
        src: "{{ observability_repo_root }}/{{ item }}"
      loop:
        - apps/platform-system/victoria-metrics-k8s-stack/app.yaml
        - apps/platform-system/victoria-metrics-k8s-stack/values.yaml
        - apps/platform-system/victoria-metrics-k8s-stack/manifests/victoria-metrics-k8s-stack-grafana-alerting.configmap.yaml
        - apps/platform-system/victoria-logs-single/app.yaml
        - apps/platform-system/victoria-logs-single/values.yaml
        - apps/platform-system/victoria-logs-collector/app.yaml
        - apps/platform-system/victoria-logs-collector/values.yaml
        - apps/platform-system/victoria-logs-single/manifests/victoria-logs-single-pod-explorer.configmap.yaml
        - apps/selfhosted/restic/values.yaml
        - ansible/roles/restic/defaults/main.yml
        - apps/platform-system/victoria-metrics-k8s-stack/manifests/victoria-metrics-k8s-stack-grafana-alerting-credentials.externalsecret.yaml
      register: observability_files

    - name: Find custom Grafana dashboards
      ansible.builtin.find:
        paths: "{{ observability_repo_root }}/apps"
        patterns: "*.configmap.yaml"
        recurse: true
        file_type: file
      register: observability_configmap_files

    - name: Read custom Grafana dashboards
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ observability_configmap_files.files }}"
      register: observability_configmap_contents

    - name: Parse observability configuration
      ansible.builtin.set_fact:
        observability_metrics_app: "{{ observability_files.results[0].content | b64decode | from_yaml }}"
        observability_metrics_values: "{{ observability_files.results[1].content | b64decode | from_yaml }}"
        observability_alerting_configmap: "{{ observability_files.results[2].content | b64decode | from_yaml }}"
        observability_logs_app: "{{ observability_files.results[3].content | b64decode | from_yaml }}"
        observability_logs_values: "{{ observability_files.results[4].content | b64decode | from_yaml }}"
        observability_collector_app: "{{ observability_files.results[5].content | b64decode | from_yaml }}"
        observability_collector_values: "{{ observability_files.results[6].content | b64decode | from_yaml }}"
        observability_logs_dashboard: "{{ observability_files.results[7].content | b64decode | from_yaml }}"
        observability_restic_values: "{{ observability_files.results[8].content | b64decode | from_yaml }}"
        observability_restic_defaults: "{{ observability_files.results[9].content | b64decode | from_yaml }}"
        observability_alerting_credentials: "{{ observability_files.results[10].content | b64decode | from_yaml }}"
        observability_custom_dashboards: "{{ observability_configmap_contents.results | map(attribute='content') | map('b64decode') | map('from_yaml') | selectattr('metadata.labels.grafana_dashboard', 'defined') | selectattr('metadata.labels.grafana_dashboard', 'equalto', '1') | list }}"

    - name: Parse Grafana alerting resources
      ansible.builtin.set_fact:
        observability_grafana_rules: "{{ observability_alerting_configmap.data['rules.yaml'] | from_yaml }}"
        observability_grafana_contactpoints: "{{ observability_alerting_configmap.data['contactpoints.yaml'] | from_yaml }}"
        observability_grafana_policies: "{{ observability_alerting_configmap.data['policies.yaml'] | from_yaml }}"

    - name: Flatten Grafana alert rules
      ansible.builtin.set_fact:
        observability_all_grafana_rules: "{{ observability_grafana_rules.groups | map(attribute='rules') | flatten }}"

    - name: Assert single-node metrics architecture and retention
      ansible.builtin.assert:
        that:
          - observability_metrics_app.chart.repo == "https://victoriametrics.github.io/helm-charts/"
          - observability_metrics_app.chart.name == "victoria-metrics-k8s-stack"
          - observability_metrics_app.sync.wave == "-4"
          - observability_metrics_values['victoria-metrics-operator'].crds.enabled is false
          - observability_metrics_values['victoria-metrics-operator'].crds.plain is false
          - observability_metrics_values['victoria-metrics-operator'].operator.disable_prometheus_converter is true
          - observability_metrics_values['victoria-metrics-operator'].extraArgs['controller.disableReconcileFor'].split(',') | sort == observability_disabled_victoria_controllers | sort
          - observability_metrics_values.defaultRules.enabled is false
          - observability_metrics_values.alertmanager.enabled is false
          - observability_metrics_values.vmalert.enabled is false
          - observability_metrics_values.vmsingle.enabled is true
          - observability_metrics_values.vmsingle.spec.replicaCount == 1
          - observability_metrics_values.vmsingle.spec.retentionPeriod == "30d"
          - observability_metrics_values.vmsingle.spec.storage.storageClassName == "nfs-fast"
          - observability_metrics_values.vmsingle.spec.storage.resources.requests.storage == "50Gi"
          - observability_metrics_values.vmsingle.spec.resources.limits is not defined
          - observability_metrics_values.vmagent.enabled is true
          - observability_metrics_values.vmagent.spec.replicaCount == 1
          - observability_metrics_values.vmagent.spec.resources.limits is not defined
          - observability_victoria_crd_files.files | map(attribute='path') | map('basename') | sort == observability_required_victoria_crds | sort

    - name: Assert Grafana ownership, persistence, and data sources
      ansible.builtin.assert:
        that:
          - observability_metrics_values.grafana.persistence.enabled is true
          - observability_metrics_values.grafana.persistence.storageClassName == "nfs-fast"
          - observability_metrics_values.grafana.persistence.size == "5Gi"
          - observability_metrics_values.grafana['grafana.ini']['auth.anonymous'].org_role == "Viewer"
          - observability_metrics_values.grafana.envFromSecret == "grafana-alerting-credentials"
          - observability_metrics_values.grafana.plugins | map('regex_replace', '@.*$', '') | list == ["victoriametrics-logs-datasource"]
          - observability_metrics_values.grafana.extraConfigmapMounts | selectattr('configMap', 'equalto', observability_alerting_configmap.metadata.name) | list | length == 1
          - (observability_metrics_values.grafana.extraConfigmapMounts | selectattr('configMap', 'equalto', observability_alerting_configmap.metadata.name) | first).mountPath == "/etc/grafana/provisioning/alerting"
          - observability_metrics_values.defaultDatasources.victoriametrics.datasources | length == 1
          - observability_metrics_values.defaultDatasources.victoriametrics.datasources[0].uid == "prometheus"
          - observability_metrics_values.defaultDatasources.victoriametrics.datasources[0].isDefault is true
          - observability_metrics_values.defaultDatasources.victoriametrics.datasources[0].editable is false
          - observability_metrics_values.defaultDatasources.victorialogs.datasources | length == 1
          - observability_metrics_values.defaultDatasources.victorialogs.datasources[0].uid == "victorialogs"
          - observability_metrics_values.defaultDatasources.victorialogs.datasources[0].editable is false
          - observability_metrics_values.defaultDatasources.alertmanager.datasources | length == 0

    - name: Assert five-dashboard and twenty-alert inventory
      ansible.builtin.assert:
        that:
          - observability_metrics_values.defaultDashboards.dashboards | dict2items | selectattr('key', 'in', observability_dashboard_sources) | map(attribute='value.enabled') | unique == [true]
          - observability_metrics_values.defaultDashboards.dashboards | dict2items | selectattr('value.enabled') | list | length == 3
          - observability_custom_dashboards | length == 2
          - observability_all_grafana_rules | length == 20
          - observability_all_grafana_rules | map(attribute='title') | sort == observability_alerts | sort
          - observability_all_grafana_rules | selectattr('record', 'defined') | length == 0
          - observability_all_grafana_rules | map(attribute='noDataState') | unique == ['OK']
          - observability_all_grafana_rules | map(attribute='execErrState') | unique == ['Error']
          - observability_all_grafana_rules | map(attribute='uid') | list | length == observability_all_grafana_rules | map(attribute='uid') | unique | length

    - name: Assert Telegram notification resources are connected
      ansible.builtin.assert:
        that:
          - observability_grafana_contactpoints.contactPoints[0].receivers[0].type == "telegram"
          - observability_grafana_contactpoints.contactPoints[0].receivers[0].disableResolveMessage is false
          - observability_grafana_contactpoints.contactPoints[0].receivers[0].settings.bottoken == "$TELEGRAM_BOT_TOKEN"
          - observability_grafana_contactpoints.contactPoints[0].receivers[0].settings.chatid == "$TELEGRAM_CHAT_ID"
          - observability_grafana_policies.policies[0].receiver == observability_grafana_contactpoints.contactPoints[0].name
          - observability_alerting_credentials.spec.target.name == observability_metrics_values.grafana.envFromSecret
          - observability_alerting_credentials.spec.data | map(attribute='secretKey') | sort == [observability_grafana_contactpoints.contactPoints[0].receivers[0].settings.bottoken | regex_replace('^\\$', ''), observability_grafana_contactpoints.contactPoints[0].receivers[0].settings.chatid | regex_replace('^\\$', '')] | sort
          - observability_alerting_credentials.spec.data | map(attribute='remoteRef.key') | reject('equalto', '') | list | length == 2
          - observability_alerting_credentials.spec.data | map(attribute='remoteRef.key') | unique | list | length == 2

    - name: Assert persistent internal logs architecture
      ansible.builtin.assert:
        that:
          - observability_logs_app.chart.name == "victoria-logs-single"
          - observability_logs_values.server.retentionPeriod == "30d"
          - observability_logs_values.server.persistentVolume.enabled is true
          - observability_logs_values.server.persistentVolume.storageClassName == "nfs-fast"
          - observability_logs_values.server.persistentVolume.size == "30Gi"
          - observability_logs_values.server.vmServiceScrape.enabled is true
          - observability_logs_values.vector.enabled is false
          - observability_logs_values.dashboards.enabled is false
          - observability_collector_app.chart.name == "victoria-logs-collector"
          - observability_collector_values.remoteWrite[0].url == observability_metrics_values.external.vl.read.url
          - observability_collector_values.remoteWrite[0].url == 'http://' + observability_logs_app.chart.name + '-server.platform-system.svc.cluster.local:9428'
          - (observability_collector_values.collector.extraFields | from_json).cluster == 'homelab'
          - observability_collector_values.collector.streamFields | sort == ["cluster", "kubernetes.container_name", "kubernetes.pod_labels.app.kubernetes.io/name", "kubernetes.pod_namespace"] | sort
          - observability_collector_values.securityContext.readOnlyRootFilesystem is true
          - observability_collector_values.securityContext.allowPrivilegeEscalation is false
          - observability_collector_values.securityContext.capabilities.drop == ["ALL"]
          - observability_collector_values.defaultVolumeMounts[0].readOnly is true
          - observability_collector_values.persistence.volume.hostPath.path == "/var/lib/vl-collector"
          - observability_collector_values.podMonitor.enabled is true
          - observability_collector_values.podMonitor.vm is true

    - name: Assert the pod log dashboard uses VictoriaLogs
      ansible.builtin.assert:
        that:
          - observability_logs_dashboard.metadata.labels.grafana_dashboard == "1"
          - (observability_logs_dashboard.data['pod-logs.json'] | from_json).panels[0].datasource.uid == "victorialogs"
          - (observability_logs_dashboard.data['pod-logs.json'] | from_json).panels[0].targets[0].datasource.uid == "victorialogs"
          - (observability_logs_dashboard.data['pod-logs.json'] | from_json).panels[0].targets[0].expr is search('kubernetes.pod_namespace')

    - name: Assert Restic includes durable state and excludes the transient collector
      ansible.builtin.assert:
        that:
          - "'victoria-metrics-k8s-stack' not in observability_restic_defaults.restic_restore_excluded_apps"
          - "'victoria-logs-single' not in observability_restic_defaults.restic_restore_excluded_apps"
          - "'victoria-logs-collector' in observability_restic_defaults.restic_restore_excluded_apps"
          - "'/data/appdata/platform-system/storage-victoria-metrics-k8s-stack-grafana-0' not in observability_restic_values.controllers.backup.containers.app.args"
          - "'/data/appdata/platform-system/server-volume-victoria-logs-single-server-0' not in observability_restic_values.controllers.backup.containers.app.args"

    - name: Check forbidden observability apps are absent
      ansible.builtin.stat:
        path: "{{ observability_repo_root }}/apps/platform-system/{{ item }}"
      loop:
        - kube-prometheus-stack
        - loki
        - alloy
      register: observability_forbidden_apps

    - name: Assert forbidden observability apps are absent
      ansible.builtin.assert:
        that:
          - not item.stat.exists
      loop: "{{ observability_forbidden_apps.results }}"
