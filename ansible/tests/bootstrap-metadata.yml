---
- name: Validate bootstrap metadata resolution
  hosts: localhost
  gather_facts: false
  vars:
    bootstrap_metadata_repo_root: "{{ playbook_dir }}/../.."
  tasks:
    - name: Load inventory variables
      ansible.builtin.include_vars:
        file: "{{ bootstrap_metadata_repo_root }}/ansible/inventory/group_vars/all.yml"

    - name: Load platform role defaults
      ansible.builtin.include_vars:
        file: "{{ bootstrap_metadata_repo_root }}/ansible/roles/platform/defaults/main.yml"

    - name: Resolve every configured bootstrap release
      ansible.builtin.include_tasks: ../roles/platform/tasks/build_release.yml
      loop: "{{ platform_bootstrap_releases }}"
      loop_control:
        loop_var: platform_release

    - name: Compare every resolved release with its source metadata
      vars:
        source: "{{ lookup('ansible.builtin.file', bootstrap_metadata_repo_root + '/' + item.0.app_metadata) | from_yaml }}"
      ansible.builtin.assert:
        that:
          - item.1.name == item.0.name
          - item.1.namespace == item.0.namespace
          - item.1.phase == item.0.phase
          - item.1.chart_ref == (source.chart.name | default(source.chart.repo))
          - item.1.chart_repo_url == (source.chart.repo if source.chart.name is defined else none)
          - item.1.chart_version == source.chart.version | string
          - item.1.values_file == repo_root + '/' + item.0.values_file
          - item.1.manifests_dir == (repo_root + '/' + item.0.manifests_dir if item.0.manifests_dir is defined else none)
      loop: "{{ platform_bootstrap_releases | zip(platform_bootstrap_release_specs, strict=true) | list }}"
      loop_control:
        label: "{{ item.0.name }}"
