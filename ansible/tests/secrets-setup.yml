---
- name: Validate native operator tool installation
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Inspect native setup entry point
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../playbooks/secrets-setup.yml"
      register: secrets_setup_entry

    - name: Require an Ansible setup entry point
      ansible.builtin.assert:
        that: secrets_setup_entry.stat.exists
        fail_msg: Operator tool setup must use the repository Ansible workflow.

    - name: Create isolated tool installation fixture
      ansible.builtin.tempfile:
        state: directory
        suffix: secrets-setup-contract
      register: secrets_setup_fixture

    - name: Exercise checksum verification and bounded installation
      vars:
        operator_secrets_tools_directory: "{{ secrets_setup_fixture.path }}/bin"
        operator_secrets_tools_catalog:
          secretspec:
            url: "file://{{ secrets_setup_fixture.path }}/secretspec.tar.xz"
            checksum: "file://{{ secrets_setup_fixture.path }}/secretspec.tar.xz.sha256"
          bws:
            url: "file://{{ secrets_setup_fixture.path }}/bws.zip"
            checksum: "file://{{ secrets_setup_fixture.path }}/bws-checksums.txt"
      block:
        - name: Create fixture executables
          ansible.builtin.copy:
            content: "#!/bin/sh\nprintf '%s\\n' '{{ item }} fixture'\n"
            dest: "{{ secrets_setup_fixture.path }}/{{ item }}"
            mode: "0755"
          loop:
            - secretspec
            - bws

        - name: Create SecretSpec release archive
          ansible.builtin.command:
            argv:
              - tar
              - -cJf
              - "{{ secrets_setup_fixture.path }}/secretspec.tar.xz"
              - -C
              - "{{ secrets_setup_fixture.path }}"
              - secretspec
            creates: "{{ secrets_setup_fixture.path }}/secretspec.tar.xz"

        - name: Create BWS release archive
          ansible.builtin.command:
            argv:
              - zip
              - -j
              - "{{ secrets_setup_fixture.path }}/bws.zip"
              - "{{ secrets_setup_fixture.path }}/bws"
            creates: "{{ secrets_setup_fixture.path }}/bws.zip"

        - name: Calculate fixture release checksums
          ansible.builtin.stat:
            path: "{{ secrets_setup_fixture.path }}/{{ item }}"
            checksum_algorithm: sha256
          loop:
            - secretspec.tar.xz
            - bws.zip
          register: secrets_setup_archives

        - name: Publish individual SecretSpec checksum
          ansible.builtin.copy:
            content: "{{ secrets_setup_archives.results[0].stat.checksum }}\n"
            dest: "{{ secrets_setup_fixture.path }}/secretspec.tar.xz.sha256"
            mode: "0600"

        - name: Publish BWS checksum inventory
          ansible.builtin.copy:
            content: "{{ secrets_setup_archives.results[1].stat.checksum }}  bws.zip\n"
            dest: "{{ secrets_setup_fixture.path }}/bws-checksums.txt"
            mode: "0600"

        - name: Install only SecretSpec as in CI
          ansible.builtin.include_role:
            name: operator_secrets
            tasks_from: setup
          vars:
            operator_secrets_install_tools:
              - secretspec

        - name: Inspect selected and unselected binaries
          ansible.builtin.stat:
            path: "{{ operator_secrets_tools_directory }}/{{ item }}"
            checksum_algorithm: sha256
          loop:
            - secretspec
            - bws
          register: secrets_setup_selected

        - name: Assert CI installs only its selected executable
          ansible.builtin.assert:
            that:
              - secrets_setup_selected.results[0].stat.exists
              - secrets_setup_selected.results[0].stat.mode == '0755'
              - not secrets_setup_selected.results[1].stat.exists

        - name: Install the default operator tool set
          ansible.builtin.include_role:
            name: operator_secrets
            tasks_from: setup

        - name: Inspect installed executables
          ansible.builtin.stat:
            path: "{{ operator_secrets_tools_directory }}/{{ item }}"
            checksum_algorithm: sha256
          loop:
            - secretspec
            - bws
          register: secrets_setup_installed

        - name: Execute installed fixture tools
          ansible.builtin.command:
            argv:
              - "{{ operator_secrets_tools_directory }}/{{ item }}"
          changed_when: false
          loop:
            - secretspec
            - bws
          register: secrets_setup_executed

        - name: Assert both installed binaries run and preserve permissions
          ansible.builtin.assert:
            that:
              - secrets_setup_installed.results[0].stat.checksum == secrets_setup_selected.results[0].stat.checksum
              - secrets_setup_installed.results[0].stat.mode == '0755'
              - secrets_setup_installed.results[1].stat.mode == '0755'
              - secrets_setup_executed.results[0].stdout == 'secretspec fixture'
              - secrets_setup_executed.results[1].stdout == 'bws fixture'

        - name: Publish a corrupt SecretSpec checksum
          ansible.builtin.copy:
            content: "{{ '0' * 64 }}\n"
            dest: "{{ secrets_setup_fixture.path }}/secretspec.tar.xz.sha256"
            mode: "0600"

        - name: Attempt install with a corrupt release checksum
          block:
            - name: Run setup against corrupt release
              ansible.builtin.include_role:
                name: operator_secrets
                tasks_from: setup
              vars:
                operator_secrets_install_tools:
                  - secretspec

            - name: Mark unexpected checksum acceptance
              ansible.builtin.set_fact:
                secrets_setup_checksum_rejected: false
          rescue:
            - name: Confirm checksum rejection happened before extraction
              ansible.builtin.set_fact:
                secrets_setup_checksum_rejected: "{{ 'checksum' in ansible_failed_result.msg }}"

        - name: Inspect executable after rejected install
          ansible.builtin.stat:
            path: "{{ operator_secrets_tools_directory }}/secretspec"
            checksum_algorithm: sha256
          register: secrets_setup_preserved

        - name: Inspect rejected install staging directory
          ansible.builtin.stat:
            path: "{{ operator_secrets_tool_temp.path }}"
          register: secrets_setup_staging

        - name: Assert rejected release preserves installed binary and removes staging files
          ansible.builtin.assert:
            that:
              - secrets_setup_checksum_rejected
              - secrets_setup_preserved.stat.checksum == secrets_setup_installed.results[0].stat.checksum
              - not secrets_setup_staging.stat.exists
      always:
        - name: Remove tool installation fixture
          ansible.builtin.file:
            path: "{{ secrets_setup_fixture.path }}"
            state: absent
