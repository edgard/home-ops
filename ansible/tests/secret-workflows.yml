---
- name: Validate Ansible ownership of secret workflows
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Inspect retired standalone script directory
      ansible.builtin.stat:
        path: "{{ repo_root }}/scripts"
      register: secret_script_directory

    - name: Read operator task interface
      ansible.builtin.set_fact:
        secret_task_contract: "{{ lookup('ansible.builtin.file', repo_root + '/Taskfile.yaml') | from_yaml }}"

    - name: Require role-owned workflows and retire completed migration command
      ansible.builtin.assert:
        that:
          - not secret_script_directory.stat.exists
          - "'tf:migrate-secret-state' not in secret_task_contract.tasks"
          - "'scripts/' not in (secret_task_contract | to_json)"
          - "'secrets-setup.yml' in (secret_task_contract.tasks['secrets:setup'] | to_json)"
          - "'secrets-sync-cluster-token.yml' in (secret_task_contract.tasks['secrets:sync-cluster-token'] | to_json)"
        fail_msg: Secret orchestration must use Ansible playbooks and roles.

    - name: Check credential backup and crash artifact ignores
      ansible.builtin.command:
        argv: "{{ ['git', 'check-ignore', '--'] + secret_artifact_paths }}"
        chdir: "{{ repo_root }}"
      register: secret_ignored_artifacts
      changed_when: false
      vars:
        secret_artifact_paths:
          - .envrc.backup
          - .vault-password.backup
          - ansible/roles/talos/files/secrets.yaml.backup
          - terraform/crash.123.log
          - terraform/terraform.tfstate.backup
          - terraform/recovery.tfplan.backup

    - name: Require every protected artifact to remain ignored
      ansible.builtin.assert:
        that:
          - secret_ignored_artifacts.stdout_lines | length == 6
