---
- name: Find rendered routes
  ansible.builtin.find:
    paths: "{{ validation_rendered_root }}"
    recurse: true
    patterns: "*.yaml"
    file_type: file
  register: validation_rendered_files

- name: Find raw routes
  ansible.builtin.find:
    paths: "{{ validation_apps_root }}"
    recurse: true
    patterns: "*.httproute.yaml"
    file_type: file
  register: validation_raw_routes

- name: Read Gatus configuration
  ansible.builtin.set_fact:
    validation_gatus: "{{ lookup('ansible.builtin.file', validation_apps_root ~ '/platform-system/gatus/values.yaml') | from_yaml }}"
    validation_route_docs: []
    validation_actual_hosts: []

- name: Parse raw and rendered route documents
  ansible.builtin.set_fact:
    validation_route_docs: "{{ validation_route_docs + (lookup('ansible.builtin.file', item.path) | from_yaml_all | list) }}"
  loop: "{{ validation_rendered_files.files + validation_raw_routes.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Collect routed application hosts
  ansible.builtin.set_fact:
    validation_expected_hosts: >-
      {{ validation_route_docs
         | selectattr('kind', 'defined')
         | selectattr('kind', 'equalto', 'HTTPRoute')
         | map(attribute='spec.hostnames')
         | flatten
         | unique
         | difference(validation_gatus.gateway.route.hosts | default([]))
         | sort }}

- name: Collect Gatus HTTP targets
  ansible.builtin.set_fact:
    validation_actual_hosts: "{{ validation_actual_hosts + [item.url | urlsplit('hostname')] }}"
  loop: "{{ validation_gatus.config.endpoints }}"
  loop_control:
    label: "{{ item.url }}"
  when: item.url | urlsplit('scheme') in ['http', 'https']

- name: Assert Gatus matches routed applications
  ansible.builtin.assert:
    that:
      - validation_actual_hosts | length == validation_actual_hosts | unique | length
      - validation_expected_hosts | difference(validation_actual_hosts) | length == 0
      - validation_actual_hosts | difference(validation_expected_hosts) | length == 0
    fail_msg: >-
      Gatus coverage mismatch: missing={{ validation_expected_hosts | difference(validation_actual_hosts) }},
      obsolete={{ validation_actual_hosts | difference(validation_expected_hosts) }},
      duplicate={{ validation_actual_hosts | length != validation_actual_hosts | unique | length }}
