#:schema https://secretspec.dev/schema/secretspec.schema.json
[project]
name = "home-ops"
revision = "1.0"

[providers]
# Both aliases use the same home-ops/_provider/access_token Keychain item.
operator = { uri = "bws://e673cff3-d74c-42cf-8e82-b4e0012bb7db", credentials = { access_token = "keyring" } }
applications = { uri = "bws://16848a5f-8d25-4560-af64-b3b5014052e7", credentials = { access_token = "keyring" } }

[profiles.default]
TALOS_SECRETS_YAML = { description = "Existing Talos cluster identity", required = true, providers = ["operator"], ref = { item = "talos_secrets_yaml" } }
ESO_BWS_ACCESS_TOKEN = { description = "Shared read-only Bitwarden machine account token for ESO", required = true, providers = ["operator"], ref = { item = "eso_bws_access_token" } }
AWS_ACCESS_KEY_ID = { description = "OpenTofu B2 backend access key", required = true, providers = ["operator"], ref = { item = "terraform_backend_access_key_id" } }
AWS_SECRET_ACCESS_KEY = { description = "OpenTofu B2 backend secret key", required = true, providers = ["operator"], ref = { item = "terraform_backend_secret_access_key" } }
TF_VAR_cloudflare_api_token = { description = "Cloudflare API token", required = true, providers = ["applications"], ref = { item = "cloudflare_token" } }
TF_VAR_cloudflare_zone_id = { description = "Cloudflare zone identifier", required = true, providers = ["operator"], ref = { item = "cloudflare_zone_id" } }
TF_VAR_tailscale_client_id = { description = "Tailscale OAuth client ID", required = true, providers = ["operator"], ref = { item = "tailscale_oauth_client_id" } }
TF_VAR_tailscale_client_secret = { description = "Tailscale OAuth client secret", required = true, providers = ["applications"], ref = { item = "tailscale_oauth_client_secret" } }

[scopes.talos]
secrets = ["TALOS_SECRETS_YAML"]
[scopes.platform]
secrets = ["ESO_BWS_ACCESS_TOKEN"]
[scopes.cluster]
secrets = ["TALOS_SECRETS_YAML", "ESO_BWS_ACCESS_TOKEN"]
[scopes.terraform]
secrets = ["AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "TF_VAR_cloudflare_api_token", "TF_VAR_cloudflare_zone_id", "TF_VAR_tailscale_client_id", "TF_VAR_tailscale_client_secret"]
